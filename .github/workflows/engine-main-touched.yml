name: Engine main full / PR touched

# PRs enter only through gke-pr.yml's base-owned admission. Dispatch is a
# write-authorized public-input proof route and never publishes a gate status.
on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      source_event:
        type: string
        default: "pull_request"
      codegen_base_ref:
        required: true
        type: string
      codegen_head_ref:
        required: true
        type: string
      definition:
        required: true
        type: string
      workers:
        required: true
        type: string
    outputs:
      source_event:
        value: ${{ jobs.changes.outputs.source_event }}
      decision_result:
        value: ${{ jobs.outcomes.outputs.decision_result }}
      native_result:
        value: ${{ jobs.outcomes.outputs.native_result }}
      native:
        value: ${{ jobs.changes.outputs.native }}
      mode:
        value: ${{ jobs.changes.outputs.mode }}
      base:
        value: ${{ jobs.changes.outputs.base }}
      head:
        value: ${{ jobs.changes.outputs.head }}
      definition:
        value: ${{ jobs.changes.outputs.definition }}
      tree:
        value: ${{ jobs.changes.outputs.tree }}
      plan:
        value: ${{ jobs.changes.outputs.plan }}
      executed_plan:
        value: ${{ jobs.native.outputs.executed_plan }}
      execution_mode:
        value: ${{ jobs.native.outputs.execution_mode }}
      inventory:
        value: ${{ jobs.native.outputs.inventory }}
      coverage_complete:
        value: ${{ jobs.native.outputs.coverage_complete }}
  workflow_dispatch:
    inputs:
      source_event:
        description: "Source event being replayed; main pushes execute the full suite"
        type: choice
        default: "pull_request"
        options: ["pull_request", "push_main"]
      codegen_base_ref:
        description: "Full public before/base SHA (push before/after or PR merge-base diff)"
        required: true
        type: string
      codegen_head_ref:
        description: "Full public codegen head SHA, independent of this definition"
        required: true
        type: string
      workers:
        description: "Numeric build and pytest parallelism, at most 8"
        type: choice
        default: "8"
        options: ["1", "2", "4", "8"]

permissions: {}

# No workflow concurrency group: every main push must finish its own SHA's run.
jobs:
  changes:
    if: github.event_name == 'pull_request_target' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions: {contents: read}
    outputs:
      source_event: ${{ steps.plan.outputs.source_event }}
      native: ${{ steps.plan.outputs.native }}
      mode: ${{ steps.plan.outputs.mode }}
      base: ${{ steps.plan.outputs.base }}
      head: ${{ steps.plan.outputs.head }}
      definition: ${{ steps.plan.outputs.definition }}
      workers: ${{ steps.plan.outputs.workers }}
      tree: ${{ steps.plan.outputs.tree }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - name: Check out the trusted definition and driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.definition || github.workflow_sha }}
          path: workflow
          persist-credentials: false
      - name: Authorize public-input proof dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          BASE_SHA: ${{ inputs.codegen_base_ref }}
          HEAD_SHA: ${{ inputs.codegen_head_ref }}
          DEFINITION_SHA: ${{ github.workflow_sha }}
          SOURCE_EVENT: ${{ inputs.source_event }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -I workflow/tests/test_gke_pr_admission.py --proof-identity
      - name: Bind the exact main push without reading a later branch tip
        if: github.event_name == 'push'
        env:
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DELETED: ${{ toJSON(github.event.deleted) }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.after }}
          EVENT_SHA: ${{ github.sha }}
          DEFINITION_SHA: ${{ github.workflow_sha }}
        run: python3 -I workflow/tests/test_gke_pr_admission.py --push-identity
      - name: Check out admitted head as data for trusted selection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.codegen_head_ref || github.event.after }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - name: Decide native work with the trusted driver
        id: plan
        env:
          CODEGEN_BASE: ${{ inputs.codegen_base_ref || github.event.before }}
          CODEGEN_HEAD: ${{ inputs.codegen_head_ref || github.event.after }}
          DEFINITION_SHA: ${{ inputs.definition || github.workflow_sha }}
          WORKERS: ${{ inputs.workers || '8' }}
          SOURCE_EVENT: ${{ github.event_name == 'push' && 'push_main' || inputs.source_event || 'pull_request' }}
        run: |
          set -euo pipefail
          python3 -I workflow/scripts/ci_engine_main_touched.py plan \
            --repo candidate --base "$CODEGEN_BASE" --head "$CODEGEN_HEAD" \
            --definition "$DEFINITION_SHA" --workers "$WORKERS" \
            --source-event "$SOURCE_EVENT" \
            --out "$RUNNER_TEMP/engine-main-decision"
      - name: Retain diff, selection and visible skip explanation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-main-decision-${{ github.run_attempt }}
          path: ${{ runner.temp }}/engine-main-decision
          if-no-files-found: error

  native:
    name: Engine main native
    needs: [changes]
    if: needs.changes.result == 'success' && needs.changes.outputs.native == 'true'
    runs-on: ubuntu-24.04
    permissions: {contents: read}
    outputs:
      executed_plan: ${{ steps.execute.outputs.executed_plan }}
      completed_plan: ${{ steps.execute.outputs.completed_plan }}
      pytest_exit: ${{ steps.execute.outputs.pytest_exit }}
      audit_errors: ${{ steps.execute.outputs.audit_errors }}
      execution_mode: ${{ steps.execute.outputs.execution_mode }}
      inventory: ${{ steps.execute.outputs.inventory }}
      coverage_complete: ${{ steps.execute.outputs.coverage_complete }}
      full_success: ${{ steps.execute.outputs.full_success }}
      full_executed_plan: ${{ steps.execute.outputs.full_executed_plan }}
      engine_sha: ${{ steps.execute.outputs.engine_sha }}
      engine_tree: ${{ steps.execute.outputs.engine_tree }}
      construction_false: ${{ steps.execute.outputs.construction_false }}
      construction_true: ${{ steps.execute.outputs.construction_true }}
    env:
      PYTHONHASHSEED: "0"
      CXX: /usr/bin/g++
      PF_CI_LABELS: '["ubuntu-24.04"]'
    steps:
      - name: Check out the exact trusted definition
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.changes.outputs.definition }}
          path: workflow
          persist-credentials: false
      - name: Check out the exact tested codegen head and its existing assertions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.changes.outputs.head }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - name: Resolve public engine MAIN at job runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pineforge-4pass/pineforge-engine
          ref: main
          path: engine
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build fresh engine main and execute the bound full or PR touched suite
        id: execute
        env:
          CODEGEN_BASE: ${{ needs.changes.outputs.base }}
          CODEGEN_HEAD: ${{ needs.changes.outputs.head }}
          DEFINITION_SHA: ${{ needs.changes.outputs.definition }}
          WORKERS: ${{ needs.changes.outputs.workers }}
          EXPECTED_PLAN: ${{ needs.changes.outputs.plan }}
          SOURCE_EVENT: ${{ needs.changes.outputs.source_event }}
        run: |
          set -euo pipefail
          python -I workflow/scripts/ci_engine_main_touched.py run \
            --repo candidate --base "$CODEGEN_BASE" --head "$CODEGEN_HEAD" \
            --definition "$DEFINITION_SHA" --workers "$WORKERS" --engine engine \
            --source-event "$SOURCE_EVENT" \
            --expected-plan "$EXPECTED_PLAN" --out "$RUNNER_TEMP/engine-main-native"
      - name: Retain native identities, build and pytest logs, nodeids and JUnit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-main-native-${{ github.run_attempt }}
          path: ${{ runner.temp }}/engine-main-native
          if-no-files-found: error

  outcomes:
    name: Forward actual native dependency results
    needs: [changes, native]
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      decision_result: ${{ steps.forward.outputs.decision_result }}
      native_result: ${{ steps.forward.outputs.native_result }}
    steps:
      - name: Validate and forward job states without changing their meaning
        id: forward
        env:
          NEEDS: ${{ toJSON(needs) }}
        shell: python3 {0}
        run: |
          import json
          import os

          needs = json.loads(os.environ["NEEDS"])
          if not isinstance(needs, dict) or set(needs) != {"changes", "native"}:
              raise SystemExit("missing or unexpected native dependencies")
          results = {}
          for job in ("changes", "native"):
              row = needs[job]
              if not isinstance(row, dict) or row.get("result") not in (
                  "success", "failure", "cancelled", "skipped",
              ):
                  raise SystemExit(f"{job}: missing or invalid job result")
              results[job] = row["result"]
          # These are metadata, not a success verdict. Validate both before
          # writing either output; the caller still enforces identities/plan.
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"decision_result={results['changes']}\n")
              output.write(f"native_result={results['native']}\n")

  publish:
    name: Publish historical native check
    needs: [changes, native]
    if: always() && github.event_name == 'workflow_dispatch' && needs.changes.result == 'success' && needs.changes.outputs.native == 'true'
    runs-on: ubuntu-24.04
    permissions: {contents: read, actions: read, checks: write}
    steps:
      - name: Check out only the trusted publisher definition
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: workflow
          persist-credentials: false
      - name: Bind the completed native job and publish on the tested source SHA
        env:
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_SHA: ${{ inputs.codegen_base_ref }}
          HEAD_SHA: ${{ inputs.codegen_head_ref }}
          DEFINITION_SHA: ${{ github.workflow_sha }}
          SOURCE_EVENT: ${{ inputs.source_event }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SERVER_URL: ${{ github.server_url }}
          NEEDS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -I workflow/tests/test_gke_pr_admission.py --native-check
