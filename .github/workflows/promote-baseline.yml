# PineForge parity campaign — post-merge baseline promotion.
#
# Install into BOTH product repos, unchanged (the repo axis is auto-detected):
#   pineforge-engine/.github/workflows/promote-baseline.yml
#   pineforge-codegen-oss/.github/workflows/promote-baseline.yml
#
# On a merged PR it advances the campaign baseline one axis, reusing the
# snapshot the gate already measured. It promotes ONLY when the merge commit
# now on the base branch carries the gated PR head's TREE (a squash merge mints
# a new commit; the strict up-to-date rule keeps its tree the head's), the gate
# is green on that head, and `lab promote` finds the verdict that binds it:
#   engine   pineforge/verify and pineforge/parity success on the PR head (verify required in this product; the template's advisory rule (#375) is not applied here);
#            lab promote adopts the pair the merge gate's parity verdict
#            measured — the merged engine with the codegen the sweep measured
#            (ruling R2, 2026-09-26), PASS or neutral alike
#   codegen  the required `gate` context green (the trusted reporter's commit
#            status, else the check-run) and no check-run on the PR head
#            whose newest run (per app and name) failed, a cancelled run
#            never counting as the newest; and no required check (a context
#            of main's active branch rules, or `gate`) whose only completed
#            runs on the PR head were cancelled; lab promote needs a pr-gate PASS binding (baseline
#            engine, the PR head) and re-reads both trees from GitHub (the
#            verdict records commits, not trees; GH_TOKEN below)
# Otherwise the baseline stands. Exhausted empty PR lookups fail loudly.
# A docs-only codegen receipt names no measured snapshot. lab promote refuses
# it explicitly: the baseline stands, even when the required gate is green.
#
# It runs on a push to main, using MAIN's own copy at refs/heads/main. The
# promotion identity's workload-identity condition pins job_workflow_ref to
# `<repo>/.github/workflows/promote-baseline.yml@refs/heads/main` and the run
# ref to refs/heads/main (terraform/gcp/github-wif.tf). The pushed SHA must
# resolve to exactly one merged PR with that merge commit and base main.
# A nonempty nonmatching result or ambiguity skips promotion. Empty results allow
# three lookup attempts, 20 seconds apart, before failing; an answer with no page
# at all fails at once. It checks out and runs no PR code:
# it fetches the PR head's objects only to compare trees.
#
# A release commit has no pull request: each product's release.yml pushes it
# with the org App's token. When all three lookups are empty and the push actor
# is that App's bot, the run reads the pushed commit's parent and changed
# files. It skips, green and without promoting, only when the push is that one
# commit (its first parent is the commit main held before the push) and every
# changed path belongs to this repository's release file set; the release_tag
# route records that baseline.
# The set is picked by the repo axis and is never the union of the two:
#   engine   VERSION, docker/run_failure_codes_diff.json and a root-level
#            CHANGELOG* file
#   codegen  VERSION
# Any other push actor, a push of more than one commit, any other changed
# path, or a file list that cannot be read, fails as every other exhausted
# lookup does.
#
# A manual dispatch is checked before it can promote. Its inputs must be well
# formed: merge_commit and head_sha are 40 lowercase hex characters, pr_number
# is a positive number, pr_url is exactly this repository's URL of that PR, and
# merged_at is a UTC time in YYYY-MM-DDTHH:MM:SSZ form. The pull request API
# must then show the same PR number, merged, with that merge commit, that head,
# base main and that merge time, and the merge commit must list exactly that
# one PR. Any mismatch refuses the run.
#
# The promote job holds one concurrency group, and a run in progress is never
# cancelled: one promotion finishes before the next one starts. The lock is on
# that job, not on the workflow, so a run queues only after its guard has
# validated it: an invalid dispatch never queues.
#
# GitHub keeps one run in progress and ONE run waiting for a group: a merge
# that lands while another run is already waiting takes its place, and the
# replaced run is cancelled before it promoted anything. So every push run
# also examines the merges before its own: the last CATCH_UP_WINDOW (10)
# first-parent commits ending at the pushed one. Each earlier commit goes
# through the same steps as the run's own merge: one PR lookup, with no retry
# and no release exemption, then the same authorisation, tree check and gate.
# `lab promote --catch-up` then promotes what is owed: the newest merge that
# promotes first, then the merges after it in merge order. Every examined
# merge ends with one line in the step summary; a merge whose content a newer
# promoted merge already holds is reported as superseded, never silently
# dropped. An earlier merge that is refused, or cannot be read, fails the run
# at its end, after the others had their turn. A commit list that cannot be
# read examines nothing and is reported; the run's own merge then proceeds as
# before. A burst longer than the window is reported with the number of
# commits nobody examined. A manual dispatch promotes exactly the merge it
# names.
#
# A run that waited for the lock may no longer be the newest merge. So the
# promote job's first step, holding the lock and before any credential exists,
# reads main's tip. When the tip is the run's own merge, nothing changes. When
# main has moved on, the run still promotes the merges it examined, and every
# first-parent commit after its own merge is reported by name as NOT COMPARED
# ("not examined by this run: its own run may still follow; else dispatch
# it"); the run then ends red. No merge is missed silently.
# Each of those rows names the commit by its first 12 characters and its pull
# request, from one read-only lookup, and carries the line that dispatches
# that commit's own promotion:
#   gh workflow run promote-baseline.yml --ref main -f merge_commit=<sha>
#     -f head_sha=<sha> -f pr_number=<n> -f pr_url=<url> -f merged_at=<UTC>
# When the lookup fails, or names no single merged pull request, the row says
# which, gives that line with the field it has, names the fields still
# needed, and gives the route by hand: `lab promote --repo <axis>
# --merge-commit <sha> ... --dry-run` first, then the same without --dry-run.
#
# The run at main's tip always catches up, even when its own merge does not
# promote: a docs-only merge, a merge no verdict binds, an engine merge the
# diff rule cleared (each is deferred), or a merge handled with no baseline
# row. The earlier owed merges of its window are still attempted. The
# promotion of every merge, whichever run makes it, is bound to the baseline
# it was planned on: two runs never append twice on one baseline.
#
# An answer that cannot be read is never taken for "nothing there". For an
# earlier commit, a lookup answer that is not readable, a failed lookup, a
# failed tree check and a failed gate read are that commit's own row,
# unresolved: the other merges, the run's own included, still have their
# turn, and the run ends red. The last step always runs and writes one row for
# every examined commit to its log and to the step summary, whether or not the
# promotion ran. A row's reason is a fixed text: what a failed read printed
# stays in the log of the step that made it.
#
# Only exit code 2 of `lab promote --catch-up` is a deferral (every attempt
# was refused). A usage or plan error is 64 and fails the run. Before the
# call the run asks the tooling's own `--help` for `--catch-up`, and fails
# with a clear message when the tooling at WORKFLOW_REF predates it.
#
# A merge is promoted only when the active baseline's commit is its ancestor.
# When it is not (the active commit is off main), the merge is NOT COMPARED
# and never attempted; when that is the run's own merge, the run fails, with
# the row naming both commits: a run never ends green having promoted nothing
# without saying why. With no baseline registered at all, nothing changes: the
# run's own merge is attempted as it always was and refused by the promotion's
# own check (deferred, nothing written), and earlier merges are NOT COMPARED.
# This workflow registers no first baseline.
#
# The plane is GCP: the
# promotion reads the active baseline and the gate ledger from the Postgres
# registry through a cloud-sql-proxy, streams the pinned documents from the
# GCS evidence bucket, and appends the new baseline row — authenticated by
# workload identity federation, so no long-lived GCP key lives in the repo.
#
# Required in each product repo:
#   secrets PINEFORGE_APP_ID + PINEFORGE_APP_PRIVATE_KEY  the org App (already
#          present for release.yml) — the job mints a short-lived, read-only
#          token from it to check out the private pineforge-workflow repo, so
#          NO personal access token is needed
#   var    WORKFLOW_REPO         optional override, defaults to pineforge-4pass/pineforge-workflow
#   var    GCP_WORKLOAD_IDENTITY_PROVIDER
#          the full provider resource name — terraform/gcp output
#          `github_workload_identity_provider`
#   var    GCP_SERVICE_ACCOUNT
#          the dedicated promotion service account this workflow impersonates
#          through that provider — terraform/gcp output
#          `github_promotion_service_account`. Terraform binds the repo-pinned
#          federated identity to it (roles/iam.workloadIdentityUser) and
#          grants it exactly what the steps below use, and nothing else:
#          Cloud SQL Client on the registry instance (the proxy this job
#          starts), accessor on secret pineforge-registry-db (the DSN
#          password baseline-promote resolves), and objectViewer on the
#          evidence bucket (the three pinned documents it streams). No
#          Cloud Run role: this workflow executes no job. Nothing is left for
#          an operator to grant by hand.
#
# This file's PATH and REF are part of the identity: the WIF provider admits
# only `<owner>/<repo>/.github/workflows/promote-baseline.yml@refs/heads/main`,
# so installing it under another name, or running another branch's copy,
# mints no token — and no other workflow in the repo can mint one either.
#
# (Optionally pin WORKFLOW_REF, defaults to main; and PINEFORGE_EVIDENCE_BUCKET,
#  defaults to pineforge-workflow-evidence.)

name: promote-baseline

on:
  push:
    branches: [main]
  # Manual re-fire, from main, for a merge whose event already passed (e.g. a
  # PR merged before this workflow was installed): the commit now on the base
  # branch, the PR head the gate cleared, and the PR.
  workflow_dispatch:
    inputs:
      merge_commit:
        description: "40-hex commit now on the base branch to promote"
        required: true
      head_sha:
        description: "40-hex PR head the gate cleared (the merge commit must carry its tree)"
        required: true
      pr_number:
        description: "the PR number"
        required: true
      pr_url:
        description: "the PR URL in this repository (recorded in the merge receipt)"
        required: true
      merged_at:
        description: "UTC merge time in YYYY-MM-DDTHH:MM:SSZ form"
        required: true

permissions:
  contents: read
  # commits/{sha}/pulls needs pull-request read access for the repo-scoped
  # token, including when this unchanged workflow is installed in a private repo.
  pull-requests: read
  # The engine axis admits on pineforge/verify and pineforge/parity: verify required in this product; the template's advisory rule (#375) is not applied here.
  # Read `statuses`; the codegen axis reads check-runs: `checks`.
  statuses: read
  checks: read
  # Workload identity federation mints the GCP credential from the job's own
  # OIDC token; nothing here can promote without this repo's identity.
  id-token: write

jobs:
  promote-guard:
    name: promote-guard
    runs-on: ubuntu-24.04
    # Resolution reads pull request records and the pushed commit's file list:
    # a private repo needs both grants for them. No secrets or OIDC here.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ok: ${{ steps.authorize.outputs.ok }}
      merge_sha: ${{ steps.pr.outputs.merge_sha }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
      pr_url: ${{ steps.pr.outputs.pr_url }}
      merged_at: ${{ steps.pr.outputs.merged_at }}
      # Every commit this run examines, oldest first, the run's own merge
      # last; and what was read of the commits before it.
      merges: ${{ steps.authorize.outputs.merges }}
      window: ${{ steps.authorize.outputs.window }}
    steps:
      - name: Resolve the merged PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          INPUT_MERGE_SHA: ${{ github.event.inputs.merge_commit }}
          INPUT_HEAD_SHA: ${{ github.event.inputs.head_sha }}
          INPUT_PR_NUMBER: ${{ github.event.inputs.pr_number }}
          INPUT_PR_URL: ${{ github.event.inputs.pr_url }}
          INPUT_MERGED_AT: ${{ github.event.inputs.merged_at }}
          # The push event's actor, never the commit's author or committer.
          PUSH_ACTOR: ${{ github.actor }}
          # The commit main pointed at before this push.
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          fail() { echo "::error title=authz::$1"; echo "authz: REFUSED: $1" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          [ "$REF" = refs/heads/main ] || fail "baseline promotion requires refs/heads/main"
          case "$EVENT_NAME" in
            workflow_dispatch)
              [[ "$INPUT_MERGE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
                fail "merge_commit must be exactly 40 lowercase hexadecimal characters"
              [[ "$INPUT_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] ||
                fail "head_sha must be exactly 40 lowercase hexadecimal characters"
              [[ "$INPUT_PR_NUMBER" =~ ^[1-9][0-9]*$ ]] ||
                fail "pr_number must be a positive decimal integer"
              expected_pr_url="https://github.com/$REPO/pull/$INPUT_PR_NUMBER"
              [ "$INPUT_PR_URL" = "$expected_pr_url" ] ||
                fail "pr_url must equal $expected_pr_url"
              [[ "$INPUT_MERGED_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] ||
                fail "merged_at must be an ISO-8601 UTC timestamp in YYYY-MM-DDTHH:MM:SSZ form"
              if ! dispatch_pr=$(gh api "repos/$REPO/pulls/$INPUT_PR_NUMBER"); then
                fail "pr_number API lookup failed"
              fi
              [[ -n "${dispatch_pr//[[:space:]]/}" ]] ||
                fail "pr_number API lookup returned an empty response"
              if ! python3 - "$INPUT_PR_NUMBER" 3<<<"$dispatch_pr" <<'PY'
          import json
          import sys

          def reject_constant(value):
              raise ValueError(f"invalid JSON constant: {value}")

          try:
              with open(3, encoding="utf-8") as stream:
                  pr = json.load(stream, parse_constant=reject_constant)
          except (OSError, RecursionError, ValueError):
              raise SystemExit(1)
          number = pr.get("number") if isinstance(pr, dict) else None
          if not (type(number) is int and number == int(sys.argv[1])):
              raise SystemExit(1)
          PY
              then
                fail "pr_number does not match the PR API response"
              fi
              if ! python3 - 3<<<"$dispatch_pr" <<'PY'
          import json

          def reject_constant(value):
              raise ValueError(f"invalid JSON constant: {value}")

          try:
              with open(3, encoding="utf-8") as stream:
                  pr = json.load(stream, parse_constant=reject_constant)
          except (OSError, RecursionError, ValueError):
              raise SystemExit(1)
          if not (isinstance(pr, dict) and pr.get("merged") is True):
              raise SystemExit(1)
          PY
              then
                fail "pr_number API record is not merged"
              fi
              if ! python3 - "$INPUT_MERGE_SHA" 3<<<"$dispatch_pr" <<'PY'
          import json
          import sys

          def reject_constant(value):
              raise ValueError(f"invalid JSON constant: {value}")

          try:
              with open(3, encoding="utf-8") as stream:
                  pr = json.load(stream, parse_constant=reject_constant)
          except (OSError, RecursionError, ValueError):
              raise SystemExit(1)
          if not (isinstance(pr, dict) and pr.get("merge_commit_sha") == sys.argv[1]):
              raise SystemExit(1)
          PY
              then
                fail "merge_commit does not match the PR merge_commit_sha"
              fi
              if ! python3 - "$INPUT_HEAD_SHA" 3<<<"$dispatch_pr" <<'PY'
          import json
          import sys

          def reject_constant(value):
              raise ValueError(f"invalid JSON constant: {value}")

          try:
              with open(3, encoding="utf-8") as stream:
                  pr = json.load(stream, parse_constant=reject_constant)
          except (OSError, RecursionError, ValueError):
              raise SystemExit(1)
          if not (
              isinstance(pr, dict)
              and isinstance(pr.get("head"), dict)
              and pr["head"].get("sha") == sys.argv[1]
          ):
              raise SystemExit(1)
          PY
              then
                fail "head_sha does not match the PR head.sha"
              fi
              if ! python3 - 3<<<"$dispatch_pr" <<'PY'
          import json

          def reject_constant(value):
              raise ValueError(f"invalid JSON constant: {value}")

          try:
              with open(3, encoding="utf-8") as stream:
                  pr = json.load(stream, parse_constant=reject_constant)
          except (OSError, RecursionError, ValueError):
              raise SystemExit(1)
          if not (
              isinstance(pr, dict)
              and isinstance(pr.get("base"), dict)
              and pr["base"].get("ref") == "main"
          ):
              raise SystemExit(1)
          PY
              then
                fail "pr_number API record does not use base main"
              fi
              if ! python3 - "$INPUT_MERGED_AT" 3<<<"$dispatch_pr" <<'PY'
          import json
          import sys

          def reject_constant(value):
              raise ValueError(f"invalid JSON constant: {value}")

          try:
              with open(3, encoding="utf-8") as stream:
                  pr = json.load(stream, parse_constant=reject_constant)
          except (OSError, RecursionError, ValueError):
              raise SystemExit(1)
          if not (isinstance(pr, dict) and pr.get("merged_at") == sys.argv[1]):
              raise SystemExit(1)
          PY
              then
                fail "merged_at does not match the PR merged_at"
              fi
              if ! dispatch_pulls=$(gh api --paginate --slurp \
                "repos/$REPO/commits/$INPUT_MERGE_SHA/pulls?per_page=100"); then
                fail "merge_commit API lookup failed"
              fi
              [[ -n "${dispatch_pulls//[[:space:]]/}" ]] ||
                fail "merge_commit API lookup returned an empty response"
              if ! python3 - "$INPUT_PR_NUMBER" 3<<<"$dispatch_pulls" <<'PY'
          import json
          import sys

          def reject_constant(value):
              raise ValueError(f"invalid JSON constant: {value}")

          try:
              with open(3, encoding="utf-8") as stream:
                  pages = json.load(stream, parse_constant=reject_constant)
          except (OSError, RecursionError, ValueError):
              raise SystemExit(1)
          pulls = (
              [pr for page in pages for pr in page]
              if isinstance(pages, list) and all(isinstance(page, list) for page in pages)
              else []
          )
          if not (
              isinstance(pages, list)
              and all(isinstance(page, list) for page in pages)
              and len(pulls) == 1
              and isinstance(pulls[0], dict)
              and type(pulls[0].get("number")) is int
              and pulls[0].get("number") == int(sys.argv[1])
          ):
              raise SystemExit(1)
          PY
              then
                fail "merge_commit must list exactly pull request $INPUT_PR_NUMBER"
              fi
              printf '%s\n' "merge_sha=$INPUT_MERGE_SHA" "head_sha=$INPUT_HEAD_SHA" \
                "pr_number=$INPUT_PR_NUMBER" "pr_url=$INPUT_PR_URL" \
                "merged_at=$INPUT_MERGED_AT" "ok=true" >> "$GITHUB_OUTPUT"
              exit 0 ;;
            push) ;;
            *) fail "event $EVENT_NAME does not run baseline promotion (only push and workflow_dispatch are allowed)" ;;
          esac
          # A push run also examines the merges before its own: the last
          # CATCH_UP_WINDOW first-parent commits ending at the pushed one.
          CATCH_UP_WINDOW=10
          # One commit's merged PR, from the lookup answer on file descriptor 3.
          # The caller names the commit, the file that takes its outputs and
          # the file that takes a refusal. Status 0: the answer was read, and
          # the outputs hold the PR's values or a skip (ok=false). Status 3: a
          # valid empty answer. Any other status: a check failed.
          # An answer that cannot be read (not JSON, or not pages of pull
          # request records) is a skip for the run's own merge, as it always
          # was. For an earlier commit the caller names a fourth argument, the
          # status such an answer ends with: unread is never "no pull request".
          resolve_pulls() {
            SHA="$1" GITHUB_OUTPUT="$2" GITHUB_STEP_SUMMARY="$3" UNREADABLE_STATUS="${4:-0}" python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          def skip(reason):
              print(f"::notice::{reason}; skipping")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("ok=false\n")

          def unreadable(reason):
              status = int(os.environ["UNREADABLE_STATUS"])
              if status == 0:
                  skip(reason)
              else:
                  print(f"{reason}; not resolved")
              raise SystemExit(status)

          def fail(reason):
              print(f"::error title=authz::{reason}")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write(f"authz: REFUSED: {reason}\n")
              raise SystemExit(1)

          def reject_constant(value):
              raise ValueError(f"invalid JSON constant: {value}")

          def field(obj, *keys):
              for key in keys:
                  obj = obj.get(key) if isinstance(obj, dict) else None
              if (not isinstance(obj, str) or not obj.strip()
                      or any(ord(char) < 32 for char in obj)):
                  fail("empty or unreadable PR field: " + ".".join(keys))
              return obj

          sha = os.environ["SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              fail("empty or unreadable pushed SHA")
          try:
              pages = json.loads(open(3, encoding="utf-8").read(), parse_constant=reject_constant)
          except (ValueError, RecursionError):
              unreadable("invalid merged PR response JSON")
          if (not isinstance(pages, list)
                  or any(not isinstance(page, list) for page in pages)
                  or any(not isinstance(pr, dict) for page in pages for pr in page)):
              unreadable("invalid merged PR response page array")
          # An answer with no page at all is an anomaly, never an empty result:
          # it fails the run at once, with no retry and no release exemption.
          if not pages:
              fail("merged PR response has no page")
          matches = [pr for page in pages for pr in page
                     if pr.get("state") == "closed"
                     and pr.get("merged_at") is not None
                     and pr.get("merge_commit_sha") == sha
                     and isinstance(pr.get("base"), dict)
                     and pr["base"].get("ref") == "main"]
          if not matches and not any(pages):
              # A valid empty result alone permits another lookup: one or
              # more pages, every one of them an empty list.
              raise SystemExit(3)
          if len(matches) != 1:
              skip(f"found {len(matches)} merged PRs with merge commit {sha} and base main")
              raise SystemExit(0)
          selected = matches[0]
          number = selected.get("number")
          if type(number) is not int or number <= 0:
              fail("empty or unreadable PR number")
          # The association endpoint returns a summary PR without merged_by.
          # Read that selected PR's full API response, binding it to the same
          # merge, base and head before using any identity or merge metadata.
          try:
              response = subprocess.run(
                  ["gh", "api", f"repos/{os.environ['REPO']}/pulls/{number}"],
                  check=True, capture_output=True, text=True)
              pr = json.loads(response.stdout, parse_constant=reject_constant)
          except (subprocess.CalledProcessError, OSError, ValueError, RecursionError):
              fail("unreadable resolved PR response")
          if (not isinstance(pr, dict) or type(pr.get("number")) is not int
                  or pr.get("number") != number
                  or pr.get("state") != "closed" or pr.get("merged") is not True
                  or pr.get("merge_commit_sha") != sha
                  or field(pr, "base", "ref") != "main"
                  or field(pr, "head", "sha") != field(selected, "head", "sha")
                  or field(pr, "merged_at") != field(selected, "merged_at")):
              fail("resolved PR no longer matches the pushed merge")
          head_sha = field(pr, "head", "sha")
          if not re.fullmatch(r"[0-9a-f]{40}", head_sha):
              fail("empty or unreadable PR head SHA")
          head = pr.get("head")
          repo = head.get("repo") if isinstance(head, dict) else None
          fork = repo.get("fork") if isinstance(repo, dict) else None
          if type(fork) is not bool:
              fail("empty or unreadable PR field: head.repo.fork")
          values = {
              "merge_sha": sha,
              "head_sha": head_sha,
              "pr_number": number,
              "pr_url": field(pr, "html_url"),
              "merged_at": field(pr, "merged_at"),
              "head_repo": field(pr, "head", "repo", "full_name"),
              "head_is_fork": str(fork).lower(),
              "association": field(pr, "author_association"),
              "pr_author": field(pr, "user", "login"),
              "merged_by": field(pr, "merged_by", "login"),
              "ok": "true",
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in values.items():
                  output.write(f"{key}={value}\n")
          PY
          }
          # The first-parent commits before the pushed one, oldest first, for
          # the next step. Each gets ONE lookup, with no retry and no release
          # exemption, and its result is a row there, never this step's exit.
          # A commit list that cannot be read is recorded and examines nothing.
          examine_window() {
            local commits missed oldest pulls status window_status=0
            local guard_dir="$RUNNER_TEMP/promote-guard"
            mkdir -p "$guard_dir"
            commits=$(gh api "repos/$REPO/commits?sha=$SHA&per_page=100") || window_status=$?
            if [ "$window_status" -eq 0 ]; then
              python3 - "$CATCH_UP_WINDOW" 3<<<"$commits" > "$guard_dir/window" <<'WINDOW_PY' || window_status=$?
          import json
          import os
          import re
          import sys

          def reject_constant(value):
              raise ValueError(f"invalid JSON constant: {value}")

          def commit_id(value):
              if isinstance(value, str) and re.fullmatch(r"[0-9a-f]{40}", value):
                  return value
              return None

          limit = int(sys.argv[1])
          try:
              with open(3, encoding="utf-8") as stream:
                  records = json.load(stream, parse_constant=reject_constant)
          except (OSError, ValueError, RecursionError):
              raise SystemExit(1)
          if not isinstance(records, list):
              raise SystemExit(1)
          # Each listed commit with its first parent; a root commit has none.
          first_parent = {}
          for record in records:
              commit = commit_id(record.get("sha")) if isinstance(record, dict) else None
              parents = record.get("parents") if isinstance(record, dict) else None
              if commit is None or not isinstance(parents, list):
                  raise SystemExit(1)
              parent = None
              if parents:
                  parent = commit_id(parents[0].get("sha")) if isinstance(parents[0], dict) else None
                  if parent is None:
                      raise SystemExit(1)
              first_parent[commit] = parent
          current = os.environ["SHA"]
          if current not in first_parent:
              raise SystemExit(1)
          # Walk first parents back from the pushed commit, which is the
          # window's newest member. A parent the list does not hold is unread:
          # the window is refused, never cut short.
          earlier = []
          while len(earlier) < limit - 1:
              current = first_parent[current]
              if current is None:
                  break
              if current not in first_parent:
                  raise SystemExit(1)
              earlier.append(current)
          for commit in reversed(earlier):
              print(commit)
          WINDOW_PY
            fi
            if [ "$window_status" -ne 0 ]; then
              jq -cn --argjson limit "$CATCH_UP_WINDOW" \
                --arg error "the first-parent commits before $SHA could not be read (status $window_status)" \
                '{limit: $limit, error: $error}' > "$guard_dir/window.json"
              return 0
            fi
            oldest=$(head -n 1 "$guard_dir/window")
            [ -n "$oldest" ] || oldest="$SHA"
            jq -cn --argjson limit "$CATCH_UP_WINDOW" --arg oldest "$oldest" \
              '{limit: $limit, oldest: $oldest}' > "$guard_dir/window.json"
            while IFS= read -r missed <&4; do
              [ -n "$missed" ] || continue
              status=0
              pulls=$(gh api --paginate --slurp \
                "repos/$REPO/commits/$missed/pulls?per_page=100" 2> "$guard_dir/$missed.log") || status="lookup failed (exit $?)"
              if [ "$status" = 0 ]; then
                # An answer that cannot be read ends with status 4 here: an unread answer is never a skip.
                resolve_pulls "$missed" "$guard_dir/$missed.out" "$guard_dir/$missed.refusal" 4 3<<<"$pulls" \
                  > "$guard_dir/$missed.log" 2>&1 || status=$?
              fi
              echo "$status" > "$guard_dir/$missed.status"
              # What the lookup and the rules printed stays in this job's log, each line behind the commit's
              # name so that none is read as a workflow command. The row the next step writes carries a
              # fixed reason: nothing a failed read printed reaches an output, the summary or an annotation.
              sed "s/^/earlier commit $missed: /" "$guard_dir/$missed.log" >&2
            done 4< "$guard_dir/window"
            return 0
          }
          # Only an empty association result may be eventually consistent.
          for attempt in 1 2 3; do
            # Search every page: a second match must defer, never pick a PR.
            pulls=$(gh api --paginate --slurp \
              "repos/$REPO/commits/$SHA/pulls?per_page=100")
            lookup_status=0
            resolve_pulls "$SHA" "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY" 3<<<"$pulls" || lookup_status=$?
            if [ "$lookup_status" -eq 0 ]; then
              # Resolved: now the merges before it. A skip (ok=false) examines
              # nothing, as no later step runs.
              if grep -qx 'ok=true' "$GITHUB_OUTPUT"; then
                examine_window
              fi
              exit 0
            fi
            [ "$lookup_status" -eq 3 ] || exit "$lookup_status"
            if [ "$attempt" -lt 3 ]; then
              echo "::notice::No merged PR found for $SHA (attempt $attempt/3); retrying in 20 seconds"
              sleep 20
            fi
          done
          # A release commit has no pull request: release.yml pushes it with the
          # release App's token, one commit per push. Only that push actor,
          # pushing one commit whose every changed path is in
          # RELEASE_COMMIT_PATHS, skips here; anything else is refused below.
          RELEASE_PUSH_ACTOR='pineforge-app[bot]'
          release_status=1
          if [ "$PUSH_ACTOR" = "$RELEASE_PUSH_ACTOR" ]; then
            # Every page of the pushed commit's file list; a failed read refuses.
            if commit=$(gh api --paginate --slurp "repos/$REPO/commits/$SHA?per_page=100"); then
              release_status=0
              python3 - 3<<<"$commit" <<'RELEASE_PY' || release_status=$?
          import json
          import os
          import re

          # The only paths the engine's release commit changes: its release.yml
          # commits the first two, and a root-level CHANGELOG* is the third.
          ENGINE_RELEASE_PATHS = re.compile(
              r"VERSION|docker/run_failure_codes_diff\.json|CHANGELOG[^/]*")
          # The only path the code generator's release commit changes: its
          # release.yml commits VERSION alone.
          CODEGEN_RELEASE_PATHS = re.compile(r"VERSION")
          # One set per repository, never the union of the two. The axis rule is
          # the "Determine repo axis" step's: a repository name containing
          # `codegen` is the codegen axis, any other is the engine axis.
          RELEASE_COMMIT_PATHS = (
              CODEGEN_RELEASE_PATHS if "codegen" in os.environ["REPO"]
              else ENGINE_RELEASE_PATHS)
          # The commit API lists at most 3000 file records: a list that long may
          # be cut. The limit counts records, never the path names they carry.
          FILE_LIST_LIMIT = 3000

          def reject_constant(value):
              raise ValueError(f"invalid JSON constant: {value}")

          # A release is one commit, so its first parent is the commit main
          # held before the push. A push event without that commit refuses.
          before = os.environ.get("BEFORE", "")
          if not re.fullmatch(r"[0-9a-f]{40}", before):
              raise SystemExit(1)
          try:
              with open(3, encoding="utf-8") as stream:
                  pages = json.load(stream, parse_constant=reject_constant)
          except (OSError, ValueError, RecursionError):
              raise SystemExit(1)
          if not isinstance(pages, list) or not pages:
              raise SystemExit(1)
          records = 0
          paths = []
          for page in pages:
              files = page.get("files") if isinstance(page, dict) else None
              if not isinstance(files, list) or page.get("sha") != os.environ["SHA"]:
                  raise SystemExit(1)
              # An absent or unreadable first parent refuses, as does any
              # parent other than the commit before the push: more than one
              # commit was pushed, and only the last one is listed here.
              parents = page.get("parents")
              first = parents[0] if isinstance(parents, list) and parents else None
              parent = first.get("sha") if isinstance(first, dict) else None
              if not isinstance(parent, str) or parent != before:
                  raise SystemExit(1)
              records += len(files)
              for changed in files:
                  if not isinstance(changed, dict):
                      raise SystemExit(1)
                  paths.append(changed.get("filename"))
                  if changed.get("status") == "renamed" or "previous_filename" in changed:
                      # A rename also changes the path it leaves. A renamed
                      # record that does not name that path refuses the read.
                      previous = changed.get("previous_filename")
                      if not isinstance(previous, str):
                          raise SystemExit(1)
                      paths.append(previous)
          if (not paths or records >= FILE_LIST_LIMIT
                  or not all(isinstance(path, str) and RELEASE_COMMIT_PATHS.fullmatch(path)
                             for path in paths)):
              raise SystemExit(1)
          RELEASE_PY
            fi
          fi
          if [ "$release_status" -eq 0 ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "release commit: baseline is recorded by the release_tag route, not post-merge promote"
            exit 0
          fi
          echo "ok=false" >> "$GITHUB_OUTPUT"
          echo "::error title=baseline-promotion::DEFERRED_NOT_FOUND: no merged PR found for $SHA after 3 attempts; baseline unchanged"
          echo "baseline promotion: DEFERRED_NOT_FOUND: no merged PR found for $SHA after 3 attempts; baseline unchanged" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Only our own merged pull requests and dispatches promote the baseline
        id: authorize
        if: steps.pr.outputs.ok == 'true'
        env:
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ steps.pr.outputs.head_repo }}
          HEAD_IS_FORK: ${{ steps.pr.outputs.head_is_fork }}
          ASSOCIATION: ${{ steps.pr.outputs.association }}
          PR_AUTHOR: ${{ steps.pr.outputs.pr_author }}
          MERGED_BY: ${{ steps.pr.outputs.merged_by }}
          # The run's own merge as resolved above: the last row this step writes.
          MERGE_SHA: ${{ steps.pr.outputs.merge_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          MERGED_AT: ${{ steps.pr.outputs.merged_at }}
          GH_TOKEN: ${{ github.token }}   # read-only use: permission lookups for the PR author and merger
          # Bot logins whose same-repository pull requests count as ours: dependabot[bot] (CI-DEPBOT A)
          # and the org's own GitHub App bot logins by name (space-separated), nothing else.
          ALLOWED_BOTS: "dependabot[bot] pineforge-app[bot]"
        run: |
          set -euo pipefail
          fail() { echo "::error title=authz::$1"; echo "authz: REFUSED: $1" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          # One merge's authorisation, by the event and that merge's own identity values. The body is a
          # subshell: a refusal ends it with status 1, and the caller decides what that status means.
          authorize_one() (
          case "$EVENT" in
            workflow_dispatch)
              # Only someone with write access to this repository (or our App's token) can cause these
              # events; none of them runs pull-request code.
              ;;
            push)
              [ -n "$REPO" ] || fail "repository is empty"
              [ "$HEAD_REPO" = "$REPO" ] || fail "pull request from another repository (${HEAD_REPO:-unknown})"
              [ "$HEAD_IS_FORK" = "false" ] || fail "pull request from a fork"
              [ -n "$ASSOCIATION" ] || fail "pull request author association is empty"
              [ -n "$PR_AUTHOR" ] || fail "pull request author is empty"
              case "$ASSOCIATION" in
                OWNER|MEMBER|COLLABORATOR) ;;
                *)
                  case " $ALLOWED_BOTS " in
                    *" $PR_AUTHOR "*) ;;
                    *)
                      # A member whose org membership is private shows as CONTRIBUTOR: ask GitHub for the
                      # author's permission on this repository; anything but admin/maintain/write (or a
                      # failed call) refuses.
                      perm=$(gh api "repos/$REPO/collaborators/$PR_AUTHOR/permission" --jq .permission 2>/dev/null || echo none)
                      case "$perm" in admin|maintain|write) ;; *) fail "author ${PR_AUTHOR:-unknown} (${ASSOCIATION:-NONE}) has permission '$perm', not write, and is not an allowlisted bot" ;; esac ;;
                  esac ;;
              esac
              [ -n "$MERGED_BY" ] || fail "push merger is empty"
              case " $ALLOWED_BOTS " in
                *" $MERGED_BY "*) ;;
                *)
                  # No author_association exists for the merger: ask GitHub for the merger's permission on
                  # this repository; anything but admin/maintain/write (or a failed call) refuses.
                  perm=$(gh api "repos/$REPO/collaborators/$MERGED_BY/permission" --jq .permission 2>/dev/null || echo none)
                  case "$perm" in admin|maintain|write) ;; *) fail "push merger ${MERGED_BY:-unknown} has permission '$perm', not write" ;; esac ;;
              esac ;;
            *) fail "event $EVENT does not run baseline promotion (only push and workflow_dispatch are allowed)" ;;
          esac
          )
          # The run's own merge: a refusal fails the job, as it always did.
          authorize_one
          echo "authz: allowed ($EVENT${PR_AUTHOR:+ by $PR_AUTHOR})" >> "$GITHUB_STEP_SUMMARY"
          # Every commit this run examines, oldest first, one JSON row each: on a push the commits before
          # the run's own merge, then that merge. A row is a candidate (resolved and authorised), skipped
          # (no single merged pull request names the commit), refused (this authorisation) or unresolved
          # (a failed read). Only candidates go on; a refused or unresolved row fails the run at its end.
          guard_dir="$RUNNER_TEMP/promote-guard"
          mkdir -p "$guard_dir"
          rows="$guard_dir/rows"
          : > "$rows"
          value_of() { sed -n "s/^$1=//p" "$2"; }
          # A dispatch names one merge and has no window. A push whose window was never recorded examined
          # its own commit alone.
          window=null
          if [ "$EVENT" = push ]; then
            window='{"limit":1,"error":"the commits before this merge were not recorded"}'
            if [ -f "$guard_dir/window.json" ]; then window=$(cat "$guard_dir/window.json"); fi
            if [ -f "$guard_dir/window" ] && jq -e '.error == null' <<< "$window" > /dev/null; then
              while IFS= read -r missed <&4; do
                [ -n "$missed" ] || continue
                out="$guard_dir/$missed.out"
                status=unrecorded
                if [ -f "$guard_dir/$missed.status" ]; then status=$(cat "$guard_dir/$missed.status"); fi
                # A row's reason is one of the fixed texts below, or this workflow's own refusal text: never a
                # line a failed read printed. That stays in the log of the step that made the read.
                if [ "$status" = 0 ] && [ -f "$out" ] && grep -qx 'ok=true' "$out"; then
                  # The same authorisation as the run's own merge, on this merge's identity values. Its
                  # refusal is this merge's row, never this step's exit.
                  authz=0
                  (
                    HEAD_REPO=$(value_of head_repo "$out"); HEAD_IS_FORK=$(value_of head_is_fork "$out")
                    ASSOCIATION=$(value_of association "$out"); PR_AUTHOR=$(value_of pr_author "$out")
                    MERGED_BY=$(value_of merged_by "$out"); GITHUB_STEP_SUMMARY="$guard_dir/$missed.refusal"
                    authorize_one
                  ) > "$guard_dir/$missed.authz" 2>&1 || authz=$?
                  if [ "$authz" -eq 0 ]; then
                    jq -cn --arg sha "$missed" --arg head "$(value_of head_sha "$out")" \
                      --arg number "$(value_of pr_number "$out")" --arg url "$(value_of pr_url "$out")" \
                      --arg at "$(value_of merged_at "$out")" \
                      '{row: "candidate", merge_sha: $sha, head_sha: $head, pr_number: $number, pr_url: $url, merged_at: $at}' >> "$rows"
                  else
                    reason="authorisation ended with status $authz"
                    if [ -s "$guard_dir/$missed.refusal" ]; then
                      reason=$(sed -n 's/^authz: REFUSED: //p' "$guard_dir/$missed.refusal" | tail -n 1)
                    fi
                    jq -cn --arg sha "$missed" --arg number "$(value_of pr_number "$out")" --arg reason "$reason" \
                      '{row: "refused", merge_sha: $sha, pr_number: $number, reason: $reason}' >> "$rows"
                  fi
                elif [ "$status" = 0 ]; then
                  jq -cn --arg sha "$missed" \
                    '{row: "skipped", merge_sha: $sha, reason: "no single merged pull request with base main names this commit"}' >> "$rows"
                elif [ "$status" = 3 ]; then
                  jq -cn --arg sha "$missed" \
                    '{row: "skipped", merge_sha: $sha, reason: "no merged pull request lists this commit"}' >> "$rows"
                else
                  # Unread is never "no pull request": an answer that could not be read, a failed read and
                  # a refused resolution are unresolved, and fail the run at its end.
                  case "$status" in
                    4) reason="lookup answer unreadable" ;;
                    "lookup failed (exit "[0-9]")"|"lookup failed (exit "[0-9][0-9]")"|"lookup failed (exit "[0-9][0-9][0-9]")") reason="$status" ;;
                    [0-9]|[0-9][0-9]|[0-9][0-9][0-9]) reason="lookup refused (status $status)" ;;
                    *) reason="lookup not recorded" ;;
                  esac
                  jq -cn --arg sha "$missed" --arg reason "$reason" \
                    '{row: "unresolved", merge_sha: $sha, reason: $reason}' >> "$rows"
                fi
              done 4< "$guard_dir/window"
            fi
          fi
          jq -cn --arg sha "$MERGE_SHA" --arg head "$HEAD_SHA" --arg number "$PR_NUMBER" --arg url "$PR_URL" --arg at "$MERGED_AT" \
            '{row: "candidate", merge_sha: $sha, head_sha: $head, pr_number: $number, pr_url: $url, merged_at: $at, own: true}' >> "$rows"
          # One summary line for each earlier commit that does not go on.
          jq -r 'select(.row != "candidate") | "missed merge \(.merge_sha): \(.row): \(.reason)"' "$rows" >> "$GITHUB_STEP_SUMMARY"
          merges=$(jq -cs . "$rows")
          echo "window=$window" >> "$GITHUB_OUTPUT"
          echo "merges=$merges" >> "$GITHUB_OUTPUT"
          echo "ok=true" >> "$GITHUB_OUTPUT"

  promote:
    needs: [promote-guard]
    if: ${{ needs.promote-guard.result == 'success' && needs.promote-guard.outputs.ok == 'true' }}
    runs-on: ubuntu-24.04
    environment: release-bot
    # One promotion at a time, and a run in progress is never cancelled. The
    # lock is on this job, so a run queues only after promote-guard passed it.
    concurrency:
      group: promote-baseline
      cancel-in-progress: false
    steps:
      # This job holds the lock. Before any credential exists, read where main
      # stands now: a run that waited for the lock may no longer be the newest
      # merge, and the run of a newer merge may have been replaced while it
      # waited. This run still promotes the merges it examined (they are
      # ancestors of main's tip). Every first-parent commit main holds after
      # this run's own merge is recorded here, by name, as not examined; the
      # last step reports each one and ends the run red. Read-only: one commit
      # list, through the job's own token. A list that cannot be read is
      # recorded as such, never as "nothing later".
      - name: Read main's tip
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MERGE_SHA: ${{ needs.promote-guard.outputs.merge_sha }}
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/promote"
          mkdir -p "$results"
          # Main's newest commits, the tip first. What a failed read prints stays in this step's log.
          status=0
          commits=$(gh api "repos/$REPO/commits?sha=main&per_page=100") || status=$?
          if [ "$status" -eq 0 ]; then
            python3 - 3<<<"$commits" > "$results/tip.json" <<'TIP_PY' || status=$?
          import json
          import os
          import re
          import subprocess
          import sys

          def reject_constant(value):
              raise ValueError(f"invalid JSON constant: {value}")

          def commit_id(value):
              if isinstance(value, str) and re.fullmatch(r"[0-9a-f]{40}", value):
                  return value
              return None

          # One lookup for a commit main gained after this run's own merge: the
          # pull request that merged it, by the guard's own rule (exactly one
          # closed, merged pull request with that merge commit and base main).
          # The last step names the commit with it, and fills the line that
          # dispatches its promotion. A lookup that fails, cannot be read or
          # names no single merged pull request is recorded as that, never as
          # a pull request. What a failed read prints stays in this step's log.
          def merged_pull(sha):
              unread = {"sha": sha, "found": "unread", "why": "lookup answer unreadable"}
              try:
                  answer = subprocess.run(
                      ["gh", "api", "--paginate", "--slurp",
                       f"repos/{os.environ['REPO']}/commits/{sha}/pulls?per_page=100"],
                      capture_output=True, text=True)
              except OSError:
                  return {"sha": sha, "found": "unread", "why": "lookup could not be started"}
              for line in answer.stderr.splitlines():
                  sys.stderr.write(f"later commit {sha}: {line}\n")
              if answer.returncode != 0:
                  return {"sha": sha, "found": "unread", "why": f"lookup failed (exit {answer.returncode})"}
              try:
                  pages = json.loads(answer.stdout, parse_constant=reject_constant)
              except (ValueError, RecursionError):
                  return unread
              if (not isinstance(pages, list) or not pages
                      or any(not isinstance(page, list) for page in pages)
                      or any(not isinstance(pr, dict) for page in pages for pr in page)):
                  return unread
              matches = [pr for page in pages for pr in page
                         if pr.get("state") == "closed"
                         and pr.get("merged_at") is not None
                         and pr.get("merge_commit_sha") == sha
                         and isinstance(pr.get("base"), dict)
                         and pr["base"].get("ref") == "main"]
              if len(matches) != 1:
                  return {"sha": sha, "found": "none",
                          "why": f"{len(matches)} merged pull requests with base main name this commit"}
              number = matches[0].get("number")
              head = matches[0].get("head")
              head_sha = commit_id(head.get("sha")) if isinstance(head, dict) else None
              merged_at = matches[0].get("merged_at")
              if (type(number) is not int or number <= 0 or head_sha is None
                      or not isinstance(merged_at, str)
                      or not re.fullmatch(r"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z", merged_at)):
                  return unread
              # The dispatch takes exactly this repository's URL of that pull request.
              return {"sha": sha, "found": "one", "pr_number": number, "head_sha": head_sha,
                      "pr_url": f"https://github.com/{os.environ['REPO']}/pull/{number}", "merged_at": merged_at}

          own = commit_id(os.environ.get("MERGE_SHA"))
          if own is None:
              raise SystemExit(1)
          try:
              with open(3, encoding="utf-8") as stream:
                  records = json.load(stream, parse_constant=reject_constant)
          except (OSError, ValueError, RecursionError):
              raise SystemExit(1)
          if not isinstance(records, list) or not records:
              raise SystemExit(1)
          # Each listed commit with its first parent; a root commit has none.
          first_parent = {}
          for record in records:
              commit = commit_id(record.get("sha")) if isinstance(record, dict) else None
              parents = record.get("parents") if isinstance(record, dict) else None
              if commit is None or not isinstance(parents, list):
                  raise SystemExit(1)
              parent = None
              if parents:
                  parent = commit_id(parents[0].get("sha")) if isinstance(parents[0], dict) else None
                  if parent is None:
                      raise SystemExit(1)
              first_parent[commit] = parent
          tip = commit_id(records[0].get("sha"))
          # Walk first parents back from the tip to this run's own merge. A parent the list does not
          # hold, or a first commit reached before that merge, leaves the rest unread: it is said so.
          later = []
          unread = None
          current = tip
          while current != own:
              later.append(current)
              current = first_parent[current]
              if current == own:
                  break
              if current is None:
                  unread = "main's first commit was reached before this run's own merge"
                  break
              if current not in first_parent:
                  unread = "the list of main's newest commits ends before this run's own merge"
                  break
          later.reverse()
          json.dump({"tip": tip, "own": own, "later": later, "unread": unread,
                     "lookups": [merged_pull(sha) for sha in later]}, sys.stdout)
          TIP_PY
          fi
          if [ "$status" -ne 0 ]; then
            jq -cn --arg own "$MERGE_SHA" --arg unread "main's tip could not be read (status $status)" \
              '{tip: null, own: $own, later: [], unread: $unread, lookups: []}' > "$results/tip.json"
          fi
          later=$(jq -r '.later | length' "$results/tip.json")
          unread=$(jq -r '.unread // ""' "$results/tip.json")
          if [ "$later" = 0 ] && [ -z "$unread" ]; then
            echo "main's tip is this run's own merge $MERGE_SHA"
          else
            echo "::warning title=baseline-promotion::main is not at this run's own merge $MERGE_SHA: $later later first-parent commit(s) are not examined by this run${unread:+; $unread}. The run goes on and ends red at its last step."
          fi

      - name: Determine repo axis
        id: axis
        run: |
          case "${{ github.repository }}" in
            *codegen*) echo "repo=codegen" >> "$GITHUB_OUTPUT" ;;
            *)         echo "repo=engine"  >> "$GITHUB_OUTPUT" ;;
          esac

      # The pushed main commit (or the dispatch ref), never the PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The safety property is the TREE: the snapshot describes the gated
      # head's tree, so we promote only when the merge commit now on the base
      # branch carries exactly that tree. A base that moved before the merge,
      # or a rewrite, is skipped — those must be re-gated.
      - name: Verify the merged tree is the gated tree
        id: exacttree
        env:
          MERGE_SHA: ${{ needs.promote-guard.outputs.merge_sha }}
          HEAD_SHA: ${{ needs.promote-guard.outputs.head_sha }}
          PR_NUMBER: ${{ needs.promote-guard.outputs.pr_number }}
          BASE_REF: main
          # Every commit the guard examined, oldest first, this run's own merge last.
          MERGES: ${{ needs.promote-guard.outputs.merges }}
        run: |
          set -euo pipefail
          # One merge's tree check, on that merge's own MERGE_SHA, HEAD_SHA and PR_NUMBER, its result in the
          # file GITHUB_OUTPUT names. It is called in a subshell, so `exit 0` ends that merge's check alone.
          exact_tree() {
          # The PR head's objects, to read its tree: fetched, never checked out or run.
          git fetch --quiet origin "$BASE_REF" "+refs/pull/$PR_NUMBER/head:refs/remotes/origin/pr-head"
          if ! git merge-base --is-ancestor "$MERGE_SHA" "refs/remotes/origin/$BASE_REF"; then
            echo "::notice::merge commit $MERGE_SHA is not on refs/remotes/origin/$BASE_REF; skipping"
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          merge_tree=$(git rev-parse "$MERGE_SHA^{tree}")
          head_tree=$(git rev-parse "$HEAD_SHA^{tree}")
          if [ "$merge_tree" != "$head_tree" ]; then
            echo "::notice::merge commit tree $merge_tree != gated head tree $head_tree — the base moved before the merge; re-gate. skipping"
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "merge_tree=$merge_tree" >> "$GITHUB_OUTPUT"
          echo "ok=true" >> "$GITHUB_OUTPUT"
          }
          results="$RUNNER_TEMP/promote"
          mkdir -p "$results"
          # The list must end at this run's own merge, with the values the guard resolved for it.
          jq -e --arg sha "$MERGE_SHA" --arg head "$HEAD_SHA" --arg number "$PR_NUMBER" \
            'type == "array" and length > 0 and (.[-1] | .row == "candidate" and .merge_sha == $sha and .head_sha == $head and .pr_number == $number)' \
            <<< "$MERGES" > /dev/null || { echo "::error title=baseline-promotion::the examined merges do not end at this run's own merge $MERGE_SHA"; exit 1; }
          jq -r '.[] | select(.row == "candidate") | "\(.merge_sha) \(.head_sha) \(.pr_number)"' <<< "$MERGES" > "$results/candidates"
          # Each candidate in turn, the run's own merge last. A deterministic skip is that merge's result.
          # A failed fetch or read of the run's own merge fails the step, as it always did. For an earlier
          # merge it is that merge's result alone (the last step reports it unresolved and ends the run red):
          # a pull request ref that is gone never keeps the run's own merge from its turn.
          # The step is ok when any merge carries its gated tree.
          any=false
          while read -r sha head number <&4; do
            : > "$results/$sha.tree"
            set +e
            ( set -e; MERGE_SHA="$sha"; HEAD_SHA="$head"; PR_NUMBER="$number"; GITHUB_OUTPUT="$results/$sha.tree"; exact_tree )
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              [ "$sha" != "$MERGE_SHA" ] || { echo "::error title=baseline-promotion::the tree check of merge $sha failed (status $status)"; exit "$status"; }
              echo "::warning title=baseline-promotion::the tree check of earlier merge $sha failed (status $status); the run goes on and ends red at its last step"
              echo "error=tree check failed" > "$results/$sha.tree"
              continue
            fi
            if grep -qx 'ok=true' "$results/$sha.tree"; then any=true; fi
          done 4< "$results/candidates"
          echo "ok=$any" >> "$GITHUB_OUTPUT"

      - name: Confirm the gate on the PR head
        id: ci
        if: steps.exacttree.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.promote-guard.outputs.head_sha }}
          AXIS: ${{ steps.axis.outputs.repo }}
          # Every commit the guard examined, oldest first, this run's own merge last.
          MERGES: ${{ needs.promote-guard.outputs.merges }}
        run: |
          set -euo pipefail
          # One merge's gate, on that merge's own HEAD_SHA, its verdict in the file GITHUB_OUTPUT names. It
          # is called in a subshell, so `exit 0` ends that merge's gate alone and a refused answer is its status.
          gate_one() {
          if [ "$AXIS" = engine ]; then
            # The engine merge gate. GitHub lists newest statuses first; keep
            # the first occurrence of each context across pages, so an older
            # success cannot mask a newer failure or pending verdict.
            statuses=$(gh api --paginate \
              "repos/${{ github.repository }}/commits/$HEAD_SHA/statuses?per_page=100")
            if ! jq -es '
              reduce (.[][]) as $s ({};
                if has($s.context) then . else .[$s.context] = $s.state end)
              | .["pineforge/verify"] == "success"
                and .["pineforge/parity"] == "success"
            ' <<< "$statuses" >/dev/null; then
              echo "::notice::pineforge/verify and pineforge/parity must both be success on $HEAD_SHA — skipping"
              echo "green=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          else
            # What the base branch requires: the contexts of the
            # required_status_checks rules among main's active branch rules
            # (repository and organisation rulesets alike), each with the app
            # it is bound to, if any. The job's own token reads them. The
            # gate context is always required: this step's own green claim
            # rests on it. A rules page must be a list of objects, each with
            # a string type, and a required_status_checks rule must carry its
            # list of checks, each with a non-empty string context and an
            # integration id that is a number, null or absent. A read that
            # fails, an empty answer or an answer of another shape stops the
            # step with no verdict: it never reads as "nothing is required".
            rules=$(gh api --paginate \
              "repos/${{ github.repository }}/rules/branches/main?per_page=100")
            required=$(jq -cs '
              def check_ok:
                type == "object" and (.context | type) == "string" and .context != ""
                and (.integration_id == null or (.integration_id | type) == "number");
              def rule_ok:
                type == "object" and (.type | type) == "string"
                and (.type != "required_status_checks"
                     or ((.parameters | type) == "object"
                         and (.parameters.required_status_checks | type) == "array"
                         and all(.parameters.required_status_checks[]; check_ok)));
              if length == 0 or (all(.[]; type == "array" and all(.[]; rule_ok)) | not) then
                error("invalid branch rules response")
              else
                [.[][] | select(.type == "required_status_checks")
                 | .parameters.required_status_checks[] | {context, integration_id}]
                + [{context: "gate", integration_id: null}]
              end
            ' <<< "$rules")
            # A current gate status takes priority over the legacy gate
            # check-run. Evaluate only the latest check-run of each app/name
            # that was not cancelled. When GitHub cancels a run on a head (an
            # edit, a draft conversion), it completes that run's check-runs
            # as cancelled, and one of them can carry a newer id than the
            # green run of the same check. A cancelled check-run is therefore
            # dropped before the newest is taken, and never counts as
            # failing: it stands neither for nor over a completed run, for
            # the gate check-run as for every other. A newest run that
            # failed, timed out or needs action still blocks, and a newer
            # skipped or neutral run still replaces an older success.
            # Every record is checked before any is read or dropped,
            # cancelled ones included. A check-runs page
            # must be an object with a numeric total_count and a check_runs
            # list of objects, each with a numeric id, a string name, an app
            # object with a numeric id, and a conclusion that is a string or
            # null. Every page's total_count must equal the number of records
            # over all pages. Anything else stops the step with no verdict.
            # A required check is the one exception to the drop: the
            # required-check rule below. Only this axis has that rule: the
            # engine axis reads statuses only, and a status has no cancelled
            # state.
            # If the engine ever moves its required contexts to check-runs, the same required-cancelled rule must follow.
            runs=$(gh api --paginate \
              "repos/${{ github.repository }}/commits/$HEAD_SHA/check-runs?per_page=100")
            check_result=$(jq -ers '
              def run_ok:
                type == "object" and (.id | type) == "number" and (.name | type) == "string"
                and (.app | type) == "object" and (.app.id | type) == "number"
                and has("conclusion") and (.conclusion == null or (.conclusion | type) == "string");
              def page_ok:
                type == "object" and (.total_count | type) == "number"
                and (.check_runs | type) == "array" and all(.check_runs[]; run_ok);
              if length == 0 or (all(.[]; page_ok) | not)
                 or (([.[].check_runs | length] | add) as $records
                     | any(.[]; .total_count != $records)) then
                error("invalid check-runs response")
              else
                [.[].check_runs[] | select(.conclusion != "cancelled")]
                | group_by([.app.id, .name]) | map(max_by(.id))
                | [any(.name == "gate" and .conclusion == "success"),
                   (map(select(.conclusion == "failure"
                               or .conclusion == "timed_out" or .conclusion == "action_required")) | length)]
                | @tsv
              end
            ' <<< "$runs")
            read -r gate bad <<< "$check_result"
            # The required-check rule. Dropping a cancelled check-run must
            # not make a required check vanish. A check (an app and a name)
            # that the base branch requires, or the gate check, with a
            # cancelled run and no completed run that was not cancelled has
            # no verdict on this head: the head is not green, and the notice
            # names the check. A requirement bound to an app covers that
            # app's check alone; an unbound one (no app, or app id -1)
            # covers every app's check of that name. A check that is not
            # required may still vanish. The program above has already
            # checked every record read here.
            unverified=$(jq -rs --argjson required "$required" '
              [.[].check_runs[]] | group_by([.app.id, .name])
              | map(select(any(.[]; .conclusion == "cancelled")
                           and all(.[]; .conclusion == null or .conclusion == "cancelled"))
                    | .[0]
                    | select(. as $run
                             | any($required[]; .context == $run.name
                                                and (.integration_id == null or .integration_id == -1
                                                     or .integration_id == $run.app.id)))
                    | .name | tojson)
              | unique | join(", ")
            ' <<< "$runs")
            gate_statuses=$(gh api --paginate \
              "repos/${{ github.repository }}/commits/$HEAD_SHA/statuses?per_page=100")
            # A statuses page must be a list of objects, each with a string
            # context and a string state: a null record stops the step and is
            # never read as an absent gate.
            gate_status=$(jq -ers '
              def status_ok:
                type == "object" and (.context | type) == "string" and (.state | type) == "string";
              if length == 0 or (all(.[]; type == "array" and all(.[]; status_ok)) | not) then
                error("invalid statuses response")
              else
                [ .[][] | select(.context == "gate") ][0]
                | if . == null then "absent"
                  elif .state == "success" then "success"
                  else "blocked" end
              end
            ' <<< "$gate_statuses")
            if [[ "$gate_status" != success && ( "$gate_status" != absent || "$gate" != true ) ]]; then
              echo "::notice::the required gate context has not succeeded on $HEAD_SHA — not green; skipping"
              echo "green=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            if [ -n "$unverified" ]; then
              echo "::notice::required check(s) whose only completed run(s) on $HEAD_SHA were cancelled: $unverified — not green; skipping"
              echo "green=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            if [ "$bad" != "0" ]; then
              echo "::notice::$bad failing check-run(s) on $HEAD_SHA — not green; skipping"
              echo "green=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          echo "green=true" >> "$GITHUB_OUTPUT"
          }
          results="$RUNNER_TEMP/promote"
          # The list must end at this run's own merge, on the head the guard resolved for it.
          jq -e --arg head "$HEAD_SHA" \
            'type == "array" and length > 0 and (.[-1] | .row == "candidate" and .head_sha == $head)' \
            <<< "$MERGES" > /dev/null || { echo "::error title=baseline-promotion::the examined merges do not end at this run's own gated head $HEAD_SHA"; exit 1; }
          jq -r '.[] | select(.row == "candidate") | "\(.merge_sha) \(.head_sha)"' <<< "$MERGES" > "$results/gated"
          # Each merge that carries its gated tree, the run's own last. A gate that is not green is that
          # merge's result. A refused or failed answer for the run's own merge stops the step, as it always
          # did. For an earlier merge it is that merge's result alone (the last step reports it unresolved
          # and ends the run red). The step is green when any merge is.
          own=$(jq -r '.[-1].merge_sha' <<< "$MERGES")
          any=false
          while read -r sha head <&4; do
            grep -qx 'ok=true' "$results/$sha.tree" || continue
            : > "$results/$sha.gate"
            set +e
            ( set -e; HEAD_SHA="$head"; GITHUB_OUTPUT="$results/$sha.gate"; gate_one )
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              [ "$sha" != "$own" ] || exit "$status"
              echo "::warning title=baseline-promotion::the gate of earlier merge $sha could not be read (status $status); the run goes on and ends red at its last step"
              echo "error=gate read failed" > "$results/$sha.gate"
              continue
            fi
            if grep -qx 'green=true' "$results/$sha.gate"; then any=true; fi
          done 4< "$results/gated"
          echo "green=$any" >> "$GITHUB_OUTPUT"

      # The campaign tooling lives in the private pineforge-workflow repo. Rather
      # than a long-lived PAT, mint a short-lived, read-only token from the org
      # App already installed here (the same app-id/private-key release.yml
      # uses), scoped to just that one repo and to reading its contents: without
      # a permission-* input the token would carry every permission the App's
      # installation has, and only the checkout below uses it.
      - name: Mint an org App token to read the campaign tooling
        id: app
        if: steps.ci.outputs.green == 'true'
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.PINEFORGE_APP_ID }}
          private-key: ${{ secrets.PINEFORGE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: pineforge-workflow
          permission-contents: read

      - name: Checkout campaign tooling (pineforge-workflow)
        if: steps.ci.outputs.green == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.WORKFLOW_REPO || 'pineforge-4pass/pineforge-workflow' }}
          ref: ${{ vars.WORKFLOW_REF || 'main' }}
          token: ${{ steps.app.outputs.token }}
          path: .workflow
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.ci.outputs.green == 'true'
        with:
          node-version: '22'

      - name: Install campaign dependencies
        if: steps.ci.outputs.green == 'true'
        # Install before the auth action creates its GCP credentials.
        run: npm ci --prefix .workflow/campaign

      - name: Confirm the campaign tooling takes --catch-up
        if: steps.ci.outputs.green == 'true'
        # The promotion below is one `lab promote --catch-up` call. Tooling pinned
        # to a ref from before that mode (WORKFLOW_REF) answers it with a usage
        # error, and no merge would ever promote again. Ask the tooling itself,
        # and fail here, loudly, before any cloud credential is minted.
        run: |
          set -euo pipefail
          if ! help=$(node .workflow/campaign/src/baseline-promote.mjs --help); then
            echo "::error title=baseline-promotion::the campaign tooling did not answer promote --help; nothing was promoted"
            exit 1
          fi
          if ! grep -q -e '--catch-up <plan.json>' <<< "$help"; then
            echo "::error title=baseline-promotion::the campaign tooling at this ref has no promote --catch-up; nothing was promoted. Leave WORKFLOW_REF at main, or pin it to a ref that names --catch-up in promote --help."
            exit 1
          fi

      - name: Authenticate to GCP
        if: steps.ci.outputs.green == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        if: steps.ci.outputs.green == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # The plane is Postgres on Cloud SQL; the promotion reads the active
      # baseline and the gate ledger there, so this runner needs the same
      # connector-path proxy operators use.
      - name: Start cloud-sql-proxy
        if: steps.ci.outputs.green == 'true'
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
          chmod +x /tmp/cloud-sql-proxy
          if ( : </dev/tcp/127.0.0.1/5433 ) 2>/dev/null; then
            echo "cloud-sql-proxy port 5433 is already in use" >&2
            exit 1
          fi
          /tmp/cloud-sql-proxy --port 5433 \
            gen-lang-client-0864094636:asia-east1:pineforge-workflow-pg &
          proxy_pid=$!
          for _ in {1..30}; do
            if ! kill -0 "$proxy_pid" 2>/dev/null; then
              echo "cloud-sql-proxy exited before becoming ready" >&2
              exit 1
            fi
            if ( : </dev/tcp/127.0.0.1/5433 ) 2>/dev/null; then exit 0; fi
            sleep 1
          done
          echo "cloud-sql-proxy did not become ready" >&2
          exit 1

      - name: Promote baseline
        if: steps.ci.outputs.green == 'true'
        env:
          PINEFORGE_PLANE: gcp
          PINEFORGE_REGISTRY_HOST: 127.0.0.1:5433
          PINEFORGE_EVIDENCE_BUCKET: ${{ vars.PINEFORGE_EVIDENCE_BUCKET || 'pineforge-workflow-evidence' }}
          # No metadata server on a GitHub runner; mint GCS tokens from the
          # federated gcloud credential explicitly.
          PINEFORGE_GCP_TOKEN_CMD: gcloud auth print-access-token
          # A codegen squash merge: lab promote reads the gated head's and the
          # merge commit's trees from GitHub itself (gh api …/git/commits/<sha>)
          # with the job's own read-only token.
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ needs.promote-guard.outputs.merge_sha }}
          HEAD_SHA: ${{ needs.promote-guard.outputs.head_sha }}
          PR_NUMBER: ${{ needs.promote-guard.outputs.pr_number }}
          PR_URL: ${{ needs.promote-guard.outputs.pr_url }}
          MERGED_AT: ${{ needs.promote-guard.outputs.merged_at }}
          # Every commit the guard examined, oldest first, this run's own merge
          # last; and what it read of the commits before that merge.
          MERGES: ${{ needs.promote-guard.outputs.merges }}
          WINDOW: ${{ needs.promote-guard.outputs.window }}
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/promote"
          # The list must end at this run's own merge, with every value the guard resolved for it.
          jq -e --arg sha "$MERGE_SHA" --arg head "$HEAD_SHA" --arg number "$PR_NUMBER" --arg url "$PR_URL" --arg at "$MERGED_AT" \
            'type == "array" and length > 0 and (.[-1] | .row == "candidate" and .merge_sha == $sha and .head_sha == $head and .pr_number == $number and .pr_url == $url and .merged_at == $at)' \
            <<< "$MERGES" > /dev/null || { echo "::error title=baseline-promotion::the examined merges do not end at this run's own merge $MERGE_SHA"; exit 1; }
          # The plan: every candidate that carries its gated tree and is green, oldest first, with the same
          # values the single-axis call takes. A candidate that stopped at the tree check or the gate gets
          # its row from the last step, which reports every examined merge.
          : > "$results/plan.rows"
          count=$(jq 'length' <<< "$MERGES")
          for ((index = 0; index < count; index++)); do
            entry=$(jq -c ".[$index]" <<< "$MERGES")
            [ "$(jq -r '.row' <<< "$entry")" = candidate ] || continue
            sha=$(jq -r '.merge_sha' <<< "$entry")
            grep -qx 'ok=true' "$results/$sha.tree" || continue
            [ -f "$results/$sha.gate" ] && grep -qx 'green=true' "$results/$sha.gate" || continue
            tree=$(sed -n 's/^merge_tree=//p' "$results/$sha.tree")
            ms=$(MERGED_AT="$(jq -r '.merged_at' <<< "$entry")" node -e "process.stdout.write(String(Date.parse(process.env.MERGED_AT)))")
            jq -c --arg tree "$tree" --arg ms "$ms" --arg own "$MERGE_SHA" \
              '{mergeCommit: .merge_sha, headSha: .head_sha, mergeTree: $tree, prNumber: (.pr_number | tonumber), prUrl: .pr_url, mergedAtMs: ($ms | tonumber), own: (.merge_sha == $own)}' \
              <<< "$entry" >> "$results/plan.rows"
          done
          jq -cs --argjson window "$WINDOW" '{window: $window, merges: .}' "$results/plan.rows" > "$results/plan.json"
          set +e
          node .workflow/campaign/src/baseline-promote.mjs \
            --repo "${{ steps.axis.outputs.repo }}" \
            --catch-up "$RUNNER_TEMP/promote/plan.json" > "$RUNNER_TEMP/promote/report.txt"
          code=$?
          set -e
          # One line per merge of the plan, here in the log: promoted, superseded, deferred and every other
          # row. The last step copies them into the step summary, with the rows of every other examined
          # commit. What a promotion printed on its error stream is in this log only, never in a row.
          cat "$results/report.txt"
          # Exit 2 only: a usage or plan error of the call is 64 and fails the run, never a deferral.
          # Exit 2: nothing promoted and every attempt was a `refuse` -- no verdict binds the merge as a
          # single-axis advance: a cross-cutting engine+codegen change (gated as a composite
          # the single axis cannot complete), an ungated merge, a codegen merge
          # gated only neutral (lab promote takes a pr-gate PASS), a merge tree
          # GitHub does not show as the gated head's, or an engine merge the
          # diff rule cleared (nothing measured). Defer green, do not fail CI; a cross-cutting pair is promoted by
          # hand with `lab promote --composite` once both repos merge (see the
          # baseline-promote skill). Any other non-zero is a real error.
          if [ "$code" = "2" ]; then
            echo "::notice::baseline not promoted (deferred): every candidate deferred -- no verdict binds any examined merge as a single-axis advance (see the deferred rows above). If this was a cross-cutting engine+codegen change, run the composite promote by hand once both repos are merged. Nothing was changed."
            exit 0
          fi
          exit "$code"

      # Every commit this run examined ends with one row, in this step's log and
      # in the step summary, whether or not the promotion ran: the rows of the
      # promotion's own report; a row for each commit that stopped before it
      # (skipped, refused, unresolved, another tree, a gate that is not green);
      # the window, when it was not read; and each first-parent commit main
      # holds after this run's own merge, which nobody examined here. Then the
      # run ends red for an earlier merge that was refused or could not be read,
      # and for a commit after its own merge: as loudly as that merge's own run
      # would have been, and after every other merge had its turn. A row's
      # reason is a fixed text; what a failed read printed is in the log of the
      # step that made the read.
      - name: Report every examined merge
        if: ${{ always() }}
        env:
          MERGES: ${{ needs.promote-guard.outputs.merges }}
          WINDOW: ${{ needs.promote-guard.outputs.window }}
          # For the by-hand route a row names when a later commit's pull request is not known.
          AXIS: ${{ steps.axis.outputs.repo }}
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/promote"
          mkdir -p "$results"
          rows="$results/rows.txt"
          red="$results/red.txt"
          : > "$rows"
          : > "$red"
          # A list that cannot be read is an error, never "nothing refused".
          jq -e 'type == "array" and length > 0' <<< "$MERGES" > /dev/null || { echo "::error title=baseline-promotion::the examined merges could not be read"; exit 1; }
          # The promotion's report, when the call was made and answered.
          reported=false
          if [ -s "$results/report.txt" ]; then reported=true; fi
          # The window: the report says it when there is one. Without a report, a commit list that was not
          # read is said here, in the report's own words.
          if [ "$reported" = false ] && [ -n "$WINDOW" ]; then
            jq -r --arg lead "NOT COMPARED: the merges before this run's own were not read" \
              'select(type == "object" and .error != null) | "\($lead): \(.error); no missed merge was attempted"' <<< "$WINDOW" >> "$rows"
          fi
          # One row for each examined commit that is not in the promotion's report, oldest first.
          count=$(jq 'length' <<< "$MERGES")
          for ((index = 0; index < count; index++)); do
            entry=$(jq -c ".[$index]" <<< "$MERGES")
            kind=$(jq -r '.row' <<< "$entry")
            sha=$(jq -r '.merge_sha' <<< "$entry")
            if [ "$kind" != candidate ]; then
              line="$kind: merge $sha: $(jq -r '.reason' <<< "$entry")"
              echo "$line" >> "$rows"
              case "$kind" in refused|unresolved) echo "earlier merge $line" >> "$red" ;; esac
              continue
            fi
            tree="$results/$sha.tree"
            gate="$results/$sha.gate"
            if [ ! -f "$tree" ]; then
              echo "NOT ATTEMPTED: merge $sha: its tree was not checked" >> "$rows"
            elif grep -q '^error=' "$tree"; then
              line="unresolved: merge $sha: tree check failed"
              echo "$line" >> "$rows"
              echo "earlier merge $line" >> "$red"
            elif ! grep -qx 'ok=true' "$tree"; then
              echo "not attempted: merge $sha: its tree is not its gated head's tree" >> "$rows"
            elif [ ! -f "$gate" ]; then
              echo "NOT ATTEMPTED: merge $sha: its gate was not read" >> "$rows"
            elif grep -q '^error=' "$gate"; then
              line="unresolved: merge $sha: gate read failed"
              echo "$line" >> "$rows"
              echo "earlier merge $line" >> "$red"
            elif ! grep -qx 'green=true' "$gate"; then
              echo "not attempted: merge $sha: the gate is not green on its head" >> "$rows"
            elif [ "$reported" = false ]; then
              echo "NOT ATTEMPTED: merge $sha: the promotion gave no report" >> "$rows"
            fi
          done
          if [ "$reported" = true ]; then cat "$results/report.txt" >> "$rows"; fi
          # Main's tip, as the first step recorded it while this job held the lock. Each commit main gained
          # after this run's own merge is named by its first 12 characters and its pull request, with the
          # line that dispatches its own promotion: this workflow has a workflow_dispatch trigger, and the
          # row says so. The fields come from the one lookup the first step made for that commit. When that
          # lookup failed, could not be read, or named no single merged pull request, the row says which,
          # gives the line with the one field it has, names the fields still needed, and gives the route by
          # hand: a dry run of the promotion first, then the same call without --dry-run.
          axis="${AXIS:-<engine or codegen>}"
          if [ -s "$results/tip.json" ]; then
            jq -r --arg axis "$axis" '
              def dispatch(head; number; url; at):
                "gh workflow run promote-baseline.yml --ref main -f merge_commit=\(.sha) -f head_sha=\(head) -f pr_number=\(number) -f pr_url=\(url) -f merged_at=\(at)";
              def lead(who):
                "NOT COMPARED: commit \(.sha[0:12]) (\(who)): not examined by this run: its own run may still follow; else dispatch it (this workflow has a workflow_dispatch trigger): ";
              (.lookups // [.later[] | {sha: ., found: "unread", why: "lookup not recorded"}])[]
              | if .found == "one" then
                  lead("PR #\(.pr_number)") + dispatch(.head_sha; .pr_number; .pr_url; .merged_at)
                else
                  lead("PR not known: \(.why)") + dispatch("<head_sha>"; "<pr_number>"; "<pr_url>"; "<merged_at>")
                  + "; still needed: head_sha, pr_number, pr_url, merged_at; or by hand: lab promote --repo \($axis) --merge-commit \(.sha) --head-sha <head_sha> --merge-tree <tree of the merge commit> --pr-number <pr_number> --pr-url <pr_url> --merged-at-ms <merge time in ms> --ci-head <head_sha> --ci-green --dry-run first, then the same without --dry-run"
                end' "$results/tip.json" >> "$rows"
            jq -r --arg lead "the commits after this run's own merge" \
              'select(.unread != null) | "NOT COMPARED: \($lead) \(.own) were not all read: \(.unread)"' "$results/tip.json" >> "$rows"
            jq -r --arg lead "main moved past this run's own merge" \
              'select((.later | length) > 0) | "\($lead) \(.own): \(.later | length) later first-parent commit(s) not examined by this run (the NOT COMPARED rows name each)"' "$results/tip.json" >> "$red"
            jq -r --arg lead "the commits after this run's own merge" \
              'select(.unread != null) | "\($lead) \(.own) were not all read: \(.unread)"' "$results/tip.json" >> "$red"
          else
            echo "NOT COMPARED: main's tip was not recorded by this run: the commits after its own merge were not examined" >> "$rows"
            echo "main's tip was not recorded by this run: the commits after its own merge were not examined" >> "$red"
          fi
          cat "$rows"
          { echo '```'; cat "$rows"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ ! -s "$red" ]; then exit 0; fi
          while IFS= read -r line; do
            echo "::error title=baseline-promotion::$line"
          done < "$red"
          exit 1
