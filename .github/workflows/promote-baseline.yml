# PineForge parity campaign — post-merge baseline promotion.
#
# Install into BOTH product repos, unchanged (the repo axis is auto-detected):
#   pineforge-engine/.github/workflows/promote-baseline.yml
#   pineforge-codegen-oss/.github/workflows/promote-baseline.yml
#
# On a merged PR it advances the campaign baseline one axis, reusing the
# snapshot the gate already measured. It promotes ONLY when the merge commit
# now on the base branch carries the gated PR head's TREE (a squash merge mints
# a new commit; the strict up-to-date rule keeps its tree the head's), the gate
# is green on that head, and `lab promote` finds the verdict that binds it:
#   engine   pineforge/verify and pineforge/parity success on the PR head (verify required in this product; the template's advisory rule (#375) is not applied here);
#            lab promote adopts the pair the merge gate's parity verdict
#            measured — the merged engine with the codegen the sweep measured
#            (ruling R2, 2026-09-26), PASS or neutral alike
#   codegen  the required `gate` context green (the trusted reporter's commit
#            status, else the check-run) and no check-run on the PR head
#            whose newest run (per app and name) failed; lab promote needs a pr-gate PASS binding (baseline
#            engine, the PR head) and re-reads both trees from GitHub (the
#            verdict records commits, not trees; GH_TOKEN below)
# Otherwise the baseline stands. Exhausted empty PR lookups fail loudly.
# A docs-only codegen receipt names no measured snapshot. lab promote refuses
# it explicitly: the baseline stands, even when the required gate is green.
#
# It runs on a push to main, using MAIN's own copy at refs/heads/main. The
# promotion identity's workload-identity condition pins job_workflow_ref to
# `<repo>/.github/workflows/promote-baseline.yml@refs/heads/main` and the run
# ref to refs/heads/main (terraform/gcp/github-wif.tf). The pushed SHA must
# resolve to exactly one merged PR with that merge commit and base main.
# A nonempty nonmatching result or ambiguity skips promotion. Empty results allow
# three lookup attempts, 20 seconds apart, before failing; an answer with no page
# at all fails at once. It checks out and runs no PR code:
# it fetches the PR head's objects only to compare trees.
#
# A release commit has no pull request: each product's release.yml pushes it
# with the org App's token. When all three lookups are empty and the push actor
# is that App's bot, the run reads the pushed commit's parent and changed
# files. It skips, green and without promoting, only when the push is that one
# commit (its first parent is the commit main held before the push) and every
# changed path belongs to this repository's release file set; the release_tag
# route records that baseline.
# The set is picked by the repo axis and is never the union of the two:
#   engine   VERSION, docker/run_failure_codes_diff.json and a root-level
#            CHANGELOG* file
#   codegen  VERSION
# Any other push actor, a push of more than one commit, any other changed
# path, or a file list that cannot be read, fails as every other exhausted
# lookup does.
#
# A manual dispatch is checked before it can promote. Its inputs must be well
# formed: merge_commit and head_sha are 40 lowercase hex characters, pr_number
# is a positive number, pr_url is exactly this repository's URL of that PR, and
# merged_at is a UTC time in YYYY-MM-DDTHH:MM:SSZ form. The pull request API
# must then show the same PR number, merged, with that merge commit, that head,
# base main and that merge time, and the merge commit must list exactly that
# one PR. Any mismatch refuses the run.
#
# The promote job holds one concurrency group, and a run in progress is never
# cancelled: one promotion finishes before the next one starts. The lock is on
# that job, not on the workflow, so a run queues only after its guard has
# validated it: an invalid dispatch never queues.
#
# The plane is GCP: the
# promotion reads the active baseline and the gate ledger from the Postgres
# registry through a cloud-sql-proxy, streams the pinned documents from the
# GCS evidence bucket, and appends the new baseline row — authenticated by
# workload identity federation, so no long-lived GCP key lives in the repo.
#
# Required in each product repo:
#   secrets PINEFORGE_APP_ID + PINEFORGE_APP_PRIVATE_KEY  the org App (already
#          present for release.yml) — the job mints a short-lived, read-only
#          token from it to check out the private pineforge-workflow repo, so
#          NO personal access token is needed
#   var    WORKFLOW_REPO         optional override, defaults to pineforge-4pass/pineforge-workflow
#   var    GCP_WORKLOAD_IDENTITY_PROVIDER
#          the full provider resource name — terraform/gcp output
#          `github_workload_identity_provider`
#   var    GCP_SERVICE_ACCOUNT
#          the dedicated promotion service account this workflow impersonates
#          through that provider — terraform/gcp output
#          `github_promotion_service_account`. Terraform binds the repo-pinned
#          federated identity to it (roles/iam.workloadIdentityUser) and
#          grants it exactly what the steps below use, and nothing else:
#          Cloud SQL Client on the registry instance (the proxy this job
#          starts), accessor on secret pineforge-registry-db (the DSN
#          password baseline-promote resolves), and objectViewer on the
#          evidence bucket (the three pinned documents it streams). No
#          Cloud Run role: this workflow executes no job. Nothing is left for
#          an operator to grant by hand.
#
# This file's PATH and REF are part of the identity: the WIF provider admits
# only `<owner>/<repo>/.github/workflows/promote-baseline.yml@refs/heads/main`,
# so installing it under another name, or running another branch's copy,
# mints no token — and no other workflow in the repo can mint one either.
#
# (Optionally pin WORKFLOW_REF, defaults to main; and PINEFORGE_EVIDENCE_BUCKET,
#  defaults to pineforge-workflow-evidence.)

name: promote-baseline

on:
  push:
    branches: [main]
  # Manual re-fire, from main, for a merge whose event already passed (e.g. a
  # PR merged before this workflow was installed): the commit now on the base
  # branch, the PR head the gate cleared, and the PR.
  workflow_dispatch:
    inputs:
      merge_commit:
        description: "40-hex commit now on the base branch to promote"
        required: true
      head_sha:
        description: "40-hex PR head the gate cleared (the merge commit must carry its tree)"
        required: true
      pr_number:
        description: "the PR number"
        required: true
      pr_url:
        description: "the PR URL in this repository (recorded in the merge receipt)"
        required: true
      merged_at:
        description: "UTC merge time in YYYY-MM-DDTHH:MM:SSZ form"
        required: true

permissions:
  contents: read
  # commits/{sha}/pulls needs pull-request read access for the repo-scoped
  # token, including when this unchanged workflow is installed in a private repo.
  pull-requests: read
  # The engine axis admits on pineforge/verify and pineforge/parity: verify required in this product; the template's advisory rule (#375) is not applied here.
  # Read `statuses`; the codegen axis reads check-runs: `checks`.
  statuses: read
  checks: read
  # Workload identity federation mints the GCP credential from the job's own
  # OIDC token; nothing here can promote without this repo's identity.
  id-token: write

jobs:
  promote-guard:
    name: promote-guard
    runs-on: ubuntu-24.04
    # Resolution reads pull request records and the pushed commit's file list:
    # a private repo needs both grants for them. No secrets or OIDC here.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ok: ${{ steps.authorize.outputs.ok }}
      merge_sha: ${{ steps.pr.outputs.merge_sha }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
      pr_url: ${{ steps.pr.outputs.pr_url }}
      merged_at: ${{ steps.pr.outputs.merged_at }}
    steps:
      - name: Resolve the merged PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          INPUT_MERGE_SHA: ${{ github.event.inputs.merge_commit }}
          INPUT_HEAD_SHA: ${{ github.event.inputs.head_sha }}
          INPUT_PR_NUMBER: ${{ github.event.inputs.pr_number }}
          INPUT_PR_URL: ${{ github.event.inputs.pr_url }}
          INPUT_MERGED_AT: ${{ github.event.inputs.merged_at }}
          # The push event's actor, never the commit's author or committer.
          PUSH_ACTOR: ${{ github.actor }}
          # The commit main pointed at before this push.
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          fail() { echo "::error title=authz::$1"; echo "authz: REFUSED: $1" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          [ "$REF" = refs/heads/main ] || fail "baseline promotion requires refs/heads/main"
          case "$EVENT_NAME" in
            workflow_dispatch)
              [[ "$INPUT_MERGE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
                fail "merge_commit must be exactly 40 lowercase hexadecimal characters"
              [[ "$INPUT_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] ||
                fail "head_sha must be exactly 40 lowercase hexadecimal characters"
              [[ "$INPUT_PR_NUMBER" =~ ^[1-9][0-9]*$ ]] ||
                fail "pr_number must be a positive decimal integer"
              expected_pr_url="https://github.com/$REPO/pull/$INPUT_PR_NUMBER"
              [ "$INPUT_PR_URL" = "$expected_pr_url" ] ||
                fail "pr_url must equal $expected_pr_url"
              [[ "$INPUT_MERGED_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] ||
                fail "merged_at must be an ISO-8601 UTC timestamp in YYYY-MM-DDTHH:MM:SSZ form"
              if ! dispatch_pr=$(gh api "repos/$REPO/pulls/$INPUT_PR_NUMBER"); then
                fail "pr_number API lookup failed"
              fi
              [[ -n "${dispatch_pr//[[:space:]]/}" ]] ||
                fail "pr_number API lookup returned an empty response"
              if ! python3 - "$INPUT_PR_NUMBER" 3<<<"$dispatch_pr" <<'PY'
          import json
          import sys

          def reject_constant(value):
              raise ValueError(f"invalid JSON constant: {value}")

          try:
              with open(3, encoding="utf-8") as stream:
                  pr = json.load(stream, parse_constant=reject_constant)
          except (OSError, RecursionError, ValueError):
              raise SystemExit(1)
          number = pr.get("number") if isinstance(pr, dict) else None
          if not (type(number) is int and number == int(sys.argv[1])):
              raise SystemExit(1)
          PY
              then
                fail "pr_number does not match the PR API response"
              fi
              if ! python3 - 3<<<"$dispatch_pr" <<'PY'
          import json

          def reject_constant(value):
              raise ValueError(f"invalid JSON constant: {value}")

          try:
              with open(3, encoding="utf-8") as stream:
                  pr = json.load(stream, parse_constant=reject_constant)
          except (OSError, RecursionError, ValueError):
              raise SystemExit(1)
          if not (isinstance(pr, dict) and pr.get("merged") is True):
              raise SystemExit(1)
          PY
              then
                fail "pr_number API record is not merged"
              fi
              if ! python3 - "$INPUT_MERGE_SHA" 3<<<"$dispatch_pr" <<'PY'
          import json
          import sys

          def reject_constant(value):
              raise ValueError(f"invalid JSON constant: {value}")

          try:
              with open(3, encoding="utf-8") as stream:
                  pr = json.load(stream, parse_constant=reject_constant)
          except (OSError, RecursionError, ValueError):
              raise SystemExit(1)
          if not (isinstance(pr, dict) and pr.get("merge_commit_sha") == sys.argv[1]):
              raise SystemExit(1)
          PY
              then
                fail "merge_commit does not match the PR merge_commit_sha"
              fi
              if ! python3 - "$INPUT_HEAD_SHA" 3<<<"$dispatch_pr" <<'PY'
          import json
          import sys

          def reject_constant(value):
              raise ValueError(f"invalid JSON constant: {value}")

          try:
              with open(3, encoding="utf-8") as stream:
                  pr = json.load(stream, parse_constant=reject_constant)
          except (OSError, RecursionError, ValueError):
              raise SystemExit(1)
          if not (
              isinstance(pr, dict)
              and isinstance(pr.get("head"), dict)
              and pr["head"].get("sha") == sys.argv[1]
          ):
              raise SystemExit(1)
          PY
              then
                fail "head_sha does not match the PR head.sha"
              fi
              if ! python3 - 3<<<"$dispatch_pr" <<'PY'
          import json

          def reject_constant(value):
              raise ValueError(f"invalid JSON constant: {value}")

          try:
              with open(3, encoding="utf-8") as stream:
                  pr = json.load(stream, parse_constant=reject_constant)
          except (OSError, RecursionError, ValueError):
              raise SystemExit(1)
          if not (
              isinstance(pr, dict)
              and isinstance(pr.get("base"), dict)
              and pr["base"].get("ref") == "main"
          ):
              raise SystemExit(1)
          PY
              then
                fail "pr_number API record does not use base main"
              fi
              if ! python3 - "$INPUT_MERGED_AT" 3<<<"$dispatch_pr" <<'PY'
          import json
          import sys

          def reject_constant(value):
              raise ValueError(f"invalid JSON constant: {value}")

          try:
              with open(3, encoding="utf-8") as stream:
                  pr = json.load(stream, parse_constant=reject_constant)
          except (OSError, RecursionError, ValueError):
              raise SystemExit(1)
          if not (isinstance(pr, dict) and pr.get("merged_at") == sys.argv[1]):
              raise SystemExit(1)
          PY
              then
                fail "merged_at does not match the PR merged_at"
              fi
              if ! dispatch_pulls=$(gh api --paginate --slurp \
                "repos/$REPO/commits/$INPUT_MERGE_SHA/pulls?per_page=100"); then
                fail "merge_commit API lookup failed"
              fi
              [[ -n "${dispatch_pulls//[[:space:]]/}" ]] ||
                fail "merge_commit API lookup returned an empty response"
              if ! python3 - "$INPUT_PR_NUMBER" 3<<<"$dispatch_pulls" <<'PY'
          import json
          import sys

          def reject_constant(value):
              raise ValueError(f"invalid JSON constant: {value}")

          try:
              with open(3, encoding="utf-8") as stream:
                  pages = json.load(stream, parse_constant=reject_constant)
          except (OSError, RecursionError, ValueError):
              raise SystemExit(1)
          pulls = (
              [pr for page in pages for pr in page]
              if isinstance(pages, list) and all(isinstance(page, list) for page in pages)
              else []
          )
          if not (
              isinstance(pages, list)
              and all(isinstance(page, list) for page in pages)
              and len(pulls) == 1
              and isinstance(pulls[0], dict)
              and type(pulls[0].get("number")) is int
              and pulls[0].get("number") == int(sys.argv[1])
          ):
              raise SystemExit(1)
          PY
              then
                fail "merge_commit must list exactly pull request $INPUT_PR_NUMBER"
              fi
              printf '%s\n' "merge_sha=$INPUT_MERGE_SHA" "head_sha=$INPUT_HEAD_SHA" \
                "pr_number=$INPUT_PR_NUMBER" "pr_url=$INPUT_PR_URL" \
                "merged_at=$INPUT_MERGED_AT" "ok=true" >> "$GITHUB_OUTPUT"
              exit 0 ;;
            push) ;;
            *) fail "event $EVENT_NAME does not run baseline promotion (only push and workflow_dispatch are allowed)" ;;
          esac
          # Only an empty association result may be eventually consistent.
          for attempt in 1 2 3; do
            # Search every page: a second match must defer, never pick a PR.
            pulls=$(gh api --paginate --slurp \
              "repos/$REPO/commits/$SHA/pulls?per_page=100")
            lookup_status=0
            python3 - 3<<<"$pulls" <<'PY' || lookup_status=$?
          import json
          import os
          import re
          import subprocess

          def skip(reason):
              print(f"::notice::{reason}; skipping")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("ok=false\n")

          def fail(reason):
              print(f"::error title=authz::{reason}")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write(f"authz: REFUSED: {reason}\n")
              raise SystemExit(1)

          def reject_constant(value):
              raise ValueError(f"invalid JSON constant: {value}")

          def field(obj, *keys):
              for key in keys:
                  obj = obj.get(key) if isinstance(obj, dict) else None
              if (not isinstance(obj, str) or not obj.strip()
                      or any(ord(char) < 32 for char in obj)):
                  fail("empty or unreadable PR field: " + ".".join(keys))
              return obj

          sha = os.environ["SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              fail("empty or unreadable pushed SHA")
          try:
              pages = json.loads(open(3, encoding="utf-8").read(), parse_constant=reject_constant)
          except (ValueError, RecursionError):
              skip("invalid merged PR response JSON")
              raise SystemExit(0)
          if (not isinstance(pages, list)
                  or any(not isinstance(page, list) for page in pages)
                  or any(not isinstance(pr, dict) for page in pages for pr in page)):
              skip("invalid merged PR response page array")
              raise SystemExit(0)
          # An answer with no page at all is an anomaly, never an empty result:
          # it fails the run at once, with no retry and no release exemption.
          if not pages:
              fail("merged PR response has no page")
          matches = [pr for page in pages for pr in page
                     if pr.get("state") == "closed"
                     and pr.get("merged_at") is not None
                     and pr.get("merge_commit_sha") == sha
                     and isinstance(pr.get("base"), dict)
                     and pr["base"].get("ref") == "main"]
          if not matches and not any(pages):
              # A valid empty result alone permits another lookup: one or
              # more pages, every one of them an empty list.
              raise SystemExit(3)
          if len(matches) != 1:
              skip(f"found {len(matches)} merged PRs with merge commit {sha} and base main")
              raise SystemExit(0)
          selected = matches[0]
          number = selected.get("number")
          if type(number) is not int or number <= 0:
              fail("empty or unreadable PR number")
          # The association endpoint returns a summary PR without merged_by.
          # Read that selected PR's full API response, binding it to the same
          # merge, base and head before using any identity or merge metadata.
          try:
              response = subprocess.run(
                  ["gh", "api", f"repos/{os.environ['REPO']}/pulls/{number}"],
                  check=True, capture_output=True, text=True)
              pr = json.loads(response.stdout, parse_constant=reject_constant)
          except (subprocess.CalledProcessError, OSError, ValueError, RecursionError):
              fail("unreadable resolved PR response")
          if (not isinstance(pr, dict) or type(pr.get("number")) is not int
                  or pr.get("number") != number
                  or pr.get("state") != "closed" or pr.get("merged") is not True
                  or pr.get("merge_commit_sha") != sha
                  or field(pr, "base", "ref") != "main"
                  or field(pr, "head", "sha") != field(selected, "head", "sha")
                  or field(pr, "merged_at") != field(selected, "merged_at")):
              fail("resolved PR no longer matches the pushed merge")
          head_sha = field(pr, "head", "sha")
          if not re.fullmatch(r"[0-9a-f]{40}", head_sha):
              fail("empty or unreadable PR head SHA")
          head = pr.get("head")
          repo = head.get("repo") if isinstance(head, dict) else None
          fork = repo.get("fork") if isinstance(repo, dict) else None
          if type(fork) is not bool:
              fail("empty or unreadable PR field: head.repo.fork")
          values = {
              "merge_sha": sha,
              "head_sha": head_sha,
              "pr_number": number,
              "pr_url": field(pr, "html_url"),
              "merged_at": field(pr, "merged_at"),
              "head_repo": field(pr, "head", "repo", "full_name"),
              "head_is_fork": str(fork).lower(),
              "association": field(pr, "author_association"),
              "pr_author": field(pr, "user", "login"),
              "merged_by": field(pr, "merged_by", "login"),
              "ok": "true",
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in values.items():
                  output.write(f"{key}={value}\n")
          PY
            if [ "$lookup_status" -eq 0 ]; then
              exit 0
            fi
            [ "$lookup_status" -eq 3 ] || exit "$lookup_status"
            if [ "$attempt" -lt 3 ]; then
              echo "::notice::No merged PR found for $SHA (attempt $attempt/3); retrying in 20 seconds"
              sleep 20
            fi
          done
          # A release commit has no pull request: release.yml pushes it with the
          # release App's token, one commit per push. Only that push actor,
          # pushing one commit whose every changed path is in
          # RELEASE_COMMIT_PATHS, skips here; anything else is refused below.
          RELEASE_PUSH_ACTOR='pineforge-app[bot]'
          release_status=1
          if [ "$PUSH_ACTOR" = "$RELEASE_PUSH_ACTOR" ]; then
            # Every page of the pushed commit's file list; a failed read refuses.
            if commit=$(gh api --paginate --slurp "repos/$REPO/commits/$SHA?per_page=100"); then
              release_status=0
              python3 - 3<<<"$commit" <<'RELEASE_PY' || release_status=$?
          import json
          import os
          import re

          # The only paths the engine's release commit changes: its release.yml
          # commits the first two, and a root-level CHANGELOG* is the third.
          ENGINE_RELEASE_PATHS = re.compile(
              r"VERSION|docker/run_failure_codes_diff\.json|CHANGELOG[^/]*")
          # The only path the code generator's release commit changes: its
          # release.yml commits VERSION alone.
          CODEGEN_RELEASE_PATHS = re.compile(r"VERSION")
          # One set per repository, never the union of the two. The axis rule is
          # the "Determine repo axis" step's: a repository name containing
          # `codegen` is the codegen axis, any other is the engine axis.
          RELEASE_COMMIT_PATHS = (
              CODEGEN_RELEASE_PATHS if "codegen" in os.environ["REPO"]
              else ENGINE_RELEASE_PATHS)
          # The commit API lists at most 3000 file records: a list that long may
          # be cut. The limit counts records, never the path names they carry.
          FILE_LIST_LIMIT = 3000

          def reject_constant(value):
              raise ValueError(f"invalid JSON constant: {value}")

          # A release is one commit, so its first parent is the commit main
          # held before the push. A push event without that commit refuses.
          before = os.environ.get("BEFORE", "")
          if not re.fullmatch(r"[0-9a-f]{40}", before):
              raise SystemExit(1)
          try:
              with open(3, encoding="utf-8") as stream:
                  pages = json.load(stream, parse_constant=reject_constant)
          except (OSError, ValueError, RecursionError):
              raise SystemExit(1)
          if not isinstance(pages, list) or not pages:
              raise SystemExit(1)
          records = 0
          paths = []
          for page in pages:
              files = page.get("files") if isinstance(page, dict) else None
              if not isinstance(files, list) or page.get("sha") != os.environ["SHA"]:
                  raise SystemExit(1)
              # An absent or unreadable first parent refuses, as does any
              # parent other than the commit before the push: more than one
              # commit was pushed, and only the last one is listed here.
              parents = page.get("parents")
              first = parents[0] if isinstance(parents, list) and parents else None
              parent = first.get("sha") if isinstance(first, dict) else None
              if not isinstance(parent, str) or parent != before:
                  raise SystemExit(1)
              records += len(files)
              for changed in files:
                  if not isinstance(changed, dict):
                      raise SystemExit(1)
                  paths.append(changed.get("filename"))
                  if changed.get("status") == "renamed" or "previous_filename" in changed:
                      # A rename also changes the path it leaves. A renamed
                      # record that does not name that path refuses the read.
                      previous = changed.get("previous_filename")
                      if not isinstance(previous, str):
                          raise SystemExit(1)
                      paths.append(previous)
          if (not paths or records >= FILE_LIST_LIMIT
                  or not all(isinstance(path, str) and RELEASE_COMMIT_PATHS.fullmatch(path)
                             for path in paths)):
              raise SystemExit(1)
          RELEASE_PY
            fi
          fi
          if [ "$release_status" -eq 0 ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "release commit: baseline is recorded by the release_tag route, not post-merge promote"
            exit 0
          fi
          echo "ok=false" >> "$GITHUB_OUTPUT"
          echo "::error title=baseline-promotion::DEFERRED_NOT_FOUND: no merged PR found for $SHA after 3 attempts; baseline unchanged"
          echo "baseline promotion: DEFERRED_NOT_FOUND: no merged PR found for $SHA after 3 attempts; baseline unchanged" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Only our own merged pull requests and dispatches promote the baseline
        id: authorize
        if: steps.pr.outputs.ok == 'true'
        env:
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ steps.pr.outputs.head_repo }}
          HEAD_IS_FORK: ${{ steps.pr.outputs.head_is_fork }}
          ASSOCIATION: ${{ steps.pr.outputs.association }}
          PR_AUTHOR: ${{ steps.pr.outputs.pr_author }}
          MERGED_BY: ${{ steps.pr.outputs.merged_by }}
          GH_TOKEN: ${{ github.token }}   # read-only use: permission lookups for the PR author and merger
          # Bot logins whose same-repository pull requests count as ours: dependabot[bot] (CI-DEPBOT A)
          # and the org's own GitHub App bot logins by name (space-separated), nothing else.
          ALLOWED_BOTS: "dependabot[bot] pineforge-app[bot]"
        run: |
          set -euo pipefail
          fail() { echo "::error title=authz::$1"; echo "authz: REFUSED: $1" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          case "$EVENT" in
            workflow_dispatch)
              # Only someone with write access to this repository (or our App's token) can cause these
              # events; none of them runs pull-request code.
              ;;
            push)
              [ -n "$REPO" ] || fail "repository is empty"
              [ "$HEAD_REPO" = "$REPO" ] || fail "pull request from another repository (${HEAD_REPO:-unknown})"
              [ "$HEAD_IS_FORK" = "false" ] || fail "pull request from a fork"
              [ -n "$ASSOCIATION" ] || fail "pull request author association is empty"
              [ -n "$PR_AUTHOR" ] || fail "pull request author is empty"
              case "$ASSOCIATION" in
                OWNER|MEMBER|COLLABORATOR) ;;
                *)
                  case " $ALLOWED_BOTS " in
                    *" $PR_AUTHOR "*) ;;
                    *)
                      # A member whose org membership is private shows as CONTRIBUTOR: ask GitHub for the
                      # author's permission on this repository; anything but admin/maintain/write (or a
                      # failed call) refuses.
                      perm=$(gh api "repos/$REPO/collaborators/$PR_AUTHOR/permission" --jq .permission 2>/dev/null || echo none)
                      case "$perm" in admin|maintain|write) ;; *) fail "author ${PR_AUTHOR:-unknown} (${ASSOCIATION:-NONE}) has permission '$perm', not write, and is not an allowlisted bot" ;; esac ;;
                  esac ;;
              esac
              [ -n "$MERGED_BY" ] || fail "push merger is empty"
              case " $ALLOWED_BOTS " in
                *" $MERGED_BY "*) ;;
                *)
                  # No author_association exists for the merger: ask GitHub for the merger's permission on
                  # this repository; anything but admin/maintain/write (or a failed call) refuses.
                  perm=$(gh api "repos/$REPO/collaborators/$MERGED_BY/permission" --jq .permission 2>/dev/null || echo none)
                  case "$perm" in admin|maintain|write) ;; *) fail "push merger ${MERGED_BY:-unknown} has permission '$perm', not write" ;; esac ;;
              esac ;;
            *) fail "event $EVENT does not run baseline promotion (only push and workflow_dispatch are allowed)" ;;
          esac
          echo "authz: allowed ($EVENT${PR_AUTHOR:+ by $PR_AUTHOR})" >> "$GITHUB_STEP_SUMMARY"
          echo "ok=true" >> "$GITHUB_OUTPUT"

  promote:
    needs: [promote-guard]
    if: ${{ needs.promote-guard.result == 'success' && needs.promote-guard.outputs.ok == 'true' }}
    runs-on: ubuntu-24.04
    environment: release-bot
    # One promotion at a time, and a run in progress is never cancelled. The
    # lock is on this job, so a run queues only after promote-guard passed it.
    concurrency:
      group: promote-baseline
      cancel-in-progress: false
    steps:
      - name: Determine repo axis
        id: axis
        run: |
          case "${{ github.repository }}" in
            *codegen*) echo "repo=codegen" >> "$GITHUB_OUTPUT" ;;
            *)         echo "repo=engine"  >> "$GITHUB_OUTPUT" ;;
          esac

      # The pushed main commit (or the dispatch ref), never the PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The safety property is the TREE: the snapshot describes the gated
      # head's tree, so we promote only when the merge commit now on the base
      # branch carries exactly that tree. A base that moved before the merge,
      # or a rewrite, is skipped — those must be re-gated.
      - name: Verify the merged tree is the gated tree
        id: exacttree
        env:
          MERGE_SHA: ${{ needs.promote-guard.outputs.merge_sha }}
          HEAD_SHA: ${{ needs.promote-guard.outputs.head_sha }}
          PR_NUMBER: ${{ needs.promote-guard.outputs.pr_number }}
          BASE_REF: main
        run: |
          set -euo pipefail
          # The PR head's objects, to read its tree: fetched, never checked out or run.
          git fetch --quiet origin "$BASE_REF" "+refs/pull/$PR_NUMBER/head:refs/remotes/origin/pr-head"
          if ! git merge-base --is-ancestor "$MERGE_SHA" "refs/remotes/origin/$BASE_REF"; then
            echo "::notice::merge commit $MERGE_SHA is not on refs/remotes/origin/$BASE_REF; skipping"
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          merge_tree=$(git rev-parse "$MERGE_SHA^{tree}")
          head_tree=$(git rev-parse "$HEAD_SHA^{tree}")
          if [ "$merge_tree" != "$head_tree" ]; then
            echo "::notice::merge commit tree $merge_tree != gated head tree $head_tree — the base moved before the merge; re-gate. skipping"
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "merge_tree=$merge_tree" >> "$GITHUB_OUTPUT"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Confirm the gate on the PR head
        id: ci
        if: steps.exacttree.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.promote-guard.outputs.head_sha }}
          AXIS: ${{ steps.axis.outputs.repo }}
        run: |
          set -euo pipefail
          if [ "$AXIS" = engine ]; then
            # The engine merge gate. GitHub lists newest statuses first; keep
            # the first occurrence of each context across pages, so an older
            # success cannot mask a newer failure or pending verdict.
            statuses=$(gh api --paginate \
              "repos/${{ github.repository }}/commits/$HEAD_SHA/statuses?per_page=100")
            if ! jq -es '
              reduce (.[][]) as $s ({};
                if has($s.context) then . else .[$s.context] = $s.state end)
              | .["pineforge/verify"] == "success"
                and .["pineforge/parity"] == "success"
            ' <<< "$statuses" >/dev/null; then
              echo "::notice::pineforge/verify and pineforge/parity must both be success on $HEAD_SHA — skipping"
              echo "green=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          else
            # A current gate status takes priority over the legacy gate
            # check-run. Evaluate only the latest check-run of each app/name.
            # Every record is checked before any is read. A check-runs page
            # must be an object with a numeric total_count and a check_runs
            # list of objects, each with a numeric id, a string name, an app
            # object with a numeric id, and a conclusion that is a string or
            # null. Every page's total_count must equal the number of records
            # over all pages. Anything else stops the step with no verdict.
            runs=$(gh api --paginate \
              "repos/${{ github.repository }}/commits/$HEAD_SHA/check-runs?per_page=100")
            check_result=$(jq -ers '
              def run_ok:
                type == "object" and (.id | type) == "number" and (.name | type) == "string"
                and (.app | type) == "object" and (.app.id | type) == "number"
                and has("conclusion") and (.conclusion == null or (.conclusion | type) == "string");
              def page_ok:
                type == "object" and (.total_count | type) == "number"
                and (.check_runs | type) == "array" and all(.check_runs[]; run_ok);
              if length == 0 or (all(.[]; page_ok) | not)
                 or (([.[].check_runs | length] | add) as $records
                     | any(.[]; .total_count != $records)) then
                error("invalid check-runs response")
              else
                [.[].check_runs[]] | group_by([.app.id, .name]) | map(max_by(.id))
                | [any(.name == "gate" and .conclusion == "success"),
                   (map(select(.conclusion == "failure" or .conclusion == "cancelled"
                               or .conclusion == "timed_out" or .conclusion == "action_required")) | length)]
                | @tsv
              end
            ' <<< "$runs")
            read -r gate bad <<< "$check_result"
            gate_statuses=$(gh api --paginate \
              "repos/${{ github.repository }}/commits/$HEAD_SHA/statuses?per_page=100")
            # A statuses page must be a list of objects, each with a string
            # context and a string state: a null record stops the step and is
            # never read as an absent gate.
            gate_status=$(jq -ers '
              def status_ok:
                type == "object" and (.context | type) == "string" and (.state | type) == "string";
              if length == 0 or (all(.[]; type == "array" and all(.[]; status_ok)) | not) then
                error("invalid statuses response")
              else
                [ .[][] | select(.context == "gate") ][0]
                | if . == null then "absent"
                  elif .state == "success" then "success"
                  else "blocked" end
              end
            ' <<< "$gate_statuses")
            if [[ "$gate_status" != success && ( "$gate_status" != absent || "$gate" != true ) ]]; then
              echo "::notice::the required gate context has not succeeded on $HEAD_SHA — not green; skipping"
              echo "green=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            if [ "$bad" != "0" ]; then
              echo "::notice::$bad failing check-run(s) on $HEAD_SHA — not green; skipping"
              echo "green=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          echo "green=true" >> "$GITHUB_OUTPUT"

      # The campaign tooling lives in the private pineforge-workflow repo. Rather
      # than a long-lived PAT, mint a short-lived, read-only token from the org
      # App already installed here (the same app-id/private-key release.yml
      # uses), scoped to just that one repo and to reading its contents: without
      # a permission-* input the token would carry every permission the App's
      # installation has, and only the checkout below uses it.
      - name: Mint an org App token to read the campaign tooling
        id: app
        if: steps.ci.outputs.green == 'true'
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.PINEFORGE_APP_ID }}
          private-key: ${{ secrets.PINEFORGE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: pineforge-workflow
          permission-contents: read

      - name: Checkout campaign tooling (pineforge-workflow)
        if: steps.ci.outputs.green == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.WORKFLOW_REPO || 'pineforge-4pass/pineforge-workflow' }}
          ref: ${{ vars.WORKFLOW_REF || 'main' }}
          token: ${{ steps.app.outputs.token }}
          path: .workflow
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.ci.outputs.green == 'true'
        with:
          node-version: '22'

      - name: Install campaign dependencies
        if: steps.ci.outputs.green == 'true'
        # Install before the auth action creates its GCP credentials.
        run: npm ci --prefix .workflow/campaign

      - name: Authenticate to GCP
        if: steps.ci.outputs.green == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        if: steps.ci.outputs.green == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # The plane is Postgres on Cloud SQL; the promotion reads the active
      # baseline and the gate ledger there, so this runner needs the same
      # connector-path proxy operators use.
      - name: Start cloud-sql-proxy
        if: steps.ci.outputs.green == 'true'
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
          chmod +x /tmp/cloud-sql-proxy
          if ( : </dev/tcp/127.0.0.1/5433 ) 2>/dev/null; then
            echo "cloud-sql-proxy port 5433 is already in use" >&2
            exit 1
          fi
          /tmp/cloud-sql-proxy --port 5433 \
            gen-lang-client-0864094636:asia-east1:pineforge-workflow-pg &
          proxy_pid=$!
          for _ in {1..30}; do
            if ! kill -0 "$proxy_pid" 2>/dev/null; then
              echo "cloud-sql-proxy exited before becoming ready" >&2
              exit 1
            fi
            if ( : </dev/tcp/127.0.0.1/5433 ) 2>/dev/null; then exit 0; fi
            sleep 1
          done
          echo "cloud-sql-proxy did not become ready" >&2
          exit 1

      - name: Promote baseline
        if: steps.ci.outputs.green == 'true'
        env:
          PINEFORGE_PLANE: gcp
          PINEFORGE_REGISTRY_HOST: 127.0.0.1:5433
          PINEFORGE_EVIDENCE_BUCKET: ${{ vars.PINEFORGE_EVIDENCE_BUCKET || 'pineforge-workflow-evidence' }}
          # No metadata server on a GitHub runner; mint GCS tokens from the
          # federated gcloud credential explicitly.
          PINEFORGE_GCP_TOKEN_CMD: gcloud auth print-access-token
          # A codegen squash merge: lab promote reads the gated head's and the
          # merge commit's trees from GitHub itself (gh api …/git/commits/<sha>)
          # with the job's own read-only token.
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ needs.promote-guard.outputs.merge_sha }}
          HEAD_SHA: ${{ needs.promote-guard.outputs.head_sha }}
          MERGE_TREE: ${{ steps.exacttree.outputs.merge_tree }}
          PR_NUMBER: ${{ needs.promote-guard.outputs.pr_number }}
          PR_URL: ${{ needs.promote-guard.outputs.pr_url }}
          MERGED_AT: ${{ needs.promote-guard.outputs.merged_at }}
        run: |
          set -euo pipefail
          ms=$(node -e "process.stdout.write(String(Date.parse(process.env.MERGED_AT)))")
          set +e
          node .workflow/campaign/src/baseline-promote.mjs \
            --repo "${{ steps.axis.outputs.repo }}" \
            --merge-commit "$MERGE_SHA" --head-sha "$HEAD_SHA" --merge-tree "$MERGE_TREE" \
            --ci-head "$HEAD_SHA" --ci-green \
            --pr-number "$PR_NUMBER" --pr-url "$PR_URL" --merged-at-ms "$ms"
          code=$?
          set -e
          # Exit 2 is `refuse`: no verdict binds this merge as a single-axis
          # advance -- a cross-cutting engine+codegen change (gated as a composite
          # the single axis cannot complete), an ungated merge, a codegen merge
          # gated only neutral (lab promote takes a pr-gate PASS), a merge tree
          # GitHub does not show as the gated head's, or an engine merge the
          # diff rule cleared (nothing measured). Defer green, do not fail CI; a cross-cutting pair is promoted by
          # hand with `lab promote --composite` once both repos merge (see the
          # baseline-promote skill). Any other non-zero is a real error.
          if [ "$code" = "2" ]; then
            echo "::notice::baseline not promoted (deferred): no verdict binds this merge as a single-axis advance (see the lab promote refusal above). If this was a cross-cutting engine+codegen change, run the composite promote by hand once both repos are merged. Nothing was changed."
            exit 0
          fi
          exit "$code"
