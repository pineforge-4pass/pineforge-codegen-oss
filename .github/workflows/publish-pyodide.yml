name: Publish codegen-pyodide

# Builds @pineforge/codegen-pyodide from the GATE-VALIDATED archive and publishes
# it via npm OIDC Trusted Publishing (mirrors pineforge-codegen-mcp/publish.yml).
# Auto-release: a `v*` tag push (e.g. created by release.yml) publishes for real,
# gate-blocked. workflow_dispatch defaults to a DRY RUN (set dry_run=false to
# publish manually). Publishing only happens after the gate passes.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "npm publish --dry-run (default true). Set false to actually publish."
        type: boolean
        default: true
      claim_placeholder:
        description: "claims the npm name @tunaxis/codegen-pyodide with a 0.0.1 placeholder"
        required: false
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write   # npm OIDC Trusted Publishing

concurrency:
  group: publish-pyodide-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !inputs.claim_placeholder }}
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      # Tag push must match VERSION (mirrors mcp). Skipped for dispatch.
      - name: Verify tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          tag="${TAG_NAME#v}"; file="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag" != "$file" ]; then
            echo "::error::tag '$TAG_NAME' != VERSION '$file'"; exit 1
          fi

      # A prerelease VERSION (1.0.0-rc.1) publishes on dist-tag next, so npm's
      # latest never moves to it; a stable VERSION publishes on latest.
      - name: Resolve npm dist-tag from VERSION
        id: channel
        run: |
          set -euo pipefail
          python3 scripts/release_version.py channels "$(tr -d '[:space:]' < VERSION)" | tee -a "$GITHUB_OUTPUT"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      # npm OIDC Trusted Publishing needs npm >= 11.5.1 (newer than Node 22's npm;
      # npm docs + spec §7 require >= 11.5.1).
      - run: npm install -g npm@11.5.1

      - name: Install + run the gate (publish only ships gate-validated bytes)
        run: |
          python -m pip install -e .
          npm ci
          npm audit --audit-level=high
          npm run gate:selftest
          npm run gate:full

      - name: Assemble the package
        run: node scripts/build-npm-package.mjs

      - name: Publish (real on tag push or dispatch dry_run=false; dry-run otherwise)
        working-directory: npm
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          DIST_TAG: ${{ steps.channel.outputs.npm_dist_tag }}
        run: |
          # Only a prerelease names its dist-tag (next): an explicit --tag, even
          # latest, would bypass npm's refusal to move latest to a lower version.
          tag=()
          if [ "$DIST_TAG" != latest ]; then tag=(--tag "$DIST_TAG"); fi
          if [ "$EVENT" = "push" ] || { [ "$EVENT" = "workflow_dispatch" ] && [ "$DRY_RUN" = "false" ]; }; then
            echo "Publishing for real (--access=public, dist-tag ${DIST_TAG})"
            npm publish --access=public ${tag[@]+"${tag[@]}"}
          else
            echo "DRY RUN (a v* tag push or dispatch with dry_run=false publishes for real)"
            npm publish --dry-run --access=public ${tag[@]+"${tag[@]}"}
          fi

  claim-npm:
    if: ${{ inputs.claim_placeholder }}
    runs-on: ubuntu-24.04
    environment: npm-first
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Install npm for provenance
        run: |
          set -euo pipefail
          npm install -g npm@^11.5.1
          node --version
          npm --version

      - name: Write placeholder package
        id: claim
        run: |
          set -euo pipefail
          CLAIM_DIR=$RUNNER_TEMP/claim-npm
          mkdir -p "$CLAIM_DIR"
          cd "$CLAIM_DIR"
          printf 'path=%s\n' "$CLAIM_DIR" >> "$GITHUB_OUTPUT"
          cat > package.json <<'JSON'
          {
            "name": "@tunaxis/codegen-pyodide",
            "version": "0.0.1",
            "description": "Tunaxis: first release coming soon. https://tunaxis.com",
            "license": "SEE LICENSE IN LICENSE",
            "repository": {
              "type": "git",
              "url": "git+https://github.com/pineforge-4pass/pineforge-codegen-oss.git"
            },
            "publishConfig": { "access": "public" }
          }
          JSON
          cat > README.md <<'README'
          Tunaxis: first release coming soon. https://tunaxis.com
          README

      - name: Verify placeholder package
        working-directory: ${{ steps.claim.outputs.path }}
        env:
          PACK_MANIFEST: ${{ runner.temp }}/claim-npm-pack.json
        run: |
          set -euo pipefail
          npm pack --dry-run --json > "$PACK_MANIFEST"
          node <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const expected = ['README.md', 'package.json'];
          assert.deepEqual(fs.readdirSync('.').sort(), expected);
          assert(expected.every(path => fs.statSync(path).isFile()));
          const packed = JSON.parse(fs.readFileSync(process.env.PACK_MANIFEST, 'utf8'));
          assert.equal(packed.length, 1);
          assert.deepEqual(packed[0].files.map(file => file.path).sort(), expected);
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const readme = fs.readFileSync('README.md', 'utf8');
          assert.equal(pkg.name, '@tunaxis/codegen-pyodide');
          assert.equal(pkg.version, '0.0.1');
          assert.equal(pkg.description, 'Tunaxis: first release coming soon. https://tunaxis.com');
          assert.equal(readme, 'Tunaxis: first release coming soon. https://tunaxis.com\n');
          assert.deepEqual(pkg.repository, {
            type: 'git',
            url: 'git+https://github.com/pineforge-4pass/pineforge-codegen-oss.git'
          });
          const { repository, ...metadata } = pkg;
          assert(!/pineforge/i.test(JSON.stringify(metadata)));
          JS
          # Node scans every JSON field except repository; grep scans the rest of the folder.
          if grep -ri --exclude=package.json pineforge .; then
            exit 1
          else
            test $? -eq 1
          fi

      - name: Publish placeholder to npm
        working-directory: ${{ steps.claim.outputs.path }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_FIRST_PUBLISH }}
        run: npm publish --access public --provenance
