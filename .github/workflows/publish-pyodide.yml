name: Publish codegen-pyodide

# Name claims use the token-free claim-npm job (claim_placeholder=true).
# First real release / first-publish bootstrap (perform these steps in order):
# 1. Configure the @tunaxis/codegen-pyodide trusted publisher for this repository
#    and publish-pyodide.yml with NO environment (publish declares none). Keep
#    the separate @pineforge/codegen-pyodide trusted publisher configured too.
# 2. Only for first_publish=true, create NPM_FIRST_PUBLISH and the protected
#    npm-first environment with a required reviewer and a v* tags-only policy.
#    Neither is used by claim-npm.
# 3. Dispatch on the NEW v<VERSION> tag with first_publish=true, dry_run=false
#    and publish_old_name=true. Never use a VERSION already published under
#    @pineforge/codegen-pyodide.
# 4. Delete the bootstrap secret and npm-first environment afterwards.
# 5. After the first forwarder release, the owner runs this ONCE by hand:
#    npm deprecate @pineforge/codegen-pyodide "<message>"
#    It covers all old-name versions. Deprecate the 0.0.x @tunaxis placeholders
#    by hand too; a prerelease on next leaves latest on its placeholder.
#
# Builds @tunaxis/codegen-pyodide from the GATE-VALIDATED archive and publishes
# it via npm OIDC Trusted Publishing (mirrors pineforge-codegen-mcp/publish.yml).
# Auto-release: a `v*` tag push (e.g. created by release.yml) publishes for real,
# gate-blocked. workflow_dispatch defaults to a DRY RUN (set dry_run=false to
# publish manually). Publishing only happens after the gate passes.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "npm publish --dry-run (default true). Set false to actually publish."
        type: boolean
        default: true
      claim_version:
        description: "placeholder version for the claim job (e.g. 0.0.2 for the OIDC proof)"
        required: false
        default: "0.0.1"
        type: string
      claim_placeholder:
        description: "claims the npm name @tunaxis/codegen-pyodide with a 0.0.1 placeholder"
        required: false
        type: boolean
        default: false
      publish_old_name:
        description: "Also publish the @pineforge compatibility forwarder."
        type: boolean
        default: true
      first_publish:
        description: "Use the one-time token to publish @tunaxis/codegen-pyodide for the first time."
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-pyodide
  cancel-in-progress: false

jobs:
  first-publish:
    name: first-publish
    if: ${{ !inputs.claim_placeholder && startsWith(github.ref, 'refs/tags/v') && github.event_name == 'workflow_dispatch' && inputs.first_publish == true }}
    runs-on: ubuntu-latest
    environment: npm-first
    permissions:
      contents: read
      id-token: write   # Required by the existing token bootstrap's --provenance.
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Verify tag matches VERSION
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${TAG_NAME#v}"; file="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag" != "$file" ]; then
            echo "::error::tag '$TAG_NAME' != VERSION '$file'"; exit 1
          fi

      - name: Resolve npm dist-tag from VERSION
        id: channel
        run: |
          set -euo pipefail
          python3 scripts/release_version.py channels "$(tr -d '[:space:]' < VERSION)" | tee -a "$GITHUB_OUTPUT"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.14"

      # Supplied by core/tnx-codegen; fails closed until that lane merges.
      - name: Refuse an npm package that does not ship tunaxis_codegen-*
        run: python scripts/check_npm_payload.py

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22.14.0"
          registry-url: https://registry.npmjs.org

      - name: Install npm 11.5.1
        run: npm install -g npm@11.5.1

      - name: Print Node and npm versions
        run: |
          node --version
          npm --version

      - name: Require npm >= 11.5.1
        run: |
          set -euo pipefail
          minimum=11.5.1
          actual=$(npm --version)
          lowest=$(printf '%s\n' "$minimum" "$actual" | sort -V | head -n 1)
          if [ "$lowest" != "$minimum" ]; then
            printf 'npm %s is below %s\n' "$actual" "$minimum" >&2
            exit 1
          fi

      - name: Install + run the gate (publish only ships gate-validated bytes)
        run: |
          python -m pip install -e .
          npm ci
          npm audit --audit-level=high
          npm run gate:selftest
          npm run gate:full

      - name: Assemble the package
        run: node scripts/build-npm-package.mjs

      # Render and test both packages before either can be published.
      # @VERSION@ is deliberately kept as a template in npm-compat/package.json.
      - name: Render @pineforge compatibility package
        env:
          VERSION: ${{ steps.channel.outputs.version }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "$version" != "$VERSION" ]; then
            echo "::error::VERSION changed after channel resolution"; exit 1
          fi
          sed -i "s/@VERSION@/${version}/g" npm-compat/package.json
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const text = readFileSync("npm-compat/package.json", "utf8");
          assert.ok(!text.includes("@VERSION@"), "unrendered compatibility version");
          const pkg = JSON.parse(text);
          assert.equal(pkg.version, process.env.VERSION);
          assert.equal(pkg.dependencies["@tunaxis/codegen-pyodide"], process.env.VERSION);
          JS
          cp LICENSE npm-compat/LICENSE
          cp npm/tables.json npm-compat/tables.json
          cp npm/release.json npm-compat/release.json
          cp npm/tunaxis_codegen/diagnostics_catalog.json npm-compat/diagnostics_catalog.json
          cmp npm/tables.json npm-compat/tables.json
          cmp npm/release.json npm-compat/release.json
          cmp npm/tunaxis_codegen/diagnostics_catalog.json npm-compat/diagnostics_catalog.json

      - name: Verify @pineforge compatibility with the assembled payload
        run: node npm/test-compat.mjs npm

      - name: Publish @tunaxis/codegen-pyodide (first publish with one-time token)
        working-directory: npm
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          DIST_TAG: ${{ steps.channel.outputs.npm_dist_tag }}
          VERSION: ${{ steps.channel.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_FIRST_PUBLISH }}
        run: |
          set -euo pipefail
          tag=()
          if [ "$DIST_TAG" != latest ]; then tag=(--tag "$DIST_TAG"); fi
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$DRY_RUN" = "false" ]; then
            if npm view "@tunaxis/codegen-pyodide@$VERSION" version; then
              echo "@tunaxis/codegen-pyodide@$VERSION already exists; skipping publish"
            else
              echo "Publishing first @tunaxis package for real (--access=public, dist-tag ${DIST_TAG})"
              npm publish --access public --provenance ${tag[@]+"${tag[@]}"}
            fi
          else
            echo "DRY RUN (set first_publish=true and dry_run=false for the first real publish)"
            npm publish --dry-run --access public ${tag[@]+"${tag[@]}"}
          fi

  publish:
    needs: first-publish
    if: >-
      ${{ !cancelled() && !inputs.claim_placeholder && (github.event_name != 'workflow_dispatch' || inputs.first_publish != true || needs['first-publish'].result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm OIDC Trusted Publishing for both package names
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      # Every v* tag ref, including a dispatch, must match VERSION.
      - name: Verify tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          tag="${TAG_NAME#v}"; file="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag" != "$file" ]; then
            echo "::error::tag '$TAG_NAME' != VERSION '$file'"; exit 1
          fi

      # A prerelease VERSION (1.0.0-rc.1) publishes on dist-tag next, so npm's
      # latest never moves to it; a stable VERSION publishes on latest.
      - name: Resolve npm dist-tag from VERSION
        id: channel
        run: |
          set -euo pipefail
          python3 scripts/release_version.py channels "$(tr -d '[:space:]' < VERSION)" | tee -a "$GITHUB_OUTPUT"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.14"

      # Supplied by core/tnx-codegen; fails closed until that lane merges.
      - name: Refuse an npm package that does not ship tunaxis_codegen-*
        run: python scripts/check_npm_payload.py

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22.14.0"
          registry-url: https://registry.npmjs.org

      # npm OIDC Trusted Publishing needs npm >= 11.5.1 and Node >= 22.14.0.
      - name: Install npm 11.5.1
        run: npm install -g npm@11.5.1

      - name: Print Node and npm versions
        run: |
          node --version
          npm --version

      - name: Require npm >= 11.5.1
        run: |
          set -euo pipefail
          minimum=11.5.1
          actual=$(npm --version)
          lowest=$(printf '%s\n' "$minimum" "$actual" | sort -V | head -n 1)
          if [ "$lowest" != "$minimum" ]; then
            printf 'npm %s is below %s\n' "$actual" "$minimum" >&2
            exit 1
          fi

      - name: Install + run the gate (publish only ships gate-validated bytes)
        run: |
          python -m pip install -e .
          npm ci
          npm audit --audit-level=high
          npm run gate:selftest
          npm run gate:full

      - name: Assemble the package
        run: node scripts/build-npm-package.mjs

      # Render and test even when publish_old_name=false, before any publish.
      # @VERSION@ is deliberately kept as a template in npm-compat/package.json.
      - name: Render @pineforge compatibility package
        env:
          VERSION: ${{ steps.channel.outputs.version }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "$version" != "$VERSION" ]; then
            echo "::error::VERSION changed after channel resolution"; exit 1
          fi
          sed -i "s/@VERSION@/${version}/g" npm-compat/package.json
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const text = readFileSync("npm-compat/package.json", "utf8");
          assert.ok(!text.includes("@VERSION@"), "unrendered compatibility version");
          const pkg = JSON.parse(text);
          assert.equal(pkg.version, process.env.VERSION);
          assert.equal(pkg.dependencies["@tunaxis/codegen-pyodide"], process.env.VERSION);
          JS
          cp LICENSE npm-compat/LICENSE
          cp npm/tables.json npm-compat/tables.json
          cp npm/release.json npm-compat/release.json
          cp npm/tunaxis_codegen/diagnostics_catalog.json npm-compat/diagnostics_catalog.json
          cmp npm/tables.json npm-compat/tables.json
          cmp npm/release.json npm-compat/release.json
          cmp npm/tunaxis_codegen/diagnostics_catalog.json npm-compat/diagnostics_catalog.json

      - name: Verify @pineforge compatibility with the assembled payload
        run: node npm/test-compat.mjs npm

      - name: Publish @tunaxis/codegen-pyodide via OIDC (real on tag push or dispatch dry_run=false; dry-run otherwise)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.first_publish != true }}
        working-directory: npm
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          DIST_TAG: ${{ steps.channel.outputs.npm_dist_tag }}
          VERSION: ${{ steps.channel.outputs.version }}
        run: |
          set -euo pipefail
          # Only a prerelease names its dist-tag (next): an explicit --tag, even
          # latest, would bypass npm's refusal to move latest to a lower version.
          tag=()
          if [ "$DIST_TAG" != latest ]; then tag=(--tag "$DIST_TAG"); fi
          if [ "$EVENT" = "push" ] || { [ "$EVENT" = "workflow_dispatch" ] && [ "$DRY_RUN" = "false" ]; }; then
            if npm view "@tunaxis/codegen-pyodide@$VERSION" version; then
              echo "@tunaxis/codegen-pyodide@$VERSION already exists; skipping publish"
            else
              echo "Publishing for real via OIDC (--access=public, dist-tag ${DIST_TAG})"
              npm publish --access=public --provenance ${tag[@]+"${tag[@]}"}
            fi
          else
            echo "DRY RUN (a v* tag push or dispatch with dry_run=false publishes for real)"
            npm publish --dry-run --access=public ${tag[@]+"${tag[@]}"}
          fi

      - name: Publish @pineforge/codegen-pyodide (final compatibility package via OIDC)
        if: ${{ github.event_name == 'push' || inputs.publish_old_name == true }}
        working-directory: npm-compat
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          DIST_TAG: ${{ steps.channel.outputs.npm_dist_tag }}
          VERSION: ${{ steps.channel.outputs.version }}
        run: |
          set -euo pipefail
          # The existing old-name trusted publisher remains in use for this step.
          # Keep the old-name package on the same latest/next channel as Tunaxis.
          tag=()
          if [ "$DIST_TAG" != latest ]; then tag=(--tag "$DIST_TAG"); fi
          if [ "$EVENT" = "push" ] || { [ "$EVENT" = "workflow_dispatch" ] && [ "$DRY_RUN" = "false" ]; }; then
            if npm view "@pineforge/codegen-pyodide@$VERSION" version; then
              echo "@pineforge/codegen-pyodide@$VERSION already exists; skipping publish"
            else
              echo "Publishing for real via OIDC (--access=public, dist-tag ${DIST_TAG})"
              npm publish --access=public --provenance ${tag[@]+"${tag[@]}"}
            fi
          else
            echo "DRY RUN (a v* tag push or dispatch with dry_run=false publishes for real)"
            npm publish --dry-run --access=public ${tag[@]+"${tag[@]}"}
          fi

      # npm OIDC authenticates publish only. After the first forwarder release,
      # the owner runs npm deprecate @pineforge/codegen-pyodide "<message>" once
      # by hand; omitting @<version> covers every version of the old name.

  claim-npm:
    if: ${{ inputs.claim_placeholder }}
    runs-on: ubuntu-24.04
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Install npm for provenance
        run: |
          set -euo pipefail
          npm install -g npm@^11.5.1
          node --version
          npm --version

      - name: Write placeholder package
        id: claim
        env:
          CLAIM_VERSION: ${{ inputs.claim_version }}
        run: |
          set -euo pipefail
          [[ "$CLAIM_VERSION" =~ ^0\.0\.[0-9]+$ ]] || { echo "claim_version must be 0.0.N, got '$CLAIM_VERSION'"; exit 1; }
          CLAIM_DIR=$RUNNER_TEMP/claim-npm
          mkdir -p "$CLAIM_DIR"
          cd "$CLAIM_DIR"
          printf 'path=%s\n' "$CLAIM_DIR" >> "$GITHUB_OUTPUT"
          cat > package.json <<'JSON'
          {
            "name": "@tunaxis/codegen-pyodide",
            "version": "0.0.1",
            "description": "Tunaxis: first release coming soon. https://tunaxis.com",
            "license": "UNLICENSED",
            "repository": {
              "type": "git",
              "url": "git+https://github.com/pineforge-4pass/pineforge-codegen-oss.git"
            },
            "publishConfig": { "access": "public" }
          }
          JSON
          cat > README.md <<'README'
          Tunaxis: first release coming soon. https://tunaxis.com
          README
          node -e 'const fs=require("node:fs");const p=JSON.parse(fs.readFileSync("package.json","utf8"));p.version=process.env.CLAIM_VERSION;fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")'

      - name: Verify placeholder package
        working-directory: ${{ steps.claim.outputs.path }}
        env:
          PACK_MANIFEST: ${{ runner.temp }}/claim-npm-pack.json
          CLAIM_VERSION: ${{ inputs.claim_version }}
        run: |
          set -euo pipefail
          npm pack --dry-run --json > "$PACK_MANIFEST"
          node <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const expected = ['README.md', 'package.json'];
          assert.deepEqual(fs.readdirSync('.').sort(), expected);
          assert(expected.every(path => fs.statSync(path).isFile()));
          const packed = JSON.parse(fs.readFileSync(process.env.PACK_MANIFEST, 'utf8'));
          assert.equal(packed.length, 1);
          assert.deepEqual(packed[0].files.map(file => file.path).sort(), expected);
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const readme = fs.readFileSync('README.md', 'utf8');
          assert.equal(pkg.name, '@tunaxis/codegen-pyodide');
          assert.equal(pkg.version, process.env.CLAIM_VERSION);
          assert.equal(pkg.license, 'UNLICENSED');
          assert.equal(pkg.description, 'Tunaxis: first release coming soon. https://tunaxis.com');
          assert.equal(readme, 'Tunaxis: first release coming soon. https://tunaxis.com\n');
          assert.deepEqual(pkg.repository, {
            type: 'git',
            url: 'git+https://github.com/pineforge-4pass/pineforge-codegen-oss.git'
          });
          const { repository, ...metadata } = pkg;
          assert(!/pineforge/i.test(JSON.stringify(metadata)));
          JS
          # Node scans every JSON field except repository; grep scans the rest of the folder.
          if grep -ri --exclude=package.json pineforge .; then
            exit 1
          else
            test $? -eq 1
          fi

      - name: Publish placeholder to npm (OIDC trusted publishing, no token)
        working-directory: ${{ steps.claim.outputs.path }}
        run: npm publish --access public --provenance
