name: Publish codegen-pyodide

# First-publish owner bootstrap (perform these steps in order):
# 1. Create the secret NPM_FIRST_PUBLISH and protected environment npm-first in
#    pineforge-codegen-oss.
# 2. Run this workflow once with first_publish=true and dry_run=false.
# 3. Configure the trusted publisher for @tunaxis/codegen-pyodide on npmjs.com.
# 4. Delete the secret and the npm-first environment afterwards.
#
# Builds @tunaxis/codegen-pyodide from the GATE-VALIDATED archive and publishes
# it via npm OIDC Trusted Publishing (mirrors pineforge-codegen-mcp/publish.yml).
# Auto-release: a `v*` tag push (e.g. created by release.yml) publishes for real,
# gate-blocked. workflow_dispatch defaults to a DRY RUN (set dry_run=false to
# publish manually). Publishing only happens after the gate passes.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "npm publish --dry-run (default true). Set false to actually publish."
        type: boolean
        default: true
      claim_placeholder:
        description: "claims the npm name @tunaxis/codegen-pyodide with a 0.0.1 placeholder"
        required: false
        type: boolean
        default: false
      publish_old_name:
        description: "Also publish and deprecate the final @pineforge compatibility package."
        type: boolean
        default: true
      first_publish:
        description: "Use the one-time token to publish @tunaxis/codegen-pyodide for the first time."
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write   # npm OIDC Trusted Publishing
  # Trusted Publishing is package-scoped: configure separate trusted publisher
  # projects for BOTH @tunaxis/codegen-pyodide and @pineforge/codegen-pyodide.

concurrency:
  group: publish-pyodide-${{ github.ref }}
  cancel-in-progress: false

jobs:
  first-publish:
    name: first-publish
    if: ${{ !inputs.claim_placeholder && github.event_name == 'workflow_dispatch' && inputs.first_publish == true }}
    runs-on: ubuntu-latest
    environment: npm-first
    permissions:
      contents: read
      id-token: write
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Resolve npm dist-tag from VERSION
        id: channel
        run: |
          set -euo pipefail
          python3 scripts/release_version.py channels "$(tr -d '[:space:]' < VERSION)" | tee -a "$GITHUB_OUTPUT"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22.14.0"
          registry-url: https://registry.npmjs.org

      - name: Install npm 11.5.1 or newer
        run: npm install -g npm@^11.5.1

      - name: Print Node and npm versions
        run: |
          node --version
          npm --version

      - name: Require npm >= 11.5.1
        run: |
          set -euo pipefail
          minimum=11.5.1
          actual=$(npm --version)
          lowest=$(printf '%s\n' "$minimum" "$actual" | sort -V | head -n 1)
          if [ "$lowest" != "$minimum" ]; then
            printf 'npm %s is below %s\n' "$actual" "$minimum" >&2
            exit 1
          fi

      - name: Install + run the gate (publish only ships gate-validated bytes)
        run: |
          python -m pip install -e .
          npm ci
          npm audit --audit-level=high
          npm run gate:selftest
          npm run gate:full

      - name: Assemble the package
        run: node scripts/build-npm-package.mjs

      - name: Publish @tunaxis/codegen-pyodide (first publish with one-time token)
        working-directory: npm
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          DIST_TAG: ${{ steps.channel.outputs.npm_dist_tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_FIRST_PUBLISH }}
        run: |
          tag=()
          if [ "$DIST_TAG" != latest ]; then tag=(--tag "$DIST_TAG"); fi
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$DRY_RUN" = "false" ]; then
            echo "Publishing first @tunaxis package for real (--access=public, dist-tag ${DIST_TAG})"
            npm publish --access public --provenance ${tag[@]+"${tag[@]}"}
          else
            echo "DRY RUN (set first_publish=true and dry_run=false for the first real publish)"
            npm publish --dry-run --access public ${tag[@]+"${tag[@]}"}
          fi

  publish:
    needs: first-publish
    if: >-
      ${{ always() && !inputs.claim_placeholder && (github.event_name != 'workflow_dispatch' || inputs.first_publish != true || needs['first-publish'].result == 'success') }}
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      # Tag push must match VERSION (mirrors mcp). Skipped for dispatch.
      - name: Verify tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          tag="${TAG_NAME#v}"; file="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag" != "$file" ]; then
            echo "::error::tag '$TAG_NAME' != VERSION '$file'"; exit 1
          fi

      # A prerelease VERSION (1.0.0-rc.1) publishes on dist-tag next, so npm's
      # latest never moves to it; a stable VERSION publishes on latest.
      - name: Resolve npm dist-tag from VERSION
        id: channel
        run: |
          set -euo pipefail
          python3 scripts/release_version.py channels "$(tr -d '[:space:]' < VERSION)" | tee -a "$GITHUB_OUTPUT"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22.14.0"
          registry-url: https://registry.npmjs.org

      # npm OIDC Trusted Publishing needs npm >= 11.5.1 and Node >= 22.14.0.
      - name: Install npm 11.5.1 or newer
        run: npm install -g npm@^11.5.1

      - name: Print Node and npm versions
        run: |
          node --version
          npm --version

      - name: Require npm >= 11.5.1
        run: |
          set -euo pipefail
          minimum=11.5.1
          actual=$(npm --version)
          lowest=$(printf '%s\n' "$minimum" "$actual" | sort -V | head -n 1)
          if [ "$lowest" != "$minimum" ]; then
            printf 'npm %s is below %s\n' "$actual" "$minimum" >&2
            exit 1
          fi

      - name: Install + run the gate (publish only ships gate-validated bytes)
        run: |
          python -m pip install -e .
          npm ci
          npm audit --audit-level=high
          npm run gate:selftest
          npm run gate:full

      - name: Assemble the package
        run: node scripts/build-npm-package.mjs

      - name: Publish @tunaxis/codegen-pyodide via OIDC (real on tag push or dispatch dry_run=false; dry-run otherwise)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.first_publish != true }}
        working-directory: npm
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          DIST_TAG: ${{ steps.channel.outputs.npm_dist_tag }}
        run: |
          # Only a prerelease names its dist-tag (next): an explicit --tag, even
          # latest, would bypass npm's refusal to move latest to a lower version.
          tag=()
          if [ "$DIST_TAG" != latest ]; then tag=(--tag "$DIST_TAG"); fi
          if [ "$EVENT" = "push" ] || { [ "$EVENT" = "workflow_dispatch" ] && [ "$DRY_RUN" = "false" ]; }; then
            echo "Publishing for real via OIDC (--access=public, dist-tag ${DIST_TAG})"
            npm publish --access=public ${tag[@]+"${tag[@]}"}
          else
            echo "DRY RUN (a v* tag push or dispatch with dry_run=false publishes for real)"
            npm publish --dry-run --access=public ${tag[@]+"${tag[@]}"}
          fi

      # The old package is rendered only after the Tunaxis publish step succeeds.
      # @VERSION@ is deliberately kept as a template in npm-compat/package.json.
      - name: Render @pineforge compatibility package
        if: ${{ github.event_name == 'push' || inputs.publish_old_name == true }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "$version" != "${{ steps.channel.outputs.version }}" ]; then
            echo "::error::VERSION changed after channel resolution"; exit 1
          fi
          sed -i "s/@VERSION@/${version}/g" npm-compat/package.json
          cp LICENSE npm-compat/LICENSE
          cmp -s LICENSE npm-compat/LICENSE

      - name: Publish @pineforge/codegen-pyodide (final compatibility package via OIDC)
        if: ${{ github.event_name == 'push' || inputs.publish_old_name == true }}
        working-directory: npm-compat
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          DIST_TAG: ${{ steps.channel.outputs.npm_dist_tag }}
        run: |
          # The existing old-name trusted publisher remains in use for this step.
          # Keep the old-name package on the same latest/next channel as Tunaxis.
          tag=()
          if [ "$DIST_TAG" != latest ]; then tag=(--tag "$DIST_TAG"); fi
          if [ "$EVENT" = "push" ] || { [ "$EVENT" = "workflow_dispatch" ] && [ "$DRY_RUN" = "false" ]; }; then
            echo "Publishing for real via OIDC (--access=public, dist-tag ${DIST_TAG})"
            npm publish --access=public ${tag[@]+"${tag[@]}"}
          else
            echo "DRY RUN (a v* tag push or dispatch with dry_run=false publishes for real)"
            npm publish --dry-run --access=public ${tag[@]+"${tag[@]}"}
          fi

      - name: Deprecate the published @pineforge version
        if: ${{ github.event_name == 'push' || inputs.publish_old_name == true }}
        working-directory: npm-compat
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          VERSION: ${{ steps.channel.outputs.version }}
        run: |
          set -euo pipefail
          message="$(cat DEPRECATION.txt)"
          if [ "$EVENT" = "push" ] || { [ "$EVENT" = "workflow_dispatch" ] && [ "$DRY_RUN" = "false" ]; }; then
            npm deprecate "@pineforge/codegen-pyodide@${VERSION}" "$message"
          else
            echo "DRY RUN (would deprecate @pineforge/codegen-pyodide@${VERSION}: ${message})"
          fi

  claim-npm:
    if: ${{ inputs.claim_placeholder }}
    runs-on: ubuntu-24.04
    environment: npm-first
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Install npm for provenance
        run: |
          set -euo pipefail
          npm install -g npm@^11.5.1
          node --version
          npm --version

      - name: Write placeholder package
        id: claim
        run: |
          set -euo pipefail
          CLAIM_DIR=$RUNNER_TEMP/claim-npm
          mkdir -p "$CLAIM_DIR"
          cd "$CLAIM_DIR"
          printf 'path=%s\n' "$CLAIM_DIR" >> "$GITHUB_OUTPUT"
          cat > package.json <<'JSON'
          {
            "name": "@tunaxis/codegen-pyodide",
            "version": "0.0.1",
            "description": "Tunaxis: first release coming soon. https://tunaxis.com",
            "license": "UNLICENSED",
            "repository": {
              "type": "git",
              "url": "git+https://github.com/pineforge-4pass/pineforge-codegen-oss.git"
            },
            "publishConfig": { "access": "public" }
          }
          JSON
          cat > README.md <<'README'
          Tunaxis: first release coming soon. https://tunaxis.com
          README

      - name: Verify placeholder package
        working-directory: ${{ steps.claim.outputs.path }}
        env:
          PACK_MANIFEST: ${{ runner.temp }}/claim-npm-pack.json
        run: |
          set -euo pipefail
          npm pack --dry-run --json > "$PACK_MANIFEST"
          node <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const expected = ['README.md', 'package.json'];
          assert.deepEqual(fs.readdirSync('.').sort(), expected);
          assert(expected.every(path => fs.statSync(path).isFile()));
          const packed = JSON.parse(fs.readFileSync(process.env.PACK_MANIFEST, 'utf8'));
          assert.equal(packed.length, 1);
          assert.deepEqual(packed[0].files.map(file => file.path).sort(), expected);
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const readme = fs.readFileSync('README.md', 'utf8');
          assert.equal(pkg.name, '@tunaxis/codegen-pyodide');
          assert.equal(pkg.version, '0.0.1');
          assert.equal(pkg.license, 'UNLICENSED');
          assert.equal(pkg.description, 'Tunaxis: first release coming soon. https://tunaxis.com');
          assert.equal(readme, 'Tunaxis: first release coming soon. https://tunaxis.com\n');
          assert.deepEqual(pkg.repository, {
            type: 'git',
            url: 'git+https://github.com/pineforge-4pass/pineforge-codegen-oss.git'
          });
          const { repository, ...metadata } = pkg;
          assert(!/pineforge/i.test(JSON.stringify(metadata)));
          JS
          # Node scans every JSON field except repository; grep scans the rest of the folder.
          if grep -ri --exclude=package.json pineforge .; then
            exit 1
          else
            test $? -eq 1
          fi

      - name: Publish placeholder to npm
        working-directory: ${{ steps.claim.outputs.path }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_FIRST_PUBLISH }}
        run: npm publish --access public --provenance
