name: Publish codegen-pyodide

# Builds @tunaxis/codegen-pyodide from the GATE-VALIDATED archive and publishes
# it via npm OIDC Trusted Publishing (mirrors pineforge-codegen-mcp/publish.yml).
# Auto-release: a `v*` tag push (e.g. created by release.yml) publishes for real,
# gate-blocked. workflow_dispatch defaults to a DRY RUN (set dry_run=false to
# publish manually). Publishing only happens after the gate passes.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "npm publish --dry-run (default true). Set false to actually publish."
        type: boolean
        default: true
      publish_old_name:
        description: "Also publish and deprecate the final @pineforge compatibility package."
        type: boolean
        default: true
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write   # npm OIDC Trusted Publishing
  # Trusted Publishing is package-scoped: configure separate trusted publisher
  # projects for BOTH @tunaxis/codegen-pyodide and @pineforge/codegen-pyodide.

concurrency:
  group: publish-pyodide-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      # Tag push must match VERSION (mirrors mcp). Skipped for dispatch.
      - name: Verify tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          tag="${TAG_NAME#v}"; file="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag" != "$file" ]; then
            echo "::error::tag '$TAG_NAME' != VERSION '$file'"; exit 1
          fi

      # A prerelease VERSION (1.0.0-rc.1) publishes on dist-tag next, so npm's
      # latest never moves to it; a stable VERSION publishes on latest.
      - name: Resolve npm dist-tag from VERSION
        id: channel
        run: |
          set -euo pipefail
          python3 scripts/release_version.py channels "$(tr -d '[:space:]' < VERSION)" | tee -a "$GITHUB_OUTPUT"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      # npm OIDC Trusted Publishing needs npm >= 11.5.1 (newer than Node 22's npm;
      # npm docs + spec §7 require >= 11.5.1).
      - run: npm install -g npm@11.5.1

      - name: Install + run the gate (publish only ships gate-validated bytes)
        run: |
          python -m pip install -e .
          npm ci
          npm audit --audit-level=high
          npm run gate:selftest
          npm run gate:full

      - name: Assemble the package
        run: node scripts/build-npm-package.mjs

      - name: Publish @tunaxis/codegen-pyodide (real on tag push or dispatch dry_run=false; dry-run otherwise)
        working-directory: npm
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          DIST_TAG: ${{ steps.channel.outputs.npm_dist_tag }}
        run: |
          # Only a prerelease names its dist-tag (next): an explicit --tag, even
          # latest, would bypass npm's refusal to move latest to a lower version.
          tag=()
          if [ "$DIST_TAG" != latest ]; then tag=(--tag "$DIST_TAG"); fi
          if [ "$EVENT" = "push" ] || { [ "$EVENT" = "workflow_dispatch" ] && [ "$DRY_RUN" = "false" ]; }; then
            echo "Publishing for real (--access=public, dist-tag ${DIST_TAG})"
            npm publish --access=public ${tag[@]+"${tag[@]}"}
          else
            echo "DRY RUN (a v* tag push or dispatch with dry_run=false publishes for real)"
            npm publish --dry-run --access=public ${tag[@]+"${tag[@]}"}
          fi

      # The old package is rendered only after the Tunaxis publish step succeeds.
      # @VERSION@ is deliberately kept as a template in npm-compat/package.json.
      - name: Render @pineforge compatibility package
        if: ${{ github.event_name == 'push' || inputs.publish_old_name == true }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "$version" != "${{ steps.channel.outputs.version }}" ]; then
            echo "::error::VERSION changed after channel resolution"; exit 1
          fi
          sed -i "s/@VERSION@/${version}/g" npm-compat/package.json
          cp LICENSE npm-compat/LICENSE
          cmp -s LICENSE npm-compat/LICENSE

      - name: Publish @pineforge/codegen-pyodide (final compatibility package)
        if: ${{ github.event_name == 'push' || inputs.publish_old_name == true }}
        working-directory: npm-compat
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          DIST_TAG: ${{ steps.channel.outputs.npm_dist_tag }}
        run: |
          # Keep the old-name package on the same latest/next channel as Tunaxis.
          tag=()
          if [ "$DIST_TAG" != latest ]; then tag=(--tag "$DIST_TAG"); fi
          if [ "$EVENT" = "push" ] || { [ "$EVENT" = "workflow_dispatch" ] && [ "$DRY_RUN" = "false" ]; }; then
            echo "Publishing for real (--access=public, dist-tag ${DIST_TAG})"
            npm publish --access=public ${tag[@]+"${tag[@]}"}
          else
            echo "DRY RUN (a v* tag push or dispatch with dry_run=false publishes for real)"
            npm publish --dry-run --access=public ${tag[@]+"${tag[@]}"}
          fi

      - name: Deprecate the published @pineforge version
        if: ${{ github.event_name == 'push' || inputs.publish_old_name == true }}
        working-directory: npm-compat
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          VERSION: ${{ steps.channel.outputs.version }}
        run: |
          set -euo pipefail
          message="$(cat DEPRECATION.txt)"
          if [ "$EVENT" = "push" ] || { [ "$EVENT" = "workflow_dispatch" ] && [ "$DRY_RUN" = "false" ]; }; then
            npm deprecate "@pineforge/codegen-pyodide@${VERSION}" "$message"
          else
            echo "DRY RUN (would deprecate @pineforge/codegen-pyodide@${VERSION}: ${message})"
          fi
