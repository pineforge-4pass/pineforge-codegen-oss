name: Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  authz:
    name: authz
    # Standard GitHub-hosted label (owner #1050); never a larger-runner label.
    runs-on: ubuntu-24.04
    permissions: {}
    # No timeout-minutes: the owner's no-time-limits rule (check-no-time-limits refuses new ones).
    steps:
      - name: Only our own pull requests and our own events run CI
        env:
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          WR_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          WR_ACTOR: ${{ github.event.workflow_run.triggering_actor.login }}
          GH_TOKEN: ${{ github.token }}   # read-only use: one permission lookup for workflow_run
          # Bot logins whose same-repository pull requests count as ours: dependabot[bot] (CI-DEPBOT A)
          # and the org's own GitHub App bot logins by name (space-separated), nothing else.
          ALLOWED_BOTS: "dependabot[bot] pineforge-app[bot]"
        run: |
          set -eu
          fail() { echo "::error title=authz::$1"; echo "authz: REFUSED: $1" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          case "$EVENT" in
            push|workflow_dispatch|schedule|merge_group|release|workflow_call|repository_dispatch)
              # Only someone with write access to this repository (or our App's token) can cause these
              # events; none of them runs pull-request code.
              ;;
            workflow_run)
              # LB-437: bind identity to the triggering run and its re-runner.
              # These two App bots are fixed canon policy; ALLOWED_BOTS is PR-only.
              [ -n "${WR_HEAD_REPO:-}" ] || fail "workflow_run head repository is missing"
              [ -n "${WR_ACTOR:-}" ] || fail "workflow_run triggering actor is missing"
              [ "$WR_HEAD_REPO" = "$REPO" ] || fail "workflow_run head repository does not match this repository"
              case "$WR_ACTOR" in
                "pineforge-app[bot]"|"pineforge-ci-dispatcher[bot]") ;;
                *"[bot]") fail "workflow_run bot is not on the canon allowlist" ;;
                *)
                  perm=$(gh api "repos/$REPO/collaborators/$WR_ACTOR/permission" --jq .permission 2>/dev/null) || fail "workflow_run permission lookup failed"
                  case "$perm" in admin|maintain|write) ;; *) fail "workflow_run triggering actor does not have write permission" ;; esac ;;
              esac ;;
            pull_request)
              [ "$HEAD_REPO" = "$REPO" ] || fail "pull request from another repository (${HEAD_REPO:-unknown})"
              [ "$HEAD_IS_FORK" = "false" ] || fail "pull request from a fork"
              case "$ASSOCIATION" in
                OWNER|MEMBER|COLLABORATOR) ;;
                *)
                  case " $ALLOWED_BOTS " in
                    *" $PR_AUTHOR "*) ;;
                    *)
                      # A member whose org membership is private shows as CONTRIBUTOR: ask GitHub for the
                      # author's permission on this repository; anything but admin/maintain/write (or a
                      # failed call) refuses.
                      perm=$(gh api "repos/$REPO/collaborators/$PR_AUTHOR/permission" --jq .permission 2>/dev/null || echo none)
                      case "$perm" in admin|maintain|write) ;; *) fail "author ${PR_AUTHOR:-unknown} (${ASSOCIATION:-NONE}) has permission '$perm', not write, and is not an allowlisted bot" ;; esac ;;
                  esac ;;
              esac ;;
            *) fail "event $EVENT does not run CI (pull_request_target and other events are not allowed)" ;;
          esac
          echo "authz: allowed ($EVENT${PR_AUTHOR:+ by $PR_AUTHOR})" >> "$GITHUB_STEP_SUMMARY"

  changes:
    name: changes
    needs: [authz]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      workflows_only: ${{ steps.classify.outputs.workflows_only }}
      code: ${{ steps.classify.outputs.code }}
    steps:
      - name: "Check out the exact head with full history"
        if: "${{ needs.authz.result == 'success' }}"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
          fetch-depth: 0
          persist-credentials: false
      - name: "Classify the PR diff (canonical; copy as is)"
        id: "classify"
        if: "${{ needs.authz.result == 'success' }}"
        shell: "bash"
        env:
          EVENT: "${{ github.event_name }}"
          PR_BASE: "${{ github.event.pull_request.base.sha }}"
          PR_HEAD: "${{ github.event.pull_request.head.sha }}"
        run: |
          set -euo pipefail
          docs_only=false
          workflows_only=false
          code=true
          if [[ "$EVENT" == pull_request ]]; then
            [[ "$PR_BASE" =~ ^[0-9a-f]{40}$ && "$PR_HEAD" =~ ^[0-9a-f]{40}$ ]]
            if ! checkout_head=$(git rev-parse --verify HEAD) ||
               ! git rev-parse --verify "$PR_BASE^{commit}" > /dev/null ||
               ! git rev-parse --verify "$PR_HEAD^{commit}" > /dev/null; then
              printf 'docs_only=false\nworkflows_only=false\ncode=true\n' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [[ "$checkout_head" == "$PR_HEAD" ]]
            diff_paths=$(mktemp "$RUNNER_TEMP/ci-changes.XXXXXXXX")
            if ! git diff --no-ext-diff --no-textconv --no-renames --ignore-submodules=none --raw --no-abbrev -z "$PR_BASE...$PR_HEAD" -- > "$diff_paths"; then
              printf 'docs_only=false\nworkflows_only=false\ncode=true\n' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            has_docs=false
            has_workflows=false
            has_code=false
            while IFS= read -r -d '' change; do
              if ! IFS= read -r -d '' path; then
                echo "::error::incomplete Git raw diff record"
                exit 1
              fi
              if [[ ! "$change" =~ ^:([0-7]{6})[[:space:]]([0-7]{6})[[:space:]] ]]; then
                echo "::error::invalid Git raw diff modes"
                exit 1
              fi
              old_mode=${BASH_REMATCH[1]}
              new_mode=${BASH_REMATCH[2]}
              if [[ ! "$change" =~ ^:[0-7]{6}\ [0-7]{6}\ [0-9a-f]{40}\ [0-9a-f]{40}\ [ACDMRTUXB][0-9]*$ ]]; then
                has_code=true
                continue
              fi
              if [[ "$old_mode" == 160000 || "$new_mode" == 160000 ]]; then
                has_code=true
                continue
              fi
              if [[ "$old_mode" != 000000 && "$old_mode" != 100644 ]] ||
                 [[ "$new_mode" != 000000 && "$new_mode" != 100644 ]]; then
                has_code=true
                continue
              fi
              case "$path" in
                docs/*.md|docs/*.rst|docs/*.txt|README.md|CONTRIBUTING.md|CHANGELOG.md|CODE_OF_CONDUCT.md|SECURITY.md|LICENSE|LICENSE.md|LICENSE.txt)
                  has_docs=true ;;
                .github/workflows/*)
                  workflow_name=${path#.github/workflows/}
                  if [[ "$workflow_name" != */* && ( "$workflow_name" == *.yml || "$workflow_name" == *.yaml ) ]]; then
                    has_workflows=true
                  else
                    has_code=true
                  fi ;;
                *)
                  has_code=true ;;
              esac
            done < "$diff_paths"
            if [[ -n "${change-}" ]]; then
              has_code=true
            fi
            if [[ "$has_code" == false && "$has_workflows" == true ]]; then
              # LB-570: only tracked head files outside .github may opt in.
              if inside_worktree=$(git rev-parse --is-inside-work-tree) &&
                 [[ "$inside_worktree" == true ]] &&
                 workflow_tests=$(git ls-tree -r --name-only "$PR_HEAD" -- ':(top,literal)ci/workflow-tests'); then
                if [[ "$workflow_tests" != ci/workflow-tests ]]; then
                  grep_errors=$(mktemp "$RUNNER_TEMP/ci-workflow-deps.XXXXXXXX")
                  if git grep --no-textconv -F -l -e '.github/workflows' "$PR_HEAD" -- . ':(top,exclude).github' > /dev/null 2> "$grep_errors"; then
                    has_code=true
                  else
                    grep_status=$?
                    if [[ "$grep_status" -eq 1 && ! -s "$grep_errors" ]]; then
                      workflows_only=true
                      code=false
                    fi
                  fi
                fi
              fi
            elif [[ "$has_code" == false && "$has_docs" == true ]]; then
              docs_only=true
              code=false
            fi
          fi
          printf 'docs_only=%s\nworkflows_only=%s\ncode=%s\n' "$docs_only" "$workflows_only" "$code" >> "$GITHUB_OUTPUT"

  workflow-lint:
    name: workflow-lint
    needs: [authz]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: "Check out the exact head with full history"
        if: "${{ needs.authz.result == 'success' }}"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
          fetch-depth: 0
          persist-credentials: false
      - name: "Lint all workflow definitions with pinned actionlint v1.7.12"
        if: "${{ needs.authz.result == 'success' }}"
        shell: "bash"
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)
              archive=actionlint_1.7.12_linux_amd64.tar.gz
              sha256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 ;;
            aarch64|arm64)
              archive=actionlint_1.7.12_linux_arm64.tar.gz
              sha256=325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6 ;;
            *)
              echo "::error::workflow-lint requires a supported Linux architecture"
              exit 1 ;;
          esac
          lint_dir=$(mktemp -d "$RUNNER_TEMP/workflow-lint.XXXXXXXX")
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors --speed-limit 1024 --speed-time 60 \
            --output "$lint_dir/$archive" "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$archive"
          if ! printf '%s  %s\n' "$sha256" "$lint_dir/$archive" | sha256sum --check --strict --status; then
            echo "::error::actionlint archive checksum did not match the published pin"
            exit 1
          fi
          tar -xzf "$lint_dir/$archive" -C "$lint_dir" actionlint
          "$lint_dir/actionlint" -version
          git ls-files -z -- .github/workflows > "$lint_dir/workflows"
          workflows=()
          while IFS= read -r -d '' path; do
            case "$path" in
              *.yml|*.yaml) workflows+=("$path") ;;
            esac
          done < "$lint_dir/workflows"
          if [[ -n "${path-}" ]]; then
            echo "::error::unterminated Git workflow path"
            exit 1
          fi
          if [[ "${#workflows[@]}" -eq 0 ]]; then
            echo "::error::no workflow YAML files were found"
            exit 1
          fi
          "$lint_dir/actionlint" -config-file .github/actionlint.yaml -shellcheck= -pyflakes= "${workflows[@]}"
      - name: "Check App token environments"
        if: "${{ needs.authz.result == 'success' }}"
        shell: "bash"
        run: |
          set -euo pipefail
          python3 scripts/check_workflow_app_environments.py

  package-files:
    name: package-files
    needs: [authz]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: "Check out the exact head"
        if: "${{ needs.authz.result == 'success' }}"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
          fetch-depth: 0
          persist-credentials: false
      - name: "Require package metadata files"
        if: "${{ needs.authz.result == 'success' }}"
        shell: "bash"
        run: |
          set -eu
          test -f LICENSE
          test -f README.md
      - name: "Set up Python"
        if: "${{ needs.authz.result == 'success' }}"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: "Install test dependencies"
        if: "${{ needs.authz.result == 'success' }}"
        run: python -m pip install -e ".[dev]"
      - name: "Run license and entity check"
        if: "${{ needs.authz.result == 'success' }}"
        run: python -m pytest -q tests/test_license_entity.py

  pytest:
    needs: [authz, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        shard: [1, 2, 3, 4]
    env:
      PF_CI_LABELS: '["ubuntu-24.04"]'
      PYTHONHASHSEED: "0"
      PF_TEST_SHARD: "${{ matrix.shard }}/4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with dev extras
        run: python -m pip install -e ".[dev]"
      - name: Run test suite
        run: python -m pytest -q -n auto -rs --junitxml=pytest-results.xml
      - name: Retain pytest diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-${{ matrix.python-version }}-shard-${{ matrix.shard }}-${{ github.run_attempt }}
          path: pytest-results.xml
          if-no-files-found: error

  reference-engine:
    name: reference-engine
    # The end-to-end modules that compare today's generator with pinned
    # historical generators. Today's leg runs against engine main, built the
    # way the native job builds it; every historical leg runs against the
    # reference engine, the exact release commit below, which the tests read
    # from PINEFORGE_REFERENCE_ENGINE.
    # The reference engine is built on every run: the admission rules refuse
    # an Actions cache in every workflow, so a cache needs a base rule change
    # first (docs/ci.md). No timeout-minutes, like every other job here.
    needs: [authz, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      PYTHONHASHSEED: "0"
      CXX: /usr/bin/g++
      REFERENCE_ENGINE_SHA: "5718c5dc05086fc5b66b4cb565617efe837131e3"
    steps:
      - name: "Check out the exact head with full history"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - name: "Resolve public engine MAIN at job runtime"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pineforge-4pass/pineforge-engine
          ref: main
          path: engine
          persist-credentials: false
      - name: "Check out the reference engine at its exact release commit"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pineforge-4pass/pineforge-engine
          ref: "5718c5dc05086fc5b66b4cb565617efe837131e3"
          path: reference-engine
          persist-credentials: false
      - name: "Require the reference engine to be exactly that commit"
        shell: "bash"
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/reference-engine"
          mkdir -p "$out"
          head=$(git -C reference-engine rev-parse --verify 'HEAD^{commit}')
          if [[ "$head" != "$REFERENCE_ENGINE_SHA" ]]; then
            echo "::error::reference engine HEAD is $head, not $REFERENCE_ENGINE_SHA"
            exit 1
          fi
          {
            echo "reference engine: $head tree $(git -C reference-engine rev-parse --verify 'HEAD^{tree}')"
            echo "engine main: $(git -C engine rev-parse --verify 'HEAD^{commit}') tree $(git -C engine rev-parse --verify 'HEAD^{tree}')"
            echo "codegen: $(git -C candidate rev-parse --verify 'HEAD^{commit}')"
          } | tee "$out/identity.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: "Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: "Install with dev extras"
        shell: "bash"
        run: |
          set -euo pipefail
          cd candidate
          python -m pip install -e ".[dev]"
      - name: "Build engine main and fetch its public corpus feed"
        shell: "bash"
        run: |
          set -euo pipefail
          cmake -S engine -B engine/build -DCMAKE_BUILD_TYPE=Release \
            -DPINEFORGE_BUILD_TESTS=OFF -DPINEFORGE_BUILD_SOURCE_LAYER=ON \
            "-DCMAKE_CXX_COMPILER=$CXX"
          cmake --build engine/build --parallel "$(nproc)"
          git -C engine submodule update --init corpus
          git -C engine/corpus lfs pull
      - name: "Build the reference engine once"
        shell: "bash"
        run: |
          set -euo pipefail
          cmake -S reference-engine -B reference-engine/build -DCMAKE_BUILD_TYPE=Release \
            -DPINEFORGE_BUILD_TESTS=OFF -DPINEFORGE_BUILD_SOURCE_LAYER=ON \
            "-DCMAKE_CXX_COMPILER=$CXX"
          cmake --build reference-engine/build --parallel "$(nproc)"
      - name: "Run the historical generator comparisons"
        shell: "bash"
        run: |
          set -euo pipefail
          work="$GITHUB_WORKSPACE"
          out="$RUNNER_TEMP/reference-engine"
          eigen=""
          for dir in "$work/engine/build/_deps/eigen-src" /usr/include/eigen3; do
            if [[ -f "$dir/Eigen/Dense" ]]; then
              eigen=$dir
              break
            fi
          done
          if [[ -z "$eigen" ]]; then
            echo "::error::real Eigen headers missing"
            exit 1
          fi
          feed="$work/engine/corpus/data/ohlcv_ETH-USDT-USDT_1m.csv"
          for path in "$work/engine/include/pineforge/engine.hpp" \
                      "$work/engine/build/include/pineforge/version.h" \
                      "$work/engine/build/lib/libpineforge.a" \
                      "$work/engine/scripts/run_strategy.py" \
                      "$work/reference-engine/build/lib/libpineforge.a" \
                      "$work/reference-engine/scripts/run_strategy.py" \
                      "$feed"; do
            if [[ ! -s "$path" ]]; then
              echo "::error::required native input missing or empty: $path"
              exit 1
            fi
          done
          if [[ "$(stat -c %s "$feed")" -lt 1000000 ]]; then
            echo "::error::corpus 1m feed is an unsmudged LFS pointer: $feed"
            exit 1
          fi
          export PINEFORGE_ENGINE_INCLUDE="$work/engine/include"
          export PINEFORGE_GENERATED_INCLUDE="$work/engine/build/include"
          export PINEFORGE_ENGINE_LIB="$work/engine/build/lib/libpineforge.a"
          export PINEFORGE_EIGEN_INCLUDE="$eigen"
          export PINEFORGE_ENGINE_CORPUS="$work/engine/corpus"
          export PINEFORGE_REFERENCE_ENGINE="$work/reference-engine"
          export PINEFORGE_REQUIRE_NATIVE=1
          cd "$work/candidate"
          python -m pytest -q -n auto -ra --junitxml="$out/junit.xml" \
            tests/test_e2e_session_ismarket.py \
            tests/test_e2e_bar_magnifier_flag.py \
            tests/test_e2e_function_global_history.py \
            tests/test_e2e_strategy_defaults.py 2>&1 | tee "$out/pytest.log"
          python3 -I -c '
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          totals = {key: sum(int(suite.get(key, "0")) for suite in suites)
                    for key in ("tests", "errors", "failures", "skipped")}
          print("JUnit totals:", totals)
          if not totals["tests"] or totals["errors"] or totals["failures"] or totals["skipped"]:
              print("::error::every selected test must run and pass; a skip is not a pass")
              sys.exit(1)
          ' "$out/junit.xml"
      - name: "Retain identities, the pytest log and JUnit"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reference-engine-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reference-engine
          if-no-files-found: error

  test-check:
    needs: [authz, changes, workflow-lint, package-files, pytest]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: "Refuse an unauthorised run before anything else"
        if: "${{ needs.authz.result != 'success' }}"
        run: |
          echo "::error::authz did not pass; nothing of this run's code is checked out or run"
          exit 1
      - name: "Check out the exact head with full history"
        if: "${{ needs.authz.result == 'success' }}"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
          fetch-depth: 0
          persist-credentials: false
      - name: "Classify the PR diff (canonical; copy as is)"
        id: "classify"
        if: "${{ needs.authz.result == 'success' }}"
        shell: "bash"
        env:
          EVENT: "${{ github.event_name }}"
          PR_BASE: "${{ github.event.pull_request.base.sha }}"
          PR_HEAD: "${{ github.event.pull_request.head.sha }}"
        run: |
          set -euo pipefail
          docs_only=false
          workflows_only=false
          code=true
          if [[ "$EVENT" == pull_request ]]; then
            [[ "$PR_BASE" =~ ^[0-9a-f]{40}$ && "$PR_HEAD" =~ ^[0-9a-f]{40}$ ]]
            if ! checkout_head=$(git rev-parse --verify HEAD) ||
               ! git rev-parse --verify "$PR_BASE^{commit}" > /dev/null ||
               ! git rev-parse --verify "$PR_HEAD^{commit}" > /dev/null; then
              printf 'docs_only=false\nworkflows_only=false\ncode=true\n' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [[ "$checkout_head" == "$PR_HEAD" ]]
            diff_paths=$(mktemp "$RUNNER_TEMP/ci-changes.XXXXXXXX")
            if ! git diff --no-ext-diff --no-textconv --no-renames --ignore-submodules=none --raw --no-abbrev -z "$PR_BASE...$PR_HEAD" -- > "$diff_paths"; then
              printf 'docs_only=false\nworkflows_only=false\ncode=true\n' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            has_docs=false
            has_workflows=false
            has_code=false
            while IFS= read -r -d '' change; do
              if ! IFS= read -r -d '' path; then
                echo "::error::incomplete Git raw diff record"
                exit 1
              fi
              if [[ ! "$change" =~ ^:([0-7]{6})[[:space:]]([0-7]{6})[[:space:]] ]]; then
                echo "::error::invalid Git raw diff modes"
                exit 1
              fi
              old_mode=${BASH_REMATCH[1]}
              new_mode=${BASH_REMATCH[2]}
              if [[ ! "$change" =~ ^:[0-7]{6}\ [0-7]{6}\ [0-9a-f]{40}\ [0-9a-f]{40}\ [ACDMRTUXB][0-9]*$ ]]; then
                has_code=true
                continue
              fi
              if [[ "$old_mode" == 160000 || "$new_mode" == 160000 ]]; then
                has_code=true
                continue
              fi
              if [[ "$old_mode" != 000000 && "$old_mode" != 100644 ]] ||
                 [[ "$new_mode" != 000000 && "$new_mode" != 100644 ]]; then
                has_code=true
                continue
              fi
              case "$path" in
                docs/*.md|docs/*.rst|docs/*.txt|README.md|CONTRIBUTING.md|CHANGELOG.md|CODE_OF_CONDUCT.md|SECURITY.md|LICENSE|LICENSE.md|LICENSE.txt)
                  has_docs=true ;;
                .github/workflows/*)
                  workflow_name=${path#.github/workflows/}
                  if [[ "$workflow_name" != */* && ( "$workflow_name" == *.yml || "$workflow_name" == *.yaml ) ]]; then
                    has_workflows=true
                  else
                    has_code=true
                  fi ;;
                *)
                  has_code=true ;;
              esac
            done < "$diff_paths"
            if [[ -n "${change-}" ]]; then
              has_code=true
            fi
            if [[ "$has_code" == false && "$has_workflows" == true ]]; then
              # LB-570: only tracked head files outside .github may opt in.
              if inside_worktree=$(git rev-parse --is-inside-work-tree) &&
                 [[ "$inside_worktree" == true ]] &&
                 workflow_tests=$(git ls-tree -r --name-only "$PR_HEAD" -- ':(top,literal)ci/workflow-tests'); then
                if [[ "$workflow_tests" != ci/workflow-tests ]]; then
                  grep_errors=$(mktemp "$RUNNER_TEMP/ci-workflow-deps.XXXXXXXX")
                  if git grep --no-textconv -F -l -e '.github/workflows' "$PR_HEAD" -- . ':(top,exclude).github' > /dev/null 2> "$grep_errors"; then
                    has_code=true
                  else
                    grep_status=$?
                    if [[ "$grep_status" -eq 1 && ! -s "$grep_errors" ]]; then
                      workflows_only=true
                      code=false
                    fi
                  fi
                fi
              fi
            elif [[ "$has_code" == false && "$has_docs" == true ]]; then
              docs_only=true
              code=false
            fi
          fi
          printf 'docs_only=%s\nworkflows_only=%s\ncode=%s\n' "$docs_only" "$workflows_only" "$code" >> "$GITHUB_OUTPUT"
      - name: "Require success or independently proven cheap skips"
        if: "${{ needs.authz.result == 'success' }}"
        shell: "bash"
        env:
          NEEDS: "${{ toJSON(needs) }}"
          HEAVY_JOBS: "[\"pytest\"]"
          DOCS_ONLY: "${{ steps.classify.outputs.docs_only }}"
          WORKFLOWS_ONLY: "${{ steps.classify.outputs.workflows_only }}"
        run: |
          set -euo pipefail
          cd -- "$RUNNER_TEMP"
          python3 -I -c '
          import json
          import os
          import sys
          
          needs = json.loads(os.environ["NEEDS"])
          heavy = json.loads(os.environ["HEAVY_JOBS"])
          cheap = (os.environ["DOCS_ONLY"], os.environ["WORKFLOWS_ONLY"]) in {
              ("true", "false"), ("false", "true"),
          }
          valid = (isinstance(needs, dict) and isinstance(heavy, list) and bool(heavy)
                   and all(isinstance(name, str) and name in needs for name in heavy)
                   and all(isinstance(value, dict) for value in needs.values()))
          if valid:
              valid = all(needs.get(name, {}).get("result") == "success"
                          for name in ("authz", "changes", "workflow-lint"))
          if valid:
              valid = all(value.get("result") == "success"
                          or (name in heavy and value.get("result") == "skipped" and cheap)
                          for name, value in needs.items())
          if not valid:
              print("::error::a needed job did not succeed or was skipped without PR diff proof")
              sys.exit(1)
          '
