name: Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.sha }}
  cancel-in-progress: true

jobs:
  preflight-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.docs.outputs.docs_only }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Pin the documentation diff base
        id: base
        env:
          REF_NAME: ${{ github.ref_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$REF_NAME" = main ]; then
            base="$BEFORE_SHA"
          else
            base=$(git rev-parse refs/remotes/origin/main 2>/dev/null || true)
          fi
          if git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "sha=$base" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the base branch's trusted docs rule
        if: steps.base.outputs.sha != ''
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: .docs-gate
          persist-credentials: false

      - name: Preflight and documentation basis
        id: docs
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          checker=.docs-gate/.github/pineforge/ci/codegen-docs-check.mjs
          if [ -n "$BASE_SHA" ] && [ -f "$checker" ]; then
            node "$checker" "$PWD" "$BASE_SHA" "$HEAD_SHA" main
          else
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
          fi

  pytest:
    needs: preflight-docs
    if: needs.preflight-docs.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with dev extras
        run: python -m pip install -e ".[dev]"
      - name: Assert the compile-environment skip gate is enabled
        run: |
          python - <<'PY'
          import os
          import sys
          value = os.environ.get("PINEFORGE_SKIP_GATE", "").strip().lower()
          if value == "off":
              sys.stderr.write("PINEFORGE_SKIP_GATE=off is not allowed in CI: the skip gate must run\n")
              sys.exit(1)
          PY
      - name: Run test suite
        run: python -m pytest -q -rs

  engine-built:
    needs: preflight-docs
    if: needs.preflight-docs.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: "0"
      ENGINE_COMMIT: 4e01e96b5165b5d5e46d72bfbbf88ae6c035a6e9
      PINEFORGE_SKIP_PROFILE: engine_built
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
      - name: Install with dev extras
        run: python -m pip install -e ".[dev]"
      - name: Install the compile toolchain and Eigen
        run: |
          sudo apt-get update
          sudo apt-get install -y libeigen3-dev clang cmake g++ ninja-build
      - name: Clone and build the paired engine
        run: |
          set -euo pipefail
          git clone https://github.com/pineforge-4pass/pineforge-engine.git engine
          git -C engine checkout "$ENGINE_COMMIT"
          cmake -B build -S engine -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          lib="$(find "$PWD/build" -name libpineforge.a -print -quit)"
          if [ -z "$lib" ]; then
            echo "the engine build produced no libpineforge.a" >&2
            exit 1
          fi
          echo "libpineforge.a at: $lib"
          echo "PINEFORGE_ENGINE_LIB=$lib" >> "$GITHUB_ENV"
          echo "PINEFORGE_ENGINE_INCLUDE=$PWD/engine/include" >> "$GITHUB_ENV"
      - name: Assert the built library exists
        run: |
          set -euo pipefail
          test -f "$PINEFORGE_ENGINE_LIB" || { echo "no library at $PINEFORGE_ENGINE_LIB" >&2; exit 1; }
          test -f "$PINEFORGE_ENGINE_INCLUDE/pineforge/engine.hpp" || { echo "no engine headers under $PINEFORGE_ENGINE_INCLUDE" >&2; exit 1; }
      - name: Assert the compile-environment skip gate is enabled
        run: |
          python - <<'PY'
          import os
          import sys
          value = os.environ.get("PINEFORGE_SKIP_GATE", "").strip().lower()
          if value == "off":
              sys.stderr.write("PINEFORGE_SKIP_GATE=off is not allowed in CI: the skip gate must run\n")
              sys.exit(1)
          PY
      - name: Run the test suite with the engine present
        run: python -m pytest -q -rs
