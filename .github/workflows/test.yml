name: Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.sha }}
  cancel-in-progress: true

jobs:
  preflight-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.docs.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Pin the documentation diff base
        id: base
        env:
          REF_NAME: ${{ github.ref_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$REF_NAME" = main ]; then
            base="$BEFORE_SHA"
          else
            base=$(git rev-parse refs/remotes/origin/main 2>/dev/null || true)
          fi
          if git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "sha=$base" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the base branch's trusted docs rule
        if: steps.base.outputs.sha != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: .docs-gate
          persist-credentials: false

      - name: Preflight and documentation basis
        id: docs
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          checker=.docs-gate/.github/pineforge/ci/codegen-docs-check.mjs
          if [ -n "$BASE_SHA" ] && [ -f "$checker" ]; then
            node "$checker" "$PWD" "$BASE_SHA" "$HEAD_SHA" main
          else
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
          fi

  pytest:
    needs: preflight-docs
    if: needs.preflight-docs.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with dev extras
        run: python -m pip install -e ".[dev]"
      - name: Run test suite
        run: python -m pytest -q
