name: Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.sha }}
  cancel-in-progress: true

jobs:
  preflight-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.docs.outputs.docs_only }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Pin the documentation diff base
        id: base
        env:
          REF_NAME: ${{ github.ref_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$REF_NAME" = main ]; then
            base="$BEFORE_SHA"
          else
            base=$(git rev-parse refs/remotes/origin/main 2>/dev/null || true)
          fi
          if git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "sha=$base" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the base branch's trusted docs rule
        if: steps.base.outputs.sha != ''
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: .docs-gate
          persist-credentials: false

      - name: Preflight and documentation basis
        id: docs
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          checker=.docs-gate/.github/pineforge/ci/codegen-docs-check.mjs
          if [ -n "$BASE_SHA" ] && [ -f "$checker" ]; then
            node "$checker" "$PWD" "$BASE_SHA" "$HEAD_SHA" main
          else
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
          fi

  # Engine-less job. It runs a SINGLE interpreter: the skip gate's `default`
  # allowance counts were measured on python 3.12, and a count that moves with
  # the interpreter would make the gate's drift signal meaningless.
  # The engine-building twin of this job lives in gate.yml, where the blocking
  # aggregation can `needs:` it (a `needs:` cannot name a job in another
  # workflow); it is not run here.
  pytest:
    needs: preflight-docs
    if: needs.preflight-docs.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install with dev extras
        run: python -m pip install -e ".[dev]"
      - name: Assert the compile-environment skip gate is enabled
        run: |
          python - <<'PY'
          import os
          import sys
          value = os.environ.get("PINEFORGE_SKIP_GATE", "").strip().lower()
          if value == "off":
              sys.stderr.write("PINEFORGE_SKIP_GATE=off is not allowed in CI: the skip gate must run\n")
              sys.exit(1)
          PY
      - name: "Run test suite (single interpreter: the default allowance was measured on 3.12)"
        run: |
          set -eo pipefail
          python -m pytest -q -rs 2>&1 | tee pytest.log
          # Anchored to line start: the gate emits a leading empty line, since
          # pytest's -q progress line (".....[100%]") can lack a trailing newline.
          grep -q '^skip gate OK (default-deny)' pytest.log
