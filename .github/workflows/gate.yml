name: Pyodide Gate

on:
  workflow_dispatch:
  schedule:
    - cron: "27 5 * * *"
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions: {}

concurrency:
  group: gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.docs.outputs.docs_only }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          path: .docs-gate
          persist-credentials: false

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        if: github.event_name == 'pull_request_target'
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          path: .candidate
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Preflight and documentation basis
        id: docs
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          checker=.docs-gate/.github/pineforge/ci/codegen-docs-check.mjs
          if [ "$EVENT_NAME" = pull_request_target ] && [ "$BASE_BRANCH" = main ] && [ -f "$checker" ]; then
            node "$checker" "$PWD/.candidate" "$BASE_SHA" "$HEAD_SHA" "$BASE_BRANCH" > "$RUNNER_TEMP/codegen-docs-diff.json"
          else
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Retain docs-only diff proof
        if: steps.docs.outputs.docs_only == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codegen-docs-diff
          path: ${{ runner.temp }}/codegen-docs-diff.json

  differential:
    needs: preflight-docs
    if: needs.preflight-docs.outputs.docs_only != 'true' && (github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install codegen and node dependencies
        run: |
          python -m pip install -e .
          npm ci
      - name: Selftest
        run: npm run gate:selftest
      - name: Audit Node dependencies
        run: npm audit --audit-level=high
      - name: Run differential gate
        run: npm run gate:full
      - name: Upload release.json
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-json
          path: release.json
          if-no-files-found: ignore

  pytest:
    needs: preflight-docs
    if: needs.preflight-docs.outputs.docs_only != 'true' && (github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with dev extras
        run: python -m pip install -e ".[dev]"
      - name: Run test suite
        run: python -m pytest -q

  gate:
    if: always()
    needs: [preflight-docs, differential, pytest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      statuses: write
    steps:
      - name: Report exact-head gate status
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PREFLIGHT_RESULT: ${{ needs.preflight-docs.result }}
          DOCS_ONLY: ${{ needs.preflight-docs.outputs.docs_only }}
          DIFFERENTIAL_RESULT: ${{ needs.differential.result }}
          PYTEST_RESULT: ${{ needs.pytest.result }}
          SAME_REPO: ${{ github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          state=failure
          description='Codegen gate did not pass'
          if [ "$PREFLIGHT_RESULT" = success ]; then
            if [ "$DOCS_ONLY" = true ] && [ "$DIFFERENTIAL_RESULT" = skipped ] && [ "$PYTEST_RESULT" = skipped ]; then
              state=success
              description='docs-only preflight+docs; no sweep'
            elif [ "$DOCS_ONLY" != true ] && [ "$SAME_REPO" = true ] && [ "$DIFFERENTIAL_RESULT" = success ] && [ "$PYTEST_RESULT" = success ]; then
              state=success
              description='Full codegen differential gate and pytest passed'
            fi
          fi
          if [ "$state" != success ] && [ "$SAME_REPO" != true ]; then
            description="Fork PR: a maintainer must push this branch to $GITHUB_REPOSITORY and open a PR from it for the full gate"
            prior=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/statuses?per_page=100" \
              --jq '[.[] | select(.context == "gate")][0] | "\(.state) \(.creator.login)"' || true)
            if [ "$prior" = "success github-actions[bot]" ]; then
              echo "gate already passed on $HEAD_SHA in this repository; a fork's run leaves it"
              exit 0
            fi
          fi
          if [ "$EVENT_NAME" = pull_request_target ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
              -f context=gate -f state="$state" -f description="$description" \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
          [ "$state" = success ]
