name: Release

# Manual release: bump VERSION, build both distributions, publish to PyPI via
# Trusted Publishing (OIDC — no stored token), then commit + tag + create a
# GitHub Release. VERSION is semver; scripts/release_version.py gives each
# channel its spelling. A prerelease (override 1.0.0-rc.1) ships PyPI 1.0.0rc1,
# tag v1.0.0-rc.1 as a GitHub prerelease, npm 1.0.0-rc.1 on dist-tag next
# (publish-pyodide.yml) and tells the hub prerelease=true: never `latest`.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump applied to VERSION file."
        required: true
        type: choice
        default: patch
        options: [patch, minor, major]
      override:
        description: "Optional explicit version above VERSION, e.g. 1.0.0-rc.1 or 1.0.0 (overrides bump; required when VERSION is a prerelease). Leave blank to auto-bump."
        required: false
        type: string
        default: ""
      dry_run:
        description: "Skip PyPI publish + tag; only build + show the new version."
        required: false
        type: boolean
        default: false
      claim_placeholder:
        description: "claims the PyPI name tunaxis-codegen with a 0.0.1 placeholder"
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # commit + tag + create release
  id-token: write   # PyPI Trusted Publishing (OIDC)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !inputs.claim_placeholder }}
    runs-on: ubuntu-latest
    env:
      BUMP:          ${{ inputs.bump }}
      OVERRIDE:      ${{ inputs.override }}
      PYTHONHASHSEED: "0"   # deterministic gate runtime (match gate.yml)
    steps:
      # Org GitHub App token (no PAT — never expires). Authorizes BOTH the
      # release commit/tag push to protected main (the App is a bypass actor on
      # the org ruleset) AND the downstream hub dispatch. Scoped to this repo +
      # the hub. Minted first so checkout can push with it.
      - name: Mint org App token
        id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PINEFORGE_APP_ID }}
          private-key: ${{ secrets.PINEFORGE_APP_PRIVATE_KEY }}
          owner: pineforge-4pass
          repositories: pineforge-codegen-oss,pineforge-release

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
          # App token bypasses the main ruleset for the release commit/tag push.
          token: ${{ steps.app.outputs.token }}

      - name: Compute new version
        id: ver
        run: |
          set -euo pipefail
          cur=$(tr -d '[:space:]' < VERSION)
          # Emits cur, new and new's channel spellings: pypi, npm, npm_dist_tag,
          # git_tag, prerelease. Fails on a VERSION or override without them.
          python3 scripts/release_version.py next --current="$cur" --bump="$BUMP" --override="$OVERRIDE" \
            | tee -a "$GITHUB_OUTPUT"

      - name: Write VERSION
        env:
          NEW_VERSION: ${{ steps.ver.outputs.new }}
        run: printf '%s\n' "$NEW_VERSION" > VERSION

      - name: Show diff
        run: git --no-pager diff

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.14"   # match the gate's runtime

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"

      # Conformance gate (BLOCKING): the differential parity gate must pass
      # before anything is built, published, or tagged. A gate-broken codegen
      # fails the release here — nothing reaches PyPI, no tag is pushed (so the
      # tag->npm trigger never fires), and no GitHub Release is created.
      - name: Run conformance gate (blocking)
        run: |
          python -m pip install -e ".[dev]" hatchling
          python -m pytest -ra tests/test_tunaxis_rename.py
          npm ci
          npm audit --audit-level=high
          npm run gate:selftest
          npm run gate:full

      - name: Build sdist + wheel
        env:
          PYPI_VERSION: ${{ steps.ver.outputs.pypi }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade build hatchling
          python -m build --outdir dist/tunaxis
          python scripts/build_shim.py --outdir dist/shim
          ls -l dist/tunaxis/ dist/shim/
          # hatchling normalizes VERSION to PEP 440 (1.0.0-rc.1 builds 1.0.0rc1):
          # the spelling PyPI serves and the hub probes.
          test -f "dist/tunaxis/tunaxis_codegen-${PYPI_VERSION}.tar.gz" \
            || { echo "::error::no tunaxis-codegen sdist for ${PYPI_VERSION}"; exit 1; }
          ls "dist/tunaxis/tunaxis_codegen-${PYPI_VERSION}-"*.whl >/dev/null \
            || { echo "::error::no tunaxis-codegen wheel for ${PYPI_VERSION}"; exit 1; }
          test -f "dist/shim/pineforge_codegen-${PYPI_VERSION}.tar.gz" \
            || { echo "::error::no pineforge-codegen shim sdist for ${PYPI_VERSION}"; exit 1; }
          ls "dist/shim/pineforge_codegen-${PYPI_VERSION}-"*.whl >/dev/null \
            || { echo "::error::no pineforge-codegen shim wheel for ${PYPI_VERSION}"; exit 1; }

      # Publish to PyPI BEFORE the tag is pushed. The tag push triggers
      # publish-pyodide.yml (npm), so PyPI must land first — otherwise a PyPI
      # failure would leave npm shipping a version PyPI never got.
      - name: Publish tunaxis-codegen to PyPI
        if: ${{ !inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist/tunaxis/

      # Separate Trusted Publishing project, after its exact dependency lands.
      - name: Publish pineforge-codegen shim to PyPI
        if: ${{ !inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist/shim/

      # Commit + tag + push AFTER PyPI succeeds. The `git push --tags` triggers
      # publish-pyodide.yml for npm (which re-runs the gate — defense in depth),
      # so the tag only exists once the gate passed and PyPI published.
      - name: Commit + tag + push
        if: ${{ !inputs.dry_run }}
        env:
          NEW_VERSION: ${{ steps.ver.outputs.new }}
          GIT_TAG: ${{ steps.ver.outputs.git_tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "release: v${NEW_VERSION}"
          git tag "${GIT_TAG}"
          git push origin HEAD --tags

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          # Org disables write for the default Actions token; use the App token.
          GH_TOKEN:     ${{ steps.app.outputs.token }}
          GIT_TAG:      ${{ steps.ver.outputs.git_tag }}
          PYPI_VERSION: ${{ steps.ver.outputs.pypi }}
          PRERELEASE:   ${{ steps.ver.outputs.prerelease }}
        run: |
          set -euo pipefail
          case "$PRERELEASE" in true|false) ;; *) echo "::error::no prerelease verdict ('${PRERELEASE}')"; exit 1 ;; esac
          # A prerelease is a GitHub prerelease and never "Latest".
          channel=()
          if [ "$PRERELEASE" = true ]; then channel=(--prerelease --latest=false); fi
          # The diagnostics catalog (docs/PUBLIC_CONTRACT.md, "Diagnostic codes").
          catalog="diagnostics_catalog-${GIT_TAG}.json"
          cp tunaxis_codegen/diagnostics_catalog.json "${catalog}"
          gh release create "${GIT_TAG}" \
            --title "${GIT_TAG}" \
            --generate-notes \
            --notes "Install: \`pip install tunaxis-codegen==${PYPI_VERSION}\`. The \`pineforge-codegen\` package forwards to the same Tunaxis version." \
            ${channel[@]+"${channel[@]}"} \
            dist/tunaxis/* dist/shim/* "${catalog}"

      # Notify the pineforge-release hub: it bumps its CODEGEN_VERSION pin,
      # rebuilds the combined image, and fans out to the MCPs. FAIL LOUD (no
      # continue-on-error) — a dropped notify means downstream never picks up the
      # new codegen. Uses the App token minted above (no PAT). Runs AFTER the
      # PyPI publish so the version is installable.
      - name: Dispatch codegen-release -> pineforge-release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN:    ${{ steps.app.outputs.token }}
          NEW_VERSION: ${{ steps.ver.outputs.new }}
          PRERELEASE:  ${{ steps.ver.outputs.prerelease }}
          RUN_ID:      ${{ github.run_id }}
        run: |
          set -euo pipefail
          # The hub pairs codegen X.Y.Z with engine vX.Y.Z (prerelease included).
          gh api repos/pineforge-4pass/pineforge-release/dispatches \
            -f event_type=codegen-release \
            -F "client_payload[version]=${NEW_VERSION}" \
            -F "client_payload[prerelease]=${PRERELEASE}" \
            -F "client_payload[run_id]=${RUN_ID}"
          echo "dispatched codegen-release -> pineforge-release (${NEW_VERSION}, prerelease=${PRERELEASE})"

  # A claim run passes the default bump (patch), which the skipped release job never reads.
  # The shared concurrency group release prevents a claim from overlapping a release.
  claim-name:
    if: ${{ inputs.claim_placeholder }}
    runs-on: ubuntu-24.04
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"

      - name: Write placeholder package
        id: claim
        run: |
          set -euo pipefail
          CLAIM_DIR=$RUNNER_TEMP/claim
          mkdir -p "$CLAIM_DIR"
          cd "$CLAIM_DIR"
          mkdir tunaxis_codegen
          printf 'path=%s\n' "$CLAIM_DIR" >> "$GITHUB_OUTPUT"
          printf 'dist=%s/dist\n' "$CLAIM_DIR" >> "$GITHUB_OUTPUT"
          cat > pyproject.toml <<'TOML'
          [build-system]
          requires = ["hatchling"]
          build-backend = "hatchling.build"

          [project]
          name = "tunaxis-codegen"
          version = "0.0.1"
          description = "Tunaxis: first release coming soon."
          readme = "README.md"
          requires-python = ">=3.11"
          license = { text = "Proprietary" }
          classifiers = [
            "Development Status :: 1 - Planning",
            "License :: Other/Proprietary License",
            "Programming Language :: Python :: 3",
          ]

          [tool.hatch.build.targets.wheel]
          packages = ["tunaxis_codegen"]

          [tool.hatch.build.targets.sdist]
          include = ["tunaxis_codegen", "README.md", "pyproject.toml"]
          TOML
          cat > README.md <<'README'
          Tunaxis: first release coming soon. https://tunaxis.com
          README
          cat > tunaxis_codegen/__init__.py <<'PY'
          __version__ = "0.0.1"
          PY

      - name: Build placeholder sdist + wheel
        working-directory: ${{ steps.claim.outputs.path }}
        run: |
          set -euo pipefail
          python -m pip install build
          python -m build

      - name: Verify placeholder artifacts
        working-directory: ${{ steps.claim.outputs.path }}
        run: |
          set -euo pipefail
          cat > verify.py <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          dist = Path('dist')
          sdist = 'tunaxis_codegen-0.0.1.tar.gz'
          wheel = 'tunaxis_codegen-0.0.1-py3-none-any.whl'
          assert {path.name for path in dist.iterdir()} == {sdist, wheel}
          assert all(path.is_file() for path in dist.iterdir())
          with zipfile.ZipFile(dist / wheel) as archive:
              names = archive.namelist()
              info = 'tunaxis_codegen-0.0.1.dist-info/'
              assert 'tunaxis_codegen/__init__.py' in names
              assert info + 'METADATA' in names
              assert all(name == 'tunaxis_codegen/__init__.py' or name.startswith(info) for name in names)
              archive.extractall('unpacked-wheel')
          with tarfile.open(dist / sdist) as archive:
              archive.extractall('unpacked-sdist', filter='data')
          readme = Path('unpacked-sdist/tunaxis_codegen-0.0.1/README.md')
          assert readme.read_bytes() == b'Tunaxis: first release coming soon. https://tunaxis.com\n'
          PY
          python ./verify.py
          if grep -ri pineforge unpacked-sdist unpacked-wheel; then
            exit 1
          else
            test $? -eq 1
          fi

      - name: Publish placeholder to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: ${{ steps.claim.outputs.dist }}
