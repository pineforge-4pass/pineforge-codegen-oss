name: GKE PR

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

run-name: "gke-pr #${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }}"

permissions: {}

concurrency:
  group: gke-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Only this workflow at refs/heads/main belongs in the PR runner allowlist.
# Admission executes the base checker; the candidate workflows are data.
jobs:
  admit:
    runs-on: ubuntu-24.04
    permissions: {contents: read}
    outputs:
      allowed: ${{ steps.allowed.outputs.allowed }}
      base_sha: ${{ steps.identity.outputs.base_sha }}
      head_sha: ${{ steps.identity.outputs.head_sha }}
    steps:
      - name: Check out the base checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind the live PR and all actors
        id: identity
        env:
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
          HEAD_IS_FORK: ${{ toJSON(github.event.pull_request.head.repo.fork) }}
          DRAFT: ${{ toJSON(github.event.pull_request.draft) }}
          BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login || '' }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor || '' }}
          ACTOR: ${{ github.actor || '' }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -I tests/test_gke_pr_admission.py --identity
      - name: Judge head workflows as data with the base rules
        env:
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.identity.outputs.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -I tests/test_gke_pr_admission.py --workflows
      - name: Admit the checked immutable head
        id: allowed
        run: echo "allowed=true" >> "$GITHUB_OUTPUT"

  workflow-lint:
    needs: [admit]
    if: ${{ needs.admit.outputs.allowed == 'true' }}
    runs-on: gke-8cpu-16gb-amd64
    permissions: {contents: read}
    steps:
      - name: Check out the admitted head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.admit.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Lint workflows and check App token environments
        run: python3 -I tests/test_gke_pr_admission.py --lint

  package-files:
    needs: [admit]
    if: ${{ needs.admit.outputs.allowed == 'true' }}
    runs-on: gke-8cpu-16gb-amd64
    permissions: {contents: read}
    steps:
      - name: Check out the admitted head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.admit.outputs.head_sha }}
          persist-credentials: false
      - name: Require package metadata files
        run: |
          set -euo pipefail
          test -f LICENSE
          test -f README.md
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check the license and entity
        run: python -m pytest -q tests/test_license_entity.py

  pytest:
    needs: [admit]
    if: ${{ needs.admit.outputs.allowed == 'true' }}
    runs-on: gke-8cpu-16gb-amd64
    permissions: {contents: read}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      PF_CI_LABELS: '["self-hosted","pf-ci","pf-ci-x64"]'
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out the admitted head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.admit.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with dev extras
        run: python -m pip install -e ".[dev]"
      - name: Run the test suite
        run: python -m pytest -q

  differential:
    needs: [admit]
    if: ${{ needs.admit.outputs.allowed == 'true' }}
    runs-on: gke-8cpu-16gb-amd64
    permissions: {contents: read}
    env:
      PF_CI_LABELS: '["self-hosted","pf-ci","pf-ci-x64"]'
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out the admitted head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.admit.outputs.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install codegen and Node dependencies
        run: |
          set -euo pipefail
          python -m pip install -e .
          npm ci
      - name: Selftest
        run: npm run gate:selftest
      - name: Audit Node dependencies
        run: npm audit --audit-level=high
      - name: Run the differential gate
        run: npm run gate:full
      - name: Retain differential diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-json
          path: release.json
          if-no-files-found: ignore

  test-check:
    needs: [admit, workflow-lint, package-files, pytest]
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require actual successful test legs
        env:
          NEEDS: ${{ toJSON(needs) }}
        shell: python3 {0}
        run: |
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS"])
          expected = {"admit", "workflow-lint", "package-files", "pytest"}
          passed = (
              isinstance(needs, dict) and set(needs) == expected
              and all(isinstance(row, dict) and row.get("result") == "success"
                      for row in needs.values())
              and needs["admit"].get("outputs", {}).get("allowed") == "true"
          )
          if not passed:
              print("::error::PR admission or a test leg did not succeed")
          sys.exit(0 if passed else 1)

  result:
    name: gate
    needs: [admit, workflow-lint, package-files, pytest, differential, test-check]
    if: always()
    runs-on: ubuntu-24.04
    permissions: {contents: read, statuses: write}
    steps:
      - name: Check out the base result checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Report the exact event head after a live identity recheck
        env:
          NEEDS: ${{ toJSON(needs) }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
          HEAD_IS_FORK: ${{ toJSON(github.event.pull_request.head.repo.fork) }}
          DRAFT: ${{ toJSON(github.event.pull_request.draft) }}
          BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login || '' }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor || '' }}
          ACTOR: ${{ github.actor || '' }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -I tests/test_gke_pr_admission.py --result
